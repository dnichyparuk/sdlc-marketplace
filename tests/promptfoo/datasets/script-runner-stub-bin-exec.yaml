# Script execution tests for the `script_stub_bin` PATH-prepend var added to
# tests/promptfoo/providers/script-runner.js (resolves issue #290 — Option B).
# Verifies (a) stub binary on PATH is invoked, (b) bad path returns provider
# error, (c) without the var, no stub marker appears (negative control).
#
# Fixture: tests/promptfoo/fixtures-fs/stub-bin-gh/
#   bin/gh    — executable shell stub printing "STUB-GH-INVOKED <args>"
#   runner.js — invokes `gh --version` via execSync (PATH lookup)

# AC1 — Positive: script_stub_bin set → stub `gh` intercepts PATH lookup, marker visible.
- description: "script_stub_bin: stub gh on PATH is invoked instead of real gh"
  vars:
    project_root: "file://fixtures-fs/stub-bin-gh"
    script_path: "{{project_root}}/runner.js"
    script_cwd: "{{project_root}}"
    script_stub_bin: "bin"
  assert:
    - type: contains
      value: "STUB-GH-INVOKED"

# AC2 — Error path: script_stub_bin points to non-existent dir → provider returns error.
# Uses error-runner.js wrapper to invoke the provider's callApi directly, so the
# `{error}` response can be asserted via stdout. (Provider's `{error}` return is
# classified as ERROR by promptfoo, not PASS/FAIL — wrapper bridges that gap.)
- description: "script_stub_bin: non-existent path returns provider error"
  vars:
    project_root: "file://fixtures-fs/stub-bin-gh"
    script_path: "{{project_root}}/error-runner.js"
    script_args: "{{repo_root}}/tests/promptfoo/providers/script-runner.js"
    script_cwd: "{{project_root}}"
  assert:
    - type: contains
      value: "script_stub_bin path not found or not a directory"

# AC3 — Negative control: no script_stub_bin set → STUB marker is absent (var actually toggles behavior).
- description: "script_stub_bin: omitted var does not silently apply a stub (no marker in output)"
  vars:
    project_root: "file://fixtures-fs/stub-bin-gh"
    script_path: "{{project_root}}/runner.js"
    script_cwd: "{{project_root}}"
  assert:
    - type: not-contains
      value: "STUB-GH-INVOKED"

# No script_cwd → the stub path resolves against tests/promptfoo, not the per-case temp cwd.
- description: "script_stub_bin: a relative path without script_cwd resolves against tests/promptfoo"
  vars:
    script_path: "-e"
    script_args: 'console.log(require("child_process").execSync("gh\x20--version").toString())'
    script_stub_bin: "fixtures-fs/stub-bin-gh/bin"
  assert:
    - type: contains
      value: "STUB-GH-INVOKED --version"

# W8.7 — the provider retries a spawn ENOENT (binary briefly absent during a CLI auto-update).
- description: "claude-cli-provider: spawn ENOENT is retried until the binary is back"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-claude-cli-enoent-retry.js"
  assert:
    - type: icontains
      value: "STUB-OK"
    - type: not-icontains
      value: "ENOENT"

- description: "claude-cli-provider: a usage-limit refusal names the limit and latches (second call does not spawn)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-claude-cli-limit-stub.js"
    script_args: "limit"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output); r.calls === 1 && r.first.error.includes('claude -p usage limit reached') && r.first.error.includes('resets 9pm') && r.second.error === r.first.error"

- description: "claude-cli-provider: a non-limit failure reports the exit code and stdout tail"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-claude-cli-limit-stub.js"
    script_args: "exit"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output); r.result.error.includes('exit: 3') && r.result.error.includes('TAIL-MARKER-77') && !r.result.error.includes('usage limit')"

- description: "claude-cli-provider: limit text on a zero exit is returned as output, not an error"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-claude-cli-limit-stub.js"
    script_args: "ok"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output); r.result.output.includes('hit your') && r.result.error === undefined"

- description: "script-runner exit: (a) metadata.exitCode is set and the output has no exit line by default"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-script-runner-exit.js"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output.split('\\n')[0]); r.plain3.metadata.exitCode === 3 && r.plain3.output === 'CHILD-OUT\\nCHILD-ERR'"

- description: "script-runner exit: (b) script_show_exit appends [exit N] as the last line, after stderr"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-script-runner-exit.js"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output.split('\\n')[0]); r.show3.output === 'CHILD-OUT\\nCHILD-ERR\\n[exit 3]' && r.show0.output === 'CHILD-OUT\\n[exit 0]' && r.show0.metadata.exitCode === 0"

- description: "script-runner exit: (c) an assertion reads context.metadata.exitCode of a real run"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-script-runner-exit.js"
    script_args: "--child 4"
  assert:
    - type: javascript
      value: "context.metadata.exitCode === 4 && output.includes('CHILD-OUT')"

- description: "script-runner exit: (d) script_show_exit prints [exit 0] on a clean run"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-script-runner-exit.js"
    script_args: "--child 0"
    script_show_exit: true
  assert:
    - type: javascript
      value: "output.endsWith('[exit 0]') && context.metadata.exitCode === 0"

- description: "script-runner: a case without script_cwd runs in its own temp dir that is removed afterwards"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-script-runner-exit.js"
    script_args: "--cwd-probe"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output.split('\\n')[0]); r.inTmp === true && r.existsAfter === false && r.cwd.split('/').pop().startsWith('promptfoo-cwd-')"

- description: "script-runner: git ssh and prompt are off by default"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-script-runner-exit.js"
    script_args: "--cwd-probe"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output.split('\\n')[0]); r.ssh === 'false' && r.prompt === '0'"

- description: "script-runner: script_env overrides the git defaults"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-script-runner-exit.js"
    script_args: "--cwd-probe"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output.split('\\n')[0]); r.override === 'ssh -o BatchMode=yes'"

# An in-repo script_home is copied per case: HOME is outside the repository, the repo fixture
# stays untouched and the per-case copy is gone after the case.
- description: "script-runner: an in-repo script_home is copied per case and the repo fixture stays untouched"
  vars:
    script_path: "-e"
    script_args: 'require("fs").writeFileSync(process.env.HOME+"/probe-home.txt","x");console.log(process.env.HOME)'
    script_home: "fixtures-fs/github-sdlc-home"
  assert:
    - type: javascript
      value: |
        const fs = process.getBuiltinModule('fs');
        const path = process.getBuiltinModule('path');
        const home = output.trim();
        const repoRoot = path.resolve(process.cwd(), '../..');
        return path.relative(repoRoot, home).startsWith('..')
          && !fs.existsSync(path.join(repoRoot, 'tests/promptfoo/fixtures-fs/github-sdlc-home/probe-home.txt'))
          && !fs.existsSync(home);

# A script_home outside the repository is used as is (no copy).
- description: "script-runner: a script_home outside the repo is used as is"
  vars:
    script_path: "-e"
    script_args: 'console.log(process.env.HOME)'
    script_home: "/nonexistent-home-for-script-runner-test"
  assert:
    - type: equals
      value: "/nonexistent-home-for-script-runner-test"
