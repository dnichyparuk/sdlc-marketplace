    script_args: "--op budget-model-limits"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output); r.haiku === 300000 && r.sonnet === 3000000 && r.opus === 3000000"

- description: "execute-plan-sdlc/wave-runner-overflow/dispatch-budget: config override lowers maxConcurrentTasks"
