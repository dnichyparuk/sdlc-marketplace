  vars:
    script_path: "-e"
    script_args: '((cp,fs,os,t=fs.mkdtempSync(os.tmpdir()+"/spec-review-"),f=t+"/execute-fix-cleanup-20261020T120000Z.json",js="{{repo_root}}/plugins/sdlc-utilities/scripts/state/execute.js",env=Object.assign({},process.env,{SDLC_STATE_DIR_OVERRIDE:t}),run=(a)=>cp.spawnSync("node",[js].concat(a),{env:env,encoding:"utf8"}),o=(fs.copyFileSync(process.cwd()+"/state-spec-review-unrecorded.json",f),JSON.parse(fs.readFileSync(f,"utf8"))),a=run(["spec-review","--branch","fix/cleanup","--status","ran","--reason","a"]),b=run(["spec-review","--branch","fix/cleanup","--status","skipped","--reason","b"]),d=JSON.parse(fs.readFileSync(f,"utf8")),v1=run(["verify-completeness","--final","--state-file",f]),v2=run(["verify-completeness","--final","--state-file",f]))=>(fs.rmSync(t,{recursive:true,force:true}),console.log(JSON.stringify({a:a.status,b:b.status,second:d.specReview.status==="skipped"&&d.specReview.reason==="b",rest:JSON.stringify(Object.assign({},d,{specReview:undefined}))===JSON.stringify(o),v:[v1.status,v2.status],same:v1.stdout===v2.stdout&&v1.stderr===v2.stderr}))))(require("child_process"),require("fs"),require("os"))'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/execute-overflow"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output); r.a === 0 && r.b === 0 && r.second === true && r.rest === true && r.v[0] === 0 && r.v[1] === 0 && r.same === true"

- description: "execute-plan-sdlc/cleanup-verify: (R94) a state with specReviewRequired and no record is kept and cleanup exits 65"
  vars:
    script_path: "-e"
    script_args: '((cp,fs,os,t=fs.mkdtempSync(os.tmpdir()+"/spec-cleanup-"),f=t+"/execute-fix-cleanup-20261020T120000Z.json",c=fs.copyFileSync(process.cwd()+"/state-spec-review-unrecorded.json",f),r=cp.spawnSync("node",["{{repo_root}}/plugins/sdlc-utilities/scripts/state/execute.js","cleanup","--branch","fix/cleanup"],{env:Object.assign({},process.env,{SDLC_STATE_DIR_OVERRIDE:t}),encoding:"utf8"}),k=fs.existsSync(f))=>(fs.rmSync(t,{recursive:true,force:true}),console.log(JSON.stringify({status:r.status,kept:k,stderr:r.stderr}))))(require("child_process"),require("fs"),require("os"))'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/execute-overflow"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output); r.status === 65 && r.kept === true && r.stderr.includes('unrecorded')"

