# Exec test cases for wave-runner context-overflow hardening (#432).
# Tests run real scripts against fixture state files — no LLM involved.
# All descriptions use the "execute-plan-sdlc/wave-runner-overflow/" prefix
# so `--filter-pattern "execute-plan-sdlc/wave-runner-overflow"` matches.
#
# Covered modules: task-factsheet.js, dispatch-budget.js, state.js::summarizePriorWaveContext,
#   wave-summary.js::parseWaveSummary, wave-split.js::splitWave,
#   state/execute.js::verify-completeness, state/execute.js::wave-split subcommand.

# ---------------------------------------------------------------------------
# task-factsheet.js — fact-sheet path determinism
# ---------------------------------------------------------------------------

- description: "execute-plan-sdlc/wave-runner-overflow/task-factsheet: path is deterministic and T3/3 normalize to same file (R-IDNORM)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/wave-overflow-test.js"
    script_args: "--op factsheet-path"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output); r.same === true && r.containsTaskId === true && r.idNormSame === true"

- description: "execute-plan-sdlc/wave-runner-overflow/task-factsheet: renderFactSheet emits ## Contract for a contract-bearing task and omits it otherwise (R-CONTRACT, #459)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/wave-overflow-test.js"
    script_args: "--op render-contract"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output); r.hasContractSection === true && r.contractBeforeAcceptance === true && r.noContractSection === true"

- description: "execute-plan-sdlc/wave-runner-overflow/task-factsheet: renderFactSheet emits ## Notes (rationale) for a task with description and omits the heading when absent"
  vars:
    script_path: "repo://tests/promptfoo/scripts/wave-overflow-test.js"
    script_args: "--op render-notes"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output); r.hasNotesSection === true && r.noNotesSection === true"

- description: "execute-plan-sdlc/wave-runner-overflow/task-factsheet: renderFactSheet emits ## Scratch directory when TMPDIR is set and omits it otherwise"
  vars:
    script_path: "repo://tests/promptfoo/scripts/wave-overflow-test.js"
    script_args: "--op render-tmpdir"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output); r.hasScratch === true && r.scratchPathShown === true && r.noScratchUnset === true && r.noScratchRelative === true && r.noScratchEmpty === true"

# ---------------------------------------------------------------------------
# dispatch-budget.js — byte-budget computation
# ---------------------------------------------------------------------------

- description: "execute-plan-sdlc/wave-runner-overflow/dispatch-budget: tight byte budget reduces maxConcurrentTasks"
  vars:
