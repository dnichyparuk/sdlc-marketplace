- description: "execute-plan-sdlc/wave-runner-overflow/verify-completeness: (R94) --final passes a skipped record with a reason and a state without specReviewRequired"
  vars:
    script_path: "-e"
    script_args: '((cp,js,d)=>console.log(JSON.stringify(["state-spec-review-skipped.json","state-all-done.json"].map(f=>cp.spawnSync("node",[js,"verify-completeness","--final","--state-file",d+"/"+f],{encoding:"utf8"})).map(r=>r.status))))(require("child_process"),"{{repo_root}}/plugins/sdlc-utilities/scripts/state/execute.js","{{project_root}}")'
