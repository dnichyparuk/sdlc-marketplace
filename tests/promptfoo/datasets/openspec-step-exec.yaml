# Script execution tests for skill/openspec-step.js (detect | flip | validate | archive).
# No LLM. Cases 1-5, 11 and 12 call the script directly; the rest go through
# tests/promptfoo/scripts/run-openspec-step.js, which makes several script calls per case
# and reads `git log` after an archive. The stub `openspec` CLI lives in the
# project-openspec-step-archive fixture (bin/), put on PATH with script_stub_bin.

- description: "openspec-step: detect on an active change reports it (single-active)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/openspec-step.js"
    script_args: "detect --project-root {{project_root}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-openspec-active"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        if (o.detected !== true || o.changeName !== 'add-auth' || o.matchedBy !== 'single-active') return `FAIL: ${output}`;
        if (JSON.stringify(o.activeChanges) !== JSON.stringify(['add-auth'])) return `FAIL activeChanges: ${output}`;
        if (typeof o.proposalPath !== 'string' || !o.proposalPath.endsWith('openspec/changes/add-auth/proposal.md')) return `FAIL proposalPath: ${output}`;
        if (o.designPath !== null) return `FAIL designPath: ${output}`;
        if (!Array.isArray(o.specPaths) || o.specPaths.length !== 1) return `FAIL specPaths: ${output}`;
        return true;

- description: "openspec-step: detect output keys are the item's keys plus activeChanges (W44-R7)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/openspec-step.js"
    script_args: "detect --project-root {{project_root}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-openspec-active"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const want = ['detected','changeName','isArchived','tasksDone','tasksTotal','matchedBy','proposalPath','designPath','specPaths','activeChanges'];
        if (JSON.stringify(Object.keys(o)) !== JSON.stringify(want)) return `FAIL: ${Object.keys(o).join(',')}`;
        return true;

