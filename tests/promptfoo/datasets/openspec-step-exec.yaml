- description: "openspec-step: flip flips a task, then reports already-done"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-openspec-step.js"
    script_args: "--project-root {{project_root}} --scenario flip-twice --change feat-x --ref alpha-custom"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/openspec-marktaskdone/with-ref"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const [a, b] = o.calls;
        if (!a || !b) return `FAIL: ${output}`;
        if (a.exitCode !== 0 || b.exitCode !== 0) return `FAIL exit: ${output}`;
        if (a.json.flipped !== true || a.json.ref !== 'alpha-custom' || a.json.reason !== 'ok') return `FAIL first: ${output}`;
        if (b.json.flipped !== false || b.json.reason !== 'already-done') return `FAIL second: ${output}`;
        return true;

- description: "openspec-step: archive --decision anyway archives and commits"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-openspec-step.js"
    script_args: "--project-root {{project_root}} --scenario archive --change add-auth --decision anyway --uncheck 2 --twice"
    script_cwd: "{{project_root}}"
    script_stub_bin: "bin"
    project_root: "file://fixtures-fs/project-openspec-step-archive"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const [a, b] = o.calls;
        if (!a || !b) return `FAIL: ${output}`;
        if (a.exitCode !== 0 || a.json.status !== 'archived' || a.json.commitMade !== true) return `FAIL first: ${output}`;
        if (a.json.resultText !== 'archived add-auth, 2 task(s) left incomplete') return `FAIL resultText: ${output}`;
        if (o.lastSubject !== 'chore(openspec): archive add-auth') return `FAIL subject: ${output}`;
        if (JSON.stringify(o.archived) !== JSON.stringify(['2026-01-01-add-auth'])) return `FAIL archived: ${output}`;
        if (b.json.status !== 'archived' || b.json.reason !== 'already archived' || b.json.commitMade !== false || b.json.resultText !== 'archived add-auth') return `FAIL second: ${output}`;
        if (o.commitCount !== 2) return `FAIL commitCount: ${output}`;
        return true;

- description: "openspec-step: archive --decision sync syncs then archives"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-openspec-step.js"
    script_args: "--project-root {{project_root}} --scenario archive --change add-auth --decision sync --uncheck 2"
    script_cwd: "{{project_root}}"
    script_stub_bin: "bin"
    project_root: "file://fixtures-fs/project-openspec-step-archive"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const a = o.calls[0];
        if (!a) return `FAIL: ${output}`;
        if (a.json.status !== 'synced-and-archived' || !a.json.taskCounts || a.json.taskCounts.synced !== 2) return `FAIL status: ${output}`;
        if (a.json.resultText !== 'archived add-auth (synced 2 tasks)' || a.json.commitMade !== true) return `FAIL result: ${output}`;
        return true;

- description: "openspec-step: archive --decision cancel exits 1 without archiving"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-openspec-step.js"
    script_args: "--project-root {{project_root}} --scenario archive --change add-auth --decision cancel"
    script_cwd: "{{project_root}}"
    script_stub_bin: "bin"
    project_root: "file://fixtures-fs/project-openspec-step-archive"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const a = o.calls[0];
        if (!a) return `FAIL: ${output}`;
        if (a.exitCode !== 1 || a.json.status !== 'cancelled' || a.json.commitMade !== false) return `FAIL call: ${output}`;
        if (o.commitCount !== 1 || o.archived.length !== 0) return `FAIL repo: ${output}`;
        return true;

- description: "openspec-step: archive with all tasks done records the plain result"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-openspec-step.js"
    script_args: "--project-root {{project_root}} --scenario archive --change add-auth --decision anyway"
    script_cwd: "{{project_root}}"
    script_stub_bin: "bin"
    project_root: "file://fixtures-fs/project-openspec-step-archive"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const a = o.calls[0];
        if (!a) return `FAIL: ${output}`;
        if (a.json.status !== 'archived' || a.json.resultText !== 'archived add-auth') return `FAIL result: ${output}`;
        if (!a.json.validation || a.json.validation.ok !== true) return `FAIL validation: ${output}`;
        return true;

