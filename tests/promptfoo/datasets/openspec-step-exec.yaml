        return true;

# The script exits 2 before resolving a root, so no --project-root is passed. The
# provider appends stderr on a non-zero exit, hence icontains rather than JSON.parse.
- description: "openspec-step: usage error prints an error line"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/openspec-step.js"
    script_args: "bogus"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-openspec-active"
  assert:
    - type: icontains
      value: '"error"'

- description: "openspec-step: validate exits 1 when the CLI reports failure"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-openspec-step.js"
    script_args: "--project-root {{project_root}} --scenario validate --change add-auth --stub-validate fail"
    script_cwd: "{{project_root}}"
    script_stub_bin: "bin"
    project_root: "file://fixtures-fs/project-openspec-step-archive"
