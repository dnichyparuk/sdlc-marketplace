# Script execution tests for setup-init.js.
# These tests run setup-init.js directly against fixture directories (no LLM).
# Covers: deterministic .sdlc/ initialization (issue #134).

- description: "setup-init: creates .sdlc/.gitignore with * content"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/util/setup-init.js"
    script_args: "--project-config {} --local-config {\"review\":{\"scope\":\"committed\"}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-setup-empty"
  assert:
    - type: icontains
      value: '"gitignore"'
    - type: icontains
      value: '"action": "created"'

- description: "setup-init: re-run on legacy-pattern .sdlc/.gitignore migrates to managed block"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/util/setup-init.js"
    script_args: "--project-config {} --local-config {\"review\":{\"scope\":\"committed\"}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-sdlc-gitignore-inner"
  assert:
    - type: icontains
      value: '"action": "updated"'

- description: "setup-init (#273): canonical .sdlc/.gitignore shape is byte-identical (writer returns unchanged)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/util/setup-init.js"
    script_args: "--project-config {} --local-config {\"review\":{\"scope\":\"committed\"}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-sdlc-gitignore-canonical"
  assert:
    - type: icontains
      value: '"action": "unchanged"'

- description: "setup-init: writes both project and local config"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/util/setup-init.js"
    script_args: "--project-config {\"version\":{\"mode\":\"tag\"}} --local-config {\"review\":{\"scope\":\"committed\"}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-setup-empty"
  assert:
    - type: icontains
      value: '"projectConfig"'
    - type: icontains
      value: '"localConfig"'
    - type: not-icontains
      value: '"action": "skipped"'

- description: "setup-init: invalid JSON produces error and exit code 1"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/util/setup-init.js"
    script_args: "--project-config 'not-json'"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-setup-empty"
  assert:
    - type: icontains
      value: "not valid JSON"
    - type: javascript
      value: "output.includes('\"errors\"') && !output.includes('\"errors\": []')"

- description: "setup-init (#233): writes receivedReview.alwaysFixSeverities to .sdlc/local.json (never to .sdlc/config.json)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-setup-init-receivedreview.js"
    script_args: ""
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-setup-empty"
  assert:
    # Field landed in local.json with the configured value
    - type: icontains
      value: '"localHasField":true'
    - type: icontains
      value: '"localValue":["high","critical"]'
    # Field NEVER appears in project config — local-only contract (R19, C15)
    - type: icontains
      value: '"projectHasField":false'

- description: "setup-init (#9362): --dry-run writes nothing and diffs only touched sections (P9)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-setup-init-dry-run.js"
    script_args: ""
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-setup-empty"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        const outside = p => /^(jira|commit|pr)(\.|$)/.test(p);
        const checks = {
          exit0: r.exit === 0, dryRun: r.dryRun === true, noWrite: r.treeUnchanged === true,
          idempotent: r.secondRunSame === true,
          modeChanged: r.projectPaths.includes('version.mode'),
          untouchedHidden: !r.projectPaths.some(outside),
          tagPrefixSame: !r.projectPaths.includes('version.tagPrefix'),
          localBump: r.localPaths.includes('ship.bump'),
        };
        const failed = Object.keys(checks).filter(k => !checks[k]);
        return failed.length === 0 ? true : 'FAIL: ' + failed.join(', ');

- description: "setup-init (#9362): --dry-run on an empty project reports only the new section"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/util/setup-init.js"
    script_args: "--dry-run --project-config {\"version\":{\"mode\":\"tag\"}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-setup-empty"
  assert:
    # computeConfigDiff recurses only when both sides are objects, so a section absent
    # from the existing file is one row whose `after` is the whole new section.
    - type: javascript
      value: |
        const r = JSON.parse(output);
        return r.dryRun === true && r.diff.localConfig === null &&
               r.diff.projectConfig.changed.some(c => c.path === 'version' && c.after && c.after.mode === 'tag')

- description: "setup-init (#9362): --dry-run with invalid JSON exits 1"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/util/setup-init.js"
    script_args: "--dry-run --project-config 'not-json'"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-setup-empty"
  assert:
    - type: icontains
      value: "not valid JSON"
