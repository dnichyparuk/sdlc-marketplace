# Script execution tests for github-sdlc (no LLM, no live gh, no network).
# Every case runs scripts/run-github-case.js with the stub gh in
# fixtures-fs/stub-bin-gh-issues (scenario data: scenarios/default.json) first on PATH.
# C17 (checked by the github-sdlc/c17-dataset-check case): every case sets
#   script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"  (except descriptions with E11)
#   script_home                                             (every case)
#   SDLC_LINKS_OFFLINE=1 in script_env                      (except descriptions with "online G8")
# Stub self-tests use the stub fixture itself as home: they read nothing from it.

# ── stub gh self-tests (--raw-gh) ─────────────────────────────────────────────

- description: "github-sdlc/stub routes: repo answer from default.json and one call-log line"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "--raw-gh -- api repos/acme/widgets --hostname=github.com"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/stub-bin-gh-issues"
    script_env: '{"SDLC_LINKS_OFFLINE": "1", "GH_TOKEN": ""}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const ok = o.exit === 0 && o.json && o.json.full_name === 'acme/widgets' && o.json.node_id === 'R_1'
          && o.calls.length === 1 && o.calls[0].tokenHash === null
          && o.calls[0].argv.join(' ') === 'api repos/acme/widgets --hostname=github.com';
        return ok ? true : `FAIL ${output}`;

- description: "github-sdlc/stub routes: graphql contains-match answers issue 7 links"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "--raw-gh -- api graphql --hostname=github.com --raw-field=query=query{issue{subIssues}} --field=owner=acme --field=name=widgets --field=number=7"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/stub-bin-gh-issues"
    script_env: '{"SDLC_LINKS_OFFLINE": "1"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const issue = o.json && o.json.data.repository.issue;
        const item = issue && issue.projectItems.nodes[0];
        const ok = o.exit === 0 && issue.issueType.name === 'Bug' && issue.parent === null
          && issue.subIssues.nodes[0].number === 12 && issue.blockedBy.nodes[0].number === 4
          && item.project.number === 2 && item.project.owner.login === 'acme'
          && item.fieldValues.nodes[0].name === 'Todo' && item.fieldValues.nodes[0].field.name === 'Status';
        return ok ? true : `FAIL ${output}`;

- description: "github-sdlc/stub routes: unmatched call prints STUB-GH-UNEXPECTED and exits 1"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "--raw-gh -- api repos/nobody/none --hostname=github.com"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/stub-bin-gh-issues"
    script_env: '{"SDLC_LINKS_OFFLINE": "1"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const ok = o.exit === 1 && o.stdout === ''
          && o.stderr.includes('STUB-GH-UNEXPECTED api repos/nobody/none --hostname=github.com')
          && o.calls.length === 1;
        return ok ? true : `FAIL ${output}`;

- description: "github-sdlc/stub GH_STUB_FAIL: rate-limit on the 1st matching call"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "--raw-gh -- api repos/acme/widgets --hostname=github.com"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/stub-bin-gh-issues"
    script_env: '{"SDLC_LINKS_OFFLINE": "1", "GH_STUB_FAIL": "404@api repos/acme/other;rate-limit@api repos/acme/widgets#1"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const ok = o.exit === 1 && o.stdout === ''
          && o.stderr.includes('HTTP 403: API rate limit exceeded') && o.stderr.includes('reset 1767225600');
        return ok ? true : `FAIL ${output}`;

- description: "github-sdlc/stub GH_STUB_AUTH: expired token fails auth status"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "--raw-gh -- auth status --hostname github.com"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/stub-bin-gh-issues"
    script_env: '{"SDLC_LINKS_OFFLINE": "1", "GH_STUB_AUTH": "expired"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const ok = o.exit === 1 && o.stderr.includes('Failed to log in to github.com account alice')
          && o.stderr.includes('expired') && !o.stderr.includes('Logged in to');
        return ok ? true : `FAIL ${output}`;

- description: "github-sdlc/stub GH_STUB_ACCOUNTS: two accounts in auth status --json=hosts"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "--raw-gh -- auth status --hostname=github.com --json=hosts"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/stub-bin-gh-issues"
    script_env: '{"SDLC_LINKS_OFFLINE": "1", "GH_STUB_ACCOUNTS": "alice*,acme"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const list = o.json && o.json.hosts['github.com'];
        const ok = o.exit === 0 && list.length === 2
          && list[0].login === 'alice' && list[0].active === true
          && list[1].login === 'acme' && list[1].active === false
          && list.every((a) => a.state === 'success' && a.host === 'github.com');
        return ok ? true : `FAIL ${output}`;

- description: "github-sdlc/stub GH_STUB_SCOPES: none in the Token scopes line"
  vars:
