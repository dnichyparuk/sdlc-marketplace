    script_env: '{"SDLC_LINKS_OFFLINE": "1", "GH_TOKEN": ""}'
  assert:
    - type: javascript
      value: |
        // --break-cache: any cache read would crash (exit 2), so exit 1 proves none happened.
        const o = JSON.parse(output);
        const ok = o.exit === 1 && o.calls.length === 0
          && o.json.errors.some((e) => e.includes('--repo') && e.includes('bad//x'));
        return ok ? true : `FAIL ${output}`;

