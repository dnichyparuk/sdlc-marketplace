- description: "github-sdlc/apply C13 C20 R32: the acting token appears in no output, output file, cache or log after an account change and a pat failure"
  vars:
    script_path: "-e"
    script_args: "eval(process.env.APPLY_HARNESS) -- {{repo_root}} comment --dump .sdlc/learnings/log.md --dump ~/.sdlc-cache/github/github_com/acme/widgets.json -- --apply --input @INPUT@ --output-file @OUT@"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
