- description: "github-sdlc/stub GH_STUB_SEQ: first call of state12 answers the first listed variant"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "--raw-gh -- api repos/acme/widgets/issues/12 --hostname=github.com"
