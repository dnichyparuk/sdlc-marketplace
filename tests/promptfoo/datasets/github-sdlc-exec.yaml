# ── github.js --check: auth and acting account (P3, R20, R30, G2, E3, E11) ───

- description: "github-sdlc/check R30: owner-matching second account acts by token, no auth switch"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "-- --check --repo acme/widgets"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/github-sdlc-home"
    script_env: '{"SDLC_LINKS_OFFLINE": "1", "GH_TOKEN": "", "GH_STUB_ACCOUNTS": "alice*,acme"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const a = o.json.auth;
        const lines = o.calls.map((c) => c.argv.join(' '));
        const at = lines.indexOf('auth token --user=acme --hostname=github.com');
        const later = o.calls.slice(at + 1);
        const ok = o.exit === 0 && a.authenticated === true && a.accountSwitch.switched === true
          && a.accountSwitch.account === 'acme' && a.actingAccount === 'acme' && a.activeAccount === 'alice'
          && a.repoAccessible === true && at >= 0 && !lines.some((l) => l.startsWith('auth switch'))
          && later.length > 0 && later.every((c) => c.tokenHash && c.tokenHash === later[0].tokenHash)
          && !output.includes('S3CR3T');
        return ok ? true : `FAIL ${output}`;

- description: "github-sdlc/check R20: read:project only gives scopes.project false, readProject true"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "-- --check --repo acme/widgets"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/github-sdlc-home"
    script_env: '{"SDLC_LINKS_OFFLINE": "1", "GH_TOKEN": "", "GH_STUB_SCOPES": "read:project"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const s = o.json.auth.scopes;
        const ok = o.exit === 0 && s.project === false && s.readProject === true;
        return ok ? true : `FAIL ${output}`;

- description: "github-sdlc/check R20: GH_TOKEN in the environment gives both scopes null"
  vars:
