# Reads of issue 12 in argv-all: the close (open), the reopen (closed), the addSubIssues end (open).
- description: "github-sdlc/payload-core R17-R21: commands[] follow the argv shape table, label create first"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: '--config {"github":{"projects":[{"owner":"acme","number":2}]}} --payload argv-all -- --check-payload --input @PAYLOAD@'
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/github-sdlc-home"
    script_env: '{"SDLC_LINKS_OFFLINE": "1", "GH_TOKEN": "", "GH_STUB_DATA": "live", "GH_STUB_SEQ": "state12=open,closed,open"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const R = '--repo=github.com/acme/widgets';
        const got = o.json.ops.map((op) => JSON.stringify(op.commands));
        const want = [
          [['label', 'create', 'needs-triage', R, '--color=ededed', '--description=Needs a first look'],
            ['issue', 'create', R, '--title=Fix crash on save', '--body-file=<tmp>', '--label=bug', '--label=needs-triage',
              '--milestone=v1.0', '--assignee=alice', '--assignee=@me', '--type=Bug', '--parent=3'],
            ['project', 'item-add', '2', '--owner=acme', '--url=<new-issue-url>']],
          [['issue', 'edit', '5', R, '--title=New title', '--body-file=<tmp>', '--add-label=bug', '--remove-label=enhancement',
            '--milestone=v1.0', '--type=Task']],
          [['issue', 'comment', '12', R, '--body-file=<tmp>'], ['issue', 'close', '12', R, '--reason=duplicate', '--duplicate-of=4']],
          [['issue', 'comment', '12', R, '--body-file=<tmp>'], ['issue', 'reopen', '12', R]],
          [['issue', 'comment', '7', R, '--body-file=<tmp>']],
          [['issue', 'edit', '5', R, '--parent=3', '--add-sub-issue=12', '--remove-sub-issue=7', '--add-blocked-by=4',
            '--remove-blocked-by=20', '--add-blocking=7', '--remove-blocking=3'], ['issue', 'comment', '5', R, '--body-file=<tmp>']],
          [['issue', 'edit', '7', R, '--remove-parent']],
          [['issue', 'edit', '5', R, '--add-assignee=bob', '--remove-assignee=alice']],
          [['project', 'item-add', '2', '--owner=acme', '--url=https://github.com/acme/widgets/issues/5'],
            ['project', 'item-edit', '--id=<item-id>', '--project-id=PVT_2', '--field-id=PVTF_3', '--number=3']],
          [['project', 'item-edit', '--id=<item-id>', '--project-id=PVT_2', '--field-id=PVTF_4', '--clear']],
        ].map((c) => JSON.stringify(c));
        const bad = want.map((w, i) => (w === got[i] ? null : `op ${i}: got ${got[i]}`)).filter(Boolean);
        // Live findings keep commands[]: op 1 edits the body with no template (R12), op 5 links the pull request #20 (R19).
        const findings = o.json.ops.map((op, i) => (op.templateMissing ? `${i}:templateMissing` : '')
          + op.errors.map((e) => `${i}:${e}`).join('') + (op.noOpState ? `${i}:noOpState` : '')).filter(Boolean);
        const ok = o.exit === 1 && got.length === want.length && bad.length === 0
          && JSON.stringify(findings) === JSON.stringify(['1:templateMissing',
            '5:removeBlockedBy 20: acme/widgets#20 is a pull request, not an issue'])
          && o.calls.every((c) => !/^(issue|label|project) /.test(c.argv.join(' ')));
        return ok ? true : `FAIL ${bad.join('; ')} ${output}`;

