    script_env:
      SDLC_LINKS_OFFLINE: "1"
      GH_TOKEN: ""
      GH_STUB_DATA: "../../github-sdlc-inputs/payloads-apply.json"
      GH_STUB_ACCOUNTS: "alice*,acme"
      GH_STUB_FAIL: "403@issue comment#1;pat@issue comment#1"
      APPLY_HARNESS: *apply_harness
  assert:
    - type: javascript
      value: |
        const [o] = JSON.parse(output);
        const out = JSON.parse(o.outputFile.content || '{}');
        const f = (out.failed || [])[0] || {};
        const log = o.dumps['.sdlc/learnings/log.md'] || '';
        const ok = o.exit === 1 && o.stdout === '' && !output.includes('S3CR3T')
          && out.auth.accountSwitch.recovered === true && f.failure.class === 'auth' && f.failure.message.includes('[REDACTED]')
          && log.includes('gh-failure[permission]') && typeof o.dumps['~/.sdlc-cache/github/github_com/acme/widgets.json'] === 'string';
        return ok ? true : `FAIL ${output}`;
