        return ok ? true : `FAIL ${output}`;

- description: "github-sdlc/stub auth token: known token value and GH_TOKEN hash in the call log"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "--raw-gh -- auth token --user=alice --hostname=github.com"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/stub-bin-gh-issues"
    script_env: '{"SDLC_LINKS_OFFLINE": "1", "GH_TOKEN": "abc"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        // sha256("abc") starts ba7816bf8f01
        const ok = o.exit === 0 && o.stdout.trim() === 'stub-token-alice-S3CR3T'
          && o.calls.length === 1 && o.calls[0].tokenHash === 'ba7816bf8f01';
        return ok ? true : `FAIL ${output}`;

# ── run-github-case.js options ────────────────────────────────────────────────

- description: "github-sdlc/stub-runner: --origin, --config, --sub, --break-cache, --dump and arg tokens"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: '--origin https://github.com/acme/widgets.git --config {"github":{"cacheMaxAgeHours":1}} --sub pkg/app --break-cache --dump .sdlc/config.json --dump .git/config --dump ~/.sdlc-cache/github --raw-gh -- api @WS@ @HOME@ @OUT@ @FIX:stub-bin-gh-issues/scenarios@'
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/stub-bin-gh-issues"
    script_env: '{"SDLC_LINKS_OFFLINE": "1"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const argv = o.calls[0] && o.calls[0].argv;
        const ok = o.exit === 1 && argv.length === 5
          && argv.slice(1).every((a) => a.startsWith('/') && !a.includes('@'))
          && argv[1].endsWith('/ws') && argv[2].endsWith('/home') && argv[3] === o.outputFile.path
          && argv[4].endsWith('tests/promptfoo/fixtures-fs/stub-bin-gh-issues/scenarios')
          && o.outputFile.content === null
          && o.dumps['.sdlc/config.json'] === '{"github":{"cacheMaxAgeHours":1}}'
          && o.dumps['.git/config'].includes('url = https://github.com/acme/widgets.git')
          && o.dumps['~/.sdlc-cache/github'] === '';
        return ok ? true : `FAIL ${output}`;

- description: "github-sdlc/stub-runner: --no-git and --no-gh-path leave gh off PATH"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "--no-git --no-gh-path --dump .git/config --raw-gh -- --version"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/stub-bin-gh-issues"
    script_env: '{"SDLC_LINKS_OFFLINE": "1"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const ok = o.exit === null && o.stderr.includes('ENOENT') && o.calls.length === 0
          && o.dumps['.git/config'] === null;
        return ok ? true : `FAIL ${output}`;

# ── github.js --check: arguments and repository resolution (A1, R1, R3) ──────

- description: "github-sdlc/check A1: --repo wins over origin (source flag)"
