# ── apply (P13, R36, R37, G7, R17, R21, R23, R31, R32, E4, E7-E10, C7, C13, C16, C18, C20) ──
# github-sdlc-inputs/payloads-apply.json is both the stub scenario of these cases (GH_STUB_DATA, relative to
# scenarios/: it extends live.json with the write routes, a create read-back and a comment read-back on issue 5)
# and, under `payloads`, their inputs. The runner's --payload reads payloads-core.json only, so each case runs
# `node -e` with the APPLY_HARNESS script (defined once below, reused by YAML alias). Its argv:
#   -- <repo root> <payload keys, comma-separated> <run-github-case.js args>
# For each key it writes payloads[key] to a temp file, replaces @INPUT@ with that path and @HASH:<key>@ with
# github.js payloadHash(payloads[key]), runs run-github-case.js, and adds `bodies`: the text of every body file
# a --dry-run listed (those files are kept by --dry-run; the harness removes them). It prints a JSON array, one
# run-github-case.js result per key. Indices in applied[], failed[], unknown[] and notRun[] are 1-based (R23).

- description: "github-sdlc/apply A10 R21: --dry-run on a comment lists one issue comment argv whose body file holds the body byte for byte; no write"
  vars:
    script_path: "-e"
    script_args: "eval(process.env.APPLY_HARNESS) -- {{repo_root}} comment -- --apply --input @INPUT@ --dry-run"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/github-sdlc-home"
    script_env:
      SDLC_LINKS_OFFLINE: "1"
      GH_TOKEN: ""
      GH_STUB_DATA: "../../github-sdlc-inputs/payloads-apply.json"
      APPLY_HARNESS: &apply_harness |
        const cp = require('child_process');
        const fs = require('fs');
        const os = require('os');
        const path = require('path');
        const [root, keys, ...rest] = process.argv.slice(1);
        const pf = path.join(root, 'tests', 'promptfoo');
        const fixture = path.join(pf, 'fixtures-fs', 'github-sdlc-inputs', 'payloads-apply.json');
        const { payloads } = JSON.parse(fs.readFileSync(fixture, 'utf8'));
        const { payloadHash } = require(path.join(root, 'plugins', 'sdlc-utilities', 'scripts', 'skill', 'github.js'));
        const entry = (key) => {
          if (!(key in payloads)) throw new Error(`no payload "${key}" in ${fixture}`);
          return payloads[key];
        };
        const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'github-apply-'));
        const runs = keys.split(',').map((key, i) => {
          const input = path.join(tmp, `payload-${i}.json`);
          fs.writeFileSync(input, JSON.stringify(entry(key), null, 2));
          const args = rest.map((a) => a.replace('@INPUT@', input).replace(/@HASH:([^@]+)@/, (_, k) => payloadHash(entry(k))));
          const r = cp.spawnSync(process.execPath, [path.join(pf, 'scripts', 'run-github-case.js'), ...args], { encoding: 'utf8' });
          const o = JSON.parse(r.stdout);
          const files = ((o.json && o.json.commands) || []).flat().filter((a) => a.startsWith('--body-file=/'))
            .map((a) => a.slice('--body-file='.length));
          o.bodies = files.map((f) => fs.readFileSync(f, 'utf8'));
          for (const f of files) fs.rmSync(path.dirname(f), { recursive: true, force: true });
          return o;
        });
        fs.rmSync(tmp, { recursive: true, force: true });
        process.stdout.write(JSON.stringify(runs));
  assert:
    - type: javascript
      value: |
        const [o] = JSON.parse(output);
        const cmds = o.json.commands;
        const argv = cmds[0] || [];
        const ok = o.exit === 0 && cmds.length === 1 && argv.slice(0, 4).join(' ') === 'issue comment 5 --repo=github.com/acme/widgets'
          && argv.length === 5 && argv[4].startsWith('--body-file=/') && JSON.stringify(o.bodies) === '["Fixed in main, thanks."]'
          && !o.calls.some((c) => /^(issue|label|project) /.test(c.argv.join(' ')));
        return ok ? true : `FAIL ${output}`;

