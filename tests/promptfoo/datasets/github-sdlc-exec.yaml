    script_home: "fixtures-fs/github-sdlc-home"
    script_env: '{"SDLC_LINKS_OFFLINE": "1", "GH_TOKEN": ""}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const r = o.json && o.json.repo;
        const ok = o.exit === 0 && r.slug === 'acme/widgets' && r.source === 'flag' && r.host === 'github.com'
          && r.owner === 'acme' && r.name === 'widgets' && o.json.errors.length === 0;
        return ok ? true : `FAIL ${output}`;

- description: "github-sdlc/check A1: --repo bad//x exits 1 naming --repo, no gh call, no cache read"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "--break-cache -- --check --repo bad//x"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
