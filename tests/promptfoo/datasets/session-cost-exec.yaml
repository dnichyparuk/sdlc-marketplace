- description: "session-cost: unknown speed, geo, service tier and fast without a fast block go to unpriced"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/session-cost.js"
    project_root: "file://fixtures-fs/session-cost"
    script_args: "--sessions {{project_root}}/sessions.json --projects-dir {{project_root}}/projects --prices {{project_root}}/prices.json --json"
  assert:
    - type: javascript
      value: |
        const d = JSON.parse(output);
        const expected = ['inference_geo: eu', 'service_tier: priority', 'speed: turbo', 'model not in price table', 'fast: no fast price for model'].sort();
        return d.tags.fallback.usd === '1.000000000000'
          && d.tags.fallback.unpricedMessages === 5
          && d.total.complete === false
          && JSON.stringify(d.unpriced.map((u) => u.reason).sort()) === JSON.stringify(expected);

- description: "wave-metrics: two milestones give two summed rows"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/wave-metrics.js"
    project_root: "file://fixtures-fs/wave-metrics/two-milestones"
    script_args: "--root {{project_root}} --json"
  assert:
    - type: javascript
      value: |
        const d = JSON.parse(output);
        const m1 = {
          'Milestone': 'M1', 'Waves': '2', 'Items': '3', 'Sum net h': '1.75', 'Sum owner-wait h': '1.5',
          'Plan stops': '1', 'Exec stops': '3', 'Executor resets': '1',
          'Review findings total / fixed / declined / REAL': '7 / 1 (1 of 2 waves) / 6 / 1',
          'Fix rounds': '1', 'Orch gate first-try': '1/2', 'Arb plan-check blocking items': '2',
          'Arbiter overturns': '1', 'Gate bypasses': '0', 'D15 deletes': '0', 'Behavioural runs': '1',
          'Cost USD': '1.750000000000',
        };
        const m2 = {
          'Milestone': 'M2', 'Waves': '1', 'Items': '1', 'Sum net h': '2', 'Sum owner-wait h': '0',
          'Plan stops': '0', 'Exec stops': '0', 'Executor resets': '0',
          'Review findings total / fixed / declined / REAL': '1 / 1 / 0 / 0',
          'Fix rounds': '1', 'Orch gate first-try': '1/1', 'Arb plan-check blocking items': '0',
          'Arbiter overturns': '0', 'Gate bypasses': '1', 'D15 deletes': '0', 'Behavioural runs': '2',
          'Cost USD': '3.000000000000',
        };
        const eq = (a, b) => Object.keys(a).length === 17 && Object.keys(b).length === 17 && Object.keys(b).every((k) => a[k] === b[k]);
        return d.length === 2 && eq(d[0], m1) && eq(d[1], m2);

- description: "wave-metrics: a not recorded field gives the (k of n waves) marker"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/wave-metrics.js"
    project_root: "file://fixtures-fs/wave-metrics/not-recorded"
    script_args: "--root {{project_root}} --json"
  assert:
    - type: javascript
      value: |
        const d = JSON.parse(output);
        const nr = 'not recorded';
        const m3 = {
          'Milestone': 'M3', 'Waves': '3', 'Items': nr, 'Sum net h': '3.3 (2 of 3 waves)', 'Sum owner-wait h': nr,
          'Plan stops': nr, 'Exec stops': nr, 'Executor resets': nr,
          'Review findings total / fixed / declined / REAL': nr + ' / ' + nr + ' / ' + nr + ' / ' + nr,
          'Fix rounds': nr, 'Orch gate first-try': nr, 'Arb plan-check blocking items': nr,
          'Arbiter overturns': nr, 'Gate bypasses': nr, 'D15 deletes': nr, 'Behavioural runs': nr,
          'Cost USD': nr,
        };
        const a = d[0];
        return d.length === 1 && Object.keys(a).length === 17 && Object.keys(m3).every((k) => a[k] === m3[k]);

