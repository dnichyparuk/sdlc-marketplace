# Script execution tests for plugins/sdlc-utilities/scripts/ci/session-cost.js and
# plugins/sdlc-utilities/scripts/ci/wave-metrics.js (W1.13).
# Every session-cost case runs the same command against the synthetic fixture in
# fixtures-fs/session-cost and asserts on its own tag. The wave-metrics cases run
# against fixtures-fs/wave-metrics. No real transcripts are read.

- description: "session-cost: duplicate message ids count once with the largest usage, and synthetic messages are dropped"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/session-cost.js"
    project_root: "file://fixtures-fs/session-cost"
    script_args: "--sessions {{project_root}}/sessions.json --projects-dir {{project_root}}/projects --prices {{project_root}}/prices.json --json"
  assert:
    - type: javascript
      value: |
        const d = JSON.parse(output);
        const t = d.tags.dedupe;
        return t.messages === 1 && t.tokens.input === 1000 && t.tokens.output === 500 && t.usd === '0.006000000000';

- description: "session-cost: 5m and 1h cache writes are priced in separate columns"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/session-cost.js"
    project_root: "file://fixtures-fs/session-cost"
    script_args: "--sessions {{project_root}}/sessions.json --projects-dir {{project_root}}/projects --prices {{project_root}}/prices.json --json"
  assert:
    - type: javascript
      value: |
        const d = JSON.parse(output);
        const t = d.tags.cache;
        return t.tokens.cacheWrite5m === 1001000 && t.tokens.cacheWrite1h === 1000000 && t.unsplitCacheWriteLines === 1 && t.usd === '3.251250000000';

- description: "session-cost: subagent transcripts are booked under their parent tag"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/session-cost.js"
    project_root: "file://fixtures-fs/session-cost"
    script_args: "--sessions {{project_root}}/sessions.json --projects-dir {{project_root}}/projects --prices {{project_root}}/prices.json --json"
  assert:
    - type: javascript
      value: |
        const d = JSON.parse(output);
        const t = d.tags.subagent;
        return t.sessions === 1 && t.messages === 2 && t.usd === '2.000000000000';

- description: "session-cost: aux- tags are excluded from total"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/session-cost.js"
    project_root: "file://fixtures-fs/session-cost"
    script_args: "--sessions {{project_root}}/sessions.json --projects-dir {{project_root}}/projects --prices {{project_root}}/prices.json --json"
  assert:
    - type: javascript
      value: |
        const d = JSON.parse(output);
        const toPico = (s) => BigInt(s.replace('.', ''));
        const sum = Object.values(d.tags).reduce((acc, t) => acc + toPico(t.usd), 0n);
        const miss = d.unpriced.find((u) => u.model === 'test-model-missing' && u.reason === 'model not in price table');
        return !('aux-check' in d.tags)
          && d.aux.tags['aux-check'].usd === '1.000000000000'
          && d.total.usd === '13.953253750000'
          && toPico(d.total.usd) === sum
          && !!miss && miss.messages === 1 && miss.tokens.input === 500;

