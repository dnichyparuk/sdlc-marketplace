# R78 / W8.41: the Step 6 summary carries commits[] and reviewSummaryPath.
- description: "ship-summary-commits: (b) commitSubject is null on a git error"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-ship-prepare-summary.js"
    script_args: "--case summary-commits-git-error"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        if (o.bad !== null || o.nonsha !== null) return `FAIL: expected null, got ${JSON.stringify(o)}`;
