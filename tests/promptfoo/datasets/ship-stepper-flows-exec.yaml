        if (r.round !== 1 || r.review.status !== 'completed' || r.receivedReview.status !== 'completed' || r.commitFixes.status !== 'completed') return `FAIL: record ${JSON.stringify(r)}`;
        if (!/^[0-9a-f]{40}$/.test(r.commitFixes.commitSha || '')) return `FAIL: commitSha ${r.commitFixes.commitSha}`;
        const st = s.stepStatuses;
        return st.review === 'in_progress' && st['received-review'] === 'pending' && st['commit-fixes'] === 'pending' ? true : `FAIL: statuses ${JSON.stringify(st)}`;
    # from: ship-rounds: (d) round 2 ends the loop
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const ids = o.calls.map(c => c.envelope.step && c.envelope.step.id);
        // R95: round 2's fixes get the final-check dispatch_review before dispatch_version.
        if (ids.filter(id => id === 'dispatch_review').length !== 2) return `FAIL: dispatch_review emitted ${ids}`;
        if (ids[ids.length - 1] !== 'dispatch_version' || ids[ids.length - 2] !== 'dispatch_review') return `FAIL: last ${ids}`;
        const s = o.snapshots[1];
        if (!s || s.round !== 2 || s.rounds.length !== 2) return `FAIL: ${JSON.stringify(s)}`;
        return o.ledger.stepStatuses['commit-fixes'] === 'skipped' ? true : `FAIL: commit-fixes ${o.ledger.stepStatuses['commit-fixes']}`;
    # from: ship-rounds: (g) round 2 with fixes emits stage_fixes again
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const envs = o.calls.map(c => c.envelope);
        const r2 = envs.findIndex(e => e.step && e.step.id === 'dispatch_review');
        const sf = envs.slice(r2 + 1).find(e => e.step && e.step.id === 'stage_fixes');
        if (r2 < 0 || !sf) return `FAIL: no round-2 stage_fixes ${envs.map(e => e.step && e.step.id)}`;
        return JSON.stringify(sf.step.data.commands) === JSON.stringify(["git add -A -- ':!.sdlc/'"]) ? true : `FAIL: commands ${JSON.stringify(sf.step.data.commands)}`;
    # from: ship-rounds: (h) round 2 emits review_gate again
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const ids = o.calls.map(c => c.envelope.step && c.envelope.step.id);
        const r2 = ids.indexOf('dispatch_review');
        return r2 >= 0 && ids[r2 + 1] === 'review_gate' && ids.filter(id => id === 'review_gate').length === 2 ? true : `FAIL: ids ${ids}`;

