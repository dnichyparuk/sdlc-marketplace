# Script execution tests for ship pipeline flows (no LLM), driven through run-ship-stepper.js,
# run-ship-prepare-summary.js, run-ship-prepare-plan-fields.js and skill/ship.js. Covers lean runs, plan
# resume, received-review input, the run summary, forwarded release flags, reruns, guards, fix staging,
# strict mode, scope keep, review rounds, the final check and self commits.

# R36: a git-ignored learnings log can never be committed, so learnings_commit is skipped, not emitted.
- description: "ship-lean: (learnings) a an ignored learnings log skips learnings_commit"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario after-pr --seed frozen --result results/pr-ok.json --gh-pr-url https://example/pr/1 --ignore-sdlc"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const e = o.calls[0].envelope;
        if (e.status === 'error') return `FAIL: error ${e.error}`;
        if (o.calls.some(c => c.envelope.step && c.envelope.step.id === 'learnings_commit')) return 'FAIL: learnings_commit emitted';
        if (o.ledger.stepStatuses['learnings-commit'] !== 'skipped') return `FAIL: learnings-commit ${o.ledger.stepStatuses['learnings-commit']}`;
        return o.ledger.stepReasons['learnings-commit'] === 'learnings log is git-ignored' ? true : `FAIL: reason ${o.ledger.stepReasons['learnings-commit']}`;

- description: "ship-lean: (learnings) c with --no-push the learnings commit does not push"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario after-pr --seed frozen --result results/pr-ok.json --gh-pr-url https://example/pr/1 --no-push"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const e = o.calls[0].envelope;
        if (e.status !== 'step' || e.step.id !== 'learnings_commit') return `FAIL: ${e.status} ${e.step && e.step.id} ${e.error || ''}`;
        const cmd = e.step.data.commands[0];
        if (!cmd.includes('git commit')) return `FAIL: no commit ${cmd}`;
        return cmd.includes('git push') ? `FAIL: pushes ${cmd}` : true;

- description: "ship-resume-plan: (a) a fresh initial call with --steps execute,commit records review, version and pr as skipped"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario initial --plan plan.md --steps execute,commit"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const c = o.calls[0];
        if (c.exitCode !== 0) return `FAIL: exit ${c.exitCode}: ${JSON.stringify(c.envelope).slice(0, 400)}`;
        if (!o.ledger) return 'FAIL: no ledger';
        for (const n of ['review', 'version', 'pr']) if (o.ledger.stepStatuses[n] !== 'skipped') return `FAIL: ${n} is ${o.ledger.stepStatuses[n]}`;
        for (const n of ['execute', 'commit']) if (o.ledger.stepStatuses[n] !== 'pending') return `FAIL: ${n} is ${o.ledger.stepStatuses[n]}`;
        return true;

- description: "ship-resume-plan: (b) a different --plan without --resume is refused with resumePlanMismatch and the ledger is untouched"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario initial-resume-legacy --seed frozen --plan plan-notasks.md"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const c = o.calls[0];
        const e = c.envelope;
        if (c.exitCode !== 1) return `FAIL: exit ${c.exitCode}`;
        const m = (e.errors || []).find(x => x && x.id === 'resumePlanMismatch');
        if (!m) return `FAIL: no resumePlanMismatch: ${JSON.stringify(e.errors)}`;
        if (!/\/plan\.md\b/.test(m.message)) return `FAIL: message lacks ledger plan: ${m.message}`;
        if (!/plan-notasks\.md/.test(m.message)) return `FAIL: message lacks given plan: ${m.message}`;
        if (!m.message.includes('ship-feat-ship-20261019T120000Z.json')) return `FAIL: message lacks ledger name: ${m.message}`;
        if (o.seedUnchanged !== true) return `FAIL: seedUnchanged ${o.seedUnchanged}`;
        if (o.ledgerFiles.join() !== 'ship-feat-ship-20261019T120000Z.json') return `FAIL: ledgerFiles ${o.ledgerFiles.join()}`;
        return true;

