    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const i = o.calls.findIndex(c => c.args[1] === 'dispatch_received_review');
        const e = i >= 0 ? o.calls[i].envelope : null;
        if (!e || e.status !== 'step' || e.step.id !== 'dispatch_review') return `FAIL: after received-review ${e && e.status} ${e && e.step && e.step.id}`;
        const w = (e.ext && e.ext.warnings) || [];
        if (!w.some(x => x.includes('adopted as the commit-fixes commit'))) return `FAIL: not adopted ${JSON.stringify(w)}`;
        return w.some(x => x.includes('differs from the plan fix subject')) ? true : `FAIL: no subject warning ${JSON.stringify(w)}`;

- description: "ship-self-commit: (e) a resume stops again until the outside path is reverted, then stage_fixes adopts"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario rounds-self-commit --seed frozen --summary high-1.json --self-commit-outside src/unrelated.js --resume-after-outside"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const ids = o.calls.map(c => c.envelope.step && c.envelope.step.id);
        if (ids.includes('dispatch_commit_fixes')) return `FAIL: ids ${ids}`;
        const resumes = o.calls.filter(c => c.args[1] === 'confirm_pipeline').map(c => c.envelope);
        if (resumes.length !== 2) return `FAIL: ${resumes.length} resumes`;
        // Before the revert the resume stops on the same question (idempotent stop).
        const q = resumes[0].ext && resumes[0].ext.pendingQuestion;
        if (resumes[0].ext.reason !== 'pending-question' || !q || q.id !== 'stageOutsideFiles' || JSON.stringify(q.paths) !== JSON.stringify(['src/unrelated.js'])) return `FAIL: first resume ${JSON.stringify(resumes[0].ext)}`;
        if (o.snapshots[1] && o.snapshots[1].stepStatuses['commit-fixes'] === 'completed') return 'FAIL: commit-fixes completed before the revert';
        // After the revert stage_fixes adopts the commit and the final fix review follows.
        const e = resumes[1];
        if (e.status !== 'step' || e.step.id !== 'dispatch_review' || !/--committed --base [0-9a-f]{40}\b/.test(e.step.data.invocation || '')) return `FAIL: second resume ${e.status} ${e.step && e.step.data.invocation}`;
        return ((e.ext && e.ext.warnings) || []).some(w => w.includes('adopted as the commit-fixes commit')) ? true : `FAIL: warnings ${JSON.stringify(e.ext && e.ext.warnings)}`;

