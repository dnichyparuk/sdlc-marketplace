        if (e.status !== 'step' || e.step.id !== 'dispatch_version') return `FAIL: ${e.status} ${e.step && e.step.id} ${e.error || ''}`;
        if (!((e.ext && e.ext.warnings) || []).some(w => w.includes('open findings accepted (R104)'))) return `FAIL: warnings ${JSON.stringify(e.ext && e.ext.warnings)}`;
        const f = o.snapshots[o.snapshots.length - 1].finalCheck;
        return f && f.accepted === true && !('handoff' in f) ? true : `FAIL: finalCheck ${JSON.stringify(f)}`;

# R97: received-review that committed its fixes itself (HEAD moved, clean tree) is adopted as commit-fixes.
- description: "ship-self-commit: (a) a commit made by received-review is adopted"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario rounds-self-commit --seed frozen --summary high-1.json"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const ids = o.calls.map(c => c.envelope.step && c.envelope.step.id);
        if (ids.includes('stage_fixes') || ids.includes('dispatch_commit_fixes')) return `FAIL: ids ${ids}`;
        const i = o.calls.findIndex(c => c.args[1] === 'dispatch_received_review');
        const e = i >= 0 ? o.calls[i].envelope : null;
        if (!e || e.status !== 'step' || e.step.id !== 'dispatch_review' || !/--committed --base [0-9a-f]{40}\b/.test(e.step.data.invocation || '')) return `FAIL: after received-review ${e && e.status} ${e && e.step && e.step.data.invocation}`;
        if (!((e.ext && e.ext.warnings) || []).some(w => w.includes('adopted as the commit-fixes commit'))) return `FAIL: warnings ${JSON.stringify(e.ext && e.ext.warnings)}`;
        // The R95 transition records the adopted commit-fixes entry in rounds[] before it resets the round steps.
        const cf = o.snapshots[0] && o.snapshots[0].rounds && o.snapshots[0].rounds[0].commitFixes;
        if (!cf || cf.status !== 'completed') return `FAIL: commit-fixes ${JSON.stringify(cf)}`;
        return /^[0-9a-f]{40}$/.test(o.headAfter || '') && cf.artifacts && cf.artifacts.commit === o.headAfter ? true : `FAIL: commit ${JSON.stringify(cf.artifacts)} head ${o.headAfter}`;

- description: "ship-self-commit: (b) a failed git status adopts nothing"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario rounds-self-commit --seed frozen --summary high-1.json --git-status-fail"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        for (const c of o.calls) {
          const e = c.envelope;
          if (((e.ext && e.ext.warnings) || []).some(w => w.includes('adopted as the commit-fixes commit'))) return `FAIL: adopted ${JSON.stringify(e.ext.warnings)}`;
          if (e.step && e.step.id === 'dispatch_commit_fixes') return 'FAIL: dispatch_commit_fixes emitted';
        }
        return JSON.stringify(o).includes('git status failed after received-review') ? true : 'FAIL: no failure reason';

# R103: an adopted fix commit is scope-checked against the plan Files; a mismatched subject only warns.
- description: "ship-self-commit: (c) a committed path outside the plan Files refuses adoption with stageOutsideFiles"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario rounds-self-commit --seed frozen --summary high-1.json --self-commit-outside src/unrelated.js"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        for (const c of o.calls) {
          if (((c.envelope.ext && c.envelope.ext.warnings) || []).some(w => w.includes('adopted as the commit-fixes commit'))) return `FAIL: adopted ${JSON.stringify(c.envelope.ext.warnings)}`;
        }
        const i = o.calls.findIndex(c => c.args[1] === 'dispatch_received_review');
        const e = i >= 0 ? o.calls[i].envelope : null;
        const q = e && e.ext && e.ext.pendingQuestion;
        if (!e || e.ext.reason !== 'pending-question' || !q || q.id !== 'stageOutsideFiles') return `FAIL: after received-review ${JSON.stringify(e && e.ext)}`;
        if (JSON.stringify(q.paths) !== JSON.stringify(['src/unrelated.js'])) return `FAIL: paths ${JSON.stringify(q.paths)}`;
        const st = o.snapshots[0] && o.snapshots[0].stepStatuses['commit-fixes'];
        return st && st !== 'completed' ? true : `FAIL: commit-fixes ${st}`;

- description: "ship-self-commit: (d) a subject that differs from the plan fix subject warns and still adopts"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
