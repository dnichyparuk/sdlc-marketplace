        const e = i >= 0 ? o.calls[i].envelope : null;
        if (!e || e.status !== 'step' || e.step.id !== 'dispatch_review') return `FAIL: after commit-fixes ${e && e.status} ${e && e.step && e.step.id} ${e && e.error}`;
