- description: "ship-rr-input: (a) a PR gives --pr <N>"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario review-gate-rows --seed frozen --result results/review-critical.json --summary critical-1.json --answer yes --gh-pr-url https://example/pr/7 --gh-pr-number 7"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const next = o.calls[o.calls.length - 1].envelope;
        if (next.step.id !== 'dispatch_received_review') return `FAIL: next ${next.step.id}`;
        if (!/^--auto --plan "[^"]+" --min-severity critical --pr 7$/.test(next.step.data.args)) return `FAIL: args ${next.step.data.args}`;
        if (next.step.data.invocation !== `skill: "received-review-sdlc", args: "${next.step.data.args}"`) return `FAIL: invocation ${next.step.data.invocation}`;
        return true;
    # from: ship-rr-input: (e) open PR without a copy sends --pr
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const next = o.calls[o.calls.length - 1].envelope;
        if (next.step.id !== 'dispatch_received_review') return `FAIL: next ${next.step.id}`;
        if (!/^--auto --plan "[^"]+" --min-severity critical --pr 7$/.test(next.step.data.args)) return `FAIL: args ${next.step.data.args}`;
        return true;

