        if (e.status !== 'done' || !e.ext || e.ext.reason !== 'pending-question') return `FAIL: ${e.status} ${e.ext && e.ext.reason} ${e.error}`;
        const q = e.ext.pendingQuestion;
        if (!q || q.id !== 'finalCheckOpen' || JSON.stringify(q.options) !== JSON.stringify(['fix', 'accept-open'])) return `FAIL: question ${JSON.stringify(q)}`;
        return o.calls.some(c => c.envelope.step && c.envelope.step.id === 'dispatch_version') ? 'FAIL: dispatch_version emitted' : true;

- description: "ship-final-check: (i) a second resume without a new commit accepts the open findings"
  vars:
