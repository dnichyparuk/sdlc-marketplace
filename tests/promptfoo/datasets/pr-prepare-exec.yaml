# #9205: without --file the validator never waits on stdin. The wrapper case keeps the child's stdin
# open and prints when the child's exit event fires (the producer-side fact); no timer.
- description: "pr.js --validate-body: no --file and an open stdin pipe exits 2 at once without reading stdin (#9205)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-pr-prepare-case.js"
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_args: "--case validate-body-open-stdin"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-pr-link-validate"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        if (o.code !== 2) return `FAIL: exit ${o.code}`;
        return o.stderr.includes('requires --file <path>, or --file -') ? true : `FAIL: stderr ${o.stderr}`;

- description: "pr.js --validate-body: --file - reads the body from stdin (#9205)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-pr-prepare-case.js"
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_args: "--case validate-body-file-stdin"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-pr-link-validate"
    script_env: '{"SDLC_LINKS_OFFLINE":"1"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        if (o.status !== 0) return `FAIL: exit ${o.status}`;
        return o.out.includes('"ok":true') ? true : `FAIL: ${o.out}`;

- description: "pr.js --validate-body: a --file path that cannot be read exits 2 with a message, not a stack trace (#9205)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-pr-prepare-case.js"
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_args: "--case validate-body-unreadable"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-pr-link-validate"
    script_env: '{"SDLC_LINKS_OFFLINE":"1"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        if (o.status !== 2) return `FAIL: exit ${o.status}`;
        if (o.stderr.includes(' at ')) return `FAIL: stack trace in stderr: ${o.stderr}`;
        return o.stderr.includes('the body file cannot be read') ? true : `FAIL: stderr ${o.stderr}`;

