# Script execution tests for skill/pr.js.
# These tests run pr.js directly against fixture directories (no LLM).
#
# Note: pr.js calls gh CLI which fails without a remote.
# Tests assert on fields populated before remote operations (flags, prConfig).
# Every case sets script_stub_bin to the stub gh (fixtures-fs/stub-bin-gh), so no case,
# and no child that run-pr-prepare-case.js spawns, reaches the real gh (`gh auth switch` is global state).

# Issue #406 — cwd-aware git state: pr-prepare must read the linked worktree's
# current branch (not the main worktree's branch) when invoked from a linked
# worktree. The fix replaces checkGitState(projectRoot) with checkGitState(process.cwd()).
- description: "pr-prepare (#406): linked-worktree — currentBranch reflects linked worktree branch"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/pr.js"
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_cwd: "{{project_root}}/worktrees/wt1"
    project_root: "file://fixtures-fs/project-linked-worktree-staged"
  assert:
    - type: icontains
      value: '"currentBranch": "feature/cwd-test"'
    - type: not-icontains
      value: '"currentBranch": "main"'

- description: "pr-prepare: default flags with no args"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/pr.js"
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-pr-no-config"
  assert:
    - type: icontains
      value: '"isDraft": false'
    - type: icontains
      value: '"isAuto": false'
    # from: pr-prepare: no config sets prConfig null
    - type: javascript
      value: |
        const o = JSON.parse(output);
        return o.prConfig === null ? true : `FAIL: prConfig ${JSON.stringify(o.prConfig)}`;
    # from: pr.js #339: no config.pr.defaultBranch field falls back to git auto-detection (existing behavior preserved)
    - type: icontains
      value: '"prConfig": null'
    # from: pr-prepare: active-account-access — no origin remote skips probe (env unset)
    - type: icontains
      value: '"repoAccessProbed": false'
    # from: pr-prepare: no --expected-branch flag emits branchGuard.active=false (R-expected-branch, #347)
    - type: icontains
      value: '"active": false'
    # from: pr-prepare: branchGuard field present in successful output (R-expected-branch, #349)
    - type: icontains
      value: '"branchGuard":'
    # from: pr-prepare: openspec field reports no OpenSpec in a plain project (W4.4)
    - type: icontains
      value: '"openspec": {'
    - type: javascript
      value: |
        const m = /"openspec": \{[^}]*\}/.exec(output);
        if (!m) return 'FAIL: no openspec block';
        return /"detected": false/.test(m[0]) && /"changeName": null/.test(m[0]) ? true : `FAIL: ${m[0]}`;

