# R21: pr.footer appended by --validate-body (#9429). Temp dir with .sdlc/config.json; runs twice, reports both.
- description: "pr.js --validate-body: footer (a) appends the configured footer once"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-pr-prepare-case.js"
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_args: "--case footer-once"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-pr-link-validate"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output).first;
        if (o.status !== 0) return `FAIL: exit ${o.status}`;
        if (o.out.footerAppended !== true) return `FAIL: footerAppended ${o.out.footerAppended}`;
        return o.file === 'Body text\n\nMade with care\n' ? true : `FAIL: file ${JSON.stringify(o.file)}`;

- description: "pr.js --validate-body: footer (b) a second run appends nothing"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-pr-prepare-case.js"
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_args: "--case footer-twice"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-pr-link-validate"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        if (o.second.status !== 0) return `FAIL: exit ${o.second.status}`;
        if (o.first.out.footerAppended !== true) return 'FAIL: first run did not append';
        if (o.second.out.footerAppended !== false) return `FAIL: second footerAppended ${o.second.out.footerAppended}`;
        return o.second.file === o.first.file ? true : `FAIL: file changed ${JSON.stringify(o.second.file)}`;

- description: "pr.js --validate-body: footer (c) no footer key leaves the body unchanged"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-pr-prepare-case.js"
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_args: "--case footer-none"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-pr-link-validate"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output).first;
        if (o.status !== 0) return `FAIL: exit ${o.status}`;
        if (o.out.footerAppended !== false) return `FAIL: footerAppended ${o.out.footerAppended}`;
        return o.file === 'Body text\n' ? true : `FAIL: file ${JSON.stringify(o.file)}`;

- description: "pr-gh-refs: SKILL.md passes --base and --head to gh pr create and names the branch in gh pr edit (R-gh-explicit-refs)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/check-pr-gh-ref-sentinels.js"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        const c = r.counts;
        if (r.ok === true && c.createCalls === 1 && c.createWithRefs === 1 && c.editCalls === 1 && c.editWithBranch === 1 && c.retryRefs === 1) return true;
        return { pass: false, score: 0, reason: output };

- description: "pr-gh-refs: a gh call without the refs fails the sentinel (R-gh-explicit-refs)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/check-pr-gh-ref-sentinels.js"
    script_args: "--file tests/promptfoo/fixtures-fs/pr-gh-refs-missing/SKILL.md"
    script_show_exit: true
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output.split('\n')[0]);
        if (r.ok === false && r.counts.createWithRefs === 0 && r.counts.editWithBranch === 0 && output.includes('[exit 1]')) return true;
        return { pass: false, score: 0, reason: output };
