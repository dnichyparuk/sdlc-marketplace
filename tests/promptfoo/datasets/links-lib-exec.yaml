      value: '"ok":true'

- description: "links: ctx.github stub 404 gives github-not-found naming the URL"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/lib/links.js"
    script_args: "--file {{project_root}}/github-context-ghe.txt --json --ctx {{ctx}}"
    project_root: "file://fixtures-fs/links-lib"
    ctx: '{"github":{"host":"ghe.acme.test","owner":"acme","repo":"widgets"}}'
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/stub-bin-gh-issues"
    script_env: '{"GH_STUB_FAIL": "404@api repos/acme/widgets/issues/4"}'
  assert:
    - type: contains
      value: '"ok":false'
    - type: contains
      value: 'github-not-found'
    - type: contains
      value: 'https://ghe.acme.test/acme/widgets/issues/4'

- description: "links: ctx.github reference not found gives github-ref-not-found"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/lib/links.js"
    script_args: "--file {{project_root}}/github-context.txt --json --ctx {{ctx}}"
    project_root: "file://fixtures-fs/links-lib"
    ctx: '{"github":{"host":"github.com","owner":"acme","repo":"widgets"}}'
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/stub-bin-gh-issues"
    script_env: '{"GH_STUB_FAIL": "404@api repos/acme/widgets/issues/7"}'
  assert:
    - type: contains
      value: 'github-ref-not-found'
    - type: contains
      value: '"url":"#7"'
    - type: not-contains
      value: '#999'
    - type: not-contains
      value: '#997'
    - type: not-contains
      value: '#995'

