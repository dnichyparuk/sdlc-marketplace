- description: "links: loopback, private and metadata URLs are reported as url-blocked-host and not fetched"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/lib/links.js"
    script_args: "--file {{project_root}}/blocked-hosts.txt --json --ctx {{ctx}}"
    project_root: "file://fixtures-fs/links-lib"
    ctx: '{"offline":true}'
  assert:
    - type: contains
      value: '"ok":false'
    - type: contains
      value: '"url":"http://169.254.169.254/latest/meta-data"'
    - type: contains
      value: '"url":"http://10.0.0.5/x"'
    - type: contains
      value: '"url":"http://localhost:8080/y"'
    - type: contains
      value: 'url-blocked-host'
    - type: not-contains
      value: 'url-unreachable'

