- description: "links: URLs inside an inline code span, a double-backtick span and a fenced block are not reported"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/lib/links.js"
    script_args: "--file {{project_root}}/urls-in-code.txt --json --ctx {{ctx}}"
