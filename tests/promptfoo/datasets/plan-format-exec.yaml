# Script execution tests for validate-plan-format.js.
# These tests run validate-plan-format.js directly against fixture plan files (no LLM).
# They validate that plan format validation produces correct output for PF1-PF13 checks.
#
# Fixture appropriateness:
#   project-valid-plan                        -- CORRECT: valid 3-task plan should pass all checks (no Notes);
#                                                 also missing Context/Final Shape/etc -> PF10 fail under --final --template
#   project-invalid-plan                      -- CORRECT: plan with multiple deliberate errors (PF1-PF6)
#   project-plan-no-deviations                -- CORRECT: otherwise-valid plan missing Deviations -> PF6 fail
#   project-plan-oversized-notes               -- CORRECT: Notes block over 5 lines -> PF5 cap fail
#   project-plan-with-notes                   -- CORRECT: Deviations + short Notes -> all pass
#   project-plan-with-scorecard               -- CORRECT: full-pipeline plan with every default-template section,
#                                                 including an "## OpenSpec Appendix" heading marked
#                                                 "Not applicable — no OpenSpec change" for its non-openspec Source
#                                                 -> PF10 pass (heading always required per R59; only the body differs)
#   project-plan-openspec-appendix            -- CORRECT: full-pipeline OpenSpec plan with every default-template
#                                                 section including OpenSpec Appendix -> passes PF1-PF10
#   project-plan-appendix-heading-injection   -- CORRECT: fenced (4-backtick) example containing a nested
#                                                 3-backtick fence and a `### Task 1:` heading -> stripFences
#                                                 must remove it whole so PF2 task count/PF10 stay uncorrupted;
#                                                 openspec Source with no real "## OpenSpec Appendix" -> PF10 fail
#   project-plan-custom-template              -- CORRECT: project .sdlc/plan-template.md drops Research Findings
#                                                 and adds Security Impact -> PF10 follows the custom template, not the default
#   project-plan-shared-modify                -- CORRECT: Tasks 2 and 3 both modify src/routes/index.js with no Depends on
#                                                 link -> PF12 fail; Task 3 modifies src/utils/helper.js that Task 1
#                                                 (not its ancestor) creates -> PF13 fail under --root
#   project-plan-shared-modify-ordered        -- CORRECT: Tasks 1 and 3 both modify README.md, Task 3 reaches Task 1
#                                                 through Task 2 -> PF12 pass; Task 3's src/utils/helper.js is created
#                                                 by its ancestor Task 1 -> PF13 exempts it
#   project-plan-long-contract                -- CORRECT: Acceptance block followed by a Contract over 5000 characters
#                                                 -> PF5 pass (the Acceptance block has no length limit)
#   project-plan-checkbox-outside-ac          -- CORRECT: Acceptance block is prose; the only checkbox sits in the
#                                                 Contract -> PF5 fail (a checkbox outside the block does not count)
#   plan-g17-u3 (plans/fenced-files.md)       -- CORRECT: Files lines inside a column-0 and an indented fence
#                                                 -> PF13 pass and PF15 pass (fenced lines are not Files entries, #9409)

- description: "plan-format: valid plan passes all checks (JSON)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/validate-plan-format.js"
    script_args: "--project-root {{project_root}} --file {{project_root}}/plans/test-plan.md --json"
    project_root: "file://fixtures-fs/project-valid-plan"
  assert:
    - type: icontains
      value: '"passed": true'
    - type: regex
      value: '"failed":\s*0'
    - type: icontains
      value: '"status": "pass"'
    # from: plan-format PF11: a plan without a **Commit:** header field passes
    - type: javascript
      value: 'JSON.parse(output).checks.some(x => x.id === "PF11" && x.status === "pass" && x.message.includes("No **Commit:** header field"))'
    # from: plan-format: PF14 a plan without the field passes
    - type: javascript
      value: 'JSON.parse(output).checks.some(x => x.id === "PF14" && x.status === "pass" && x.message.includes("No **Fix commit:** header field"))'
    # from: plan-format: PF13 not run without --root
    - type: not-icontains
      value: "PF13"
    # from: plan-format-lean: (b) PF15 passes a clean plan
    - type: javascript
      value: 'JSON.parse(output.slice(0, output.lastIndexOf("}") + 1)).checks.some(x => x.id === "PF15" && x.status === "pass")'

- description: "plan-format: valid plan passes all checks (markdown)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/validate-plan-format.js"
    script_args: "--project-root {{project_root}} --file {{project_root}}/plans/test-plan.md --markdown"
    project_root: "file://fixtures-fs/project-valid-plan"
  assert:
    - type: icontains
      value: "Plan Format Validation Report"
    - type: icontains
      value: "PASS"
    - type: icontains
      value: "Format floor"
    # PASS rows print even when another check fails; only the floor line and no FAIL row prove a pass
    - type: contains
      value: "**Format floor:** PASS"
    - type: not-contains
      value: "| FAIL |"

- description: "plan-format: missing Verification header triggers PF1 fail"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/validate-plan-format.js"
