# --- PF12: shared Modify paths in dependency order; PF13: Modify path existence (under --root only); PF4 details ---

- description: "plan-format: PF12 flags shared Modify path without Depends on link"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/validate-plan-format.js"
    script_args: "--project-root {{project_root}} --file {{project_root}}/plans/test-plan.md --json"
    project_root: "file://fixtures-fs/project-plan-shared-modify"
  assert:
    - type: javascript
      value: 'JSON.parse(output.slice(0, output.lastIndexOf("}") + 1)).checks.some(x => x.id === "PF12" && x.status === "fail" && x.details[0].gateId === "G4" && x.details[0].taskRef === "Task 3" && x.message.includes("`src/routes/index.js`"))'

- description: "plan-format: PF12 passes when sharing tasks are transitively dependent"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/validate-plan-format.js"
    script_args: "--project-root {{project_root}} --file {{project_root}}/plans/test-plan.md --json"
    project_root: "file://fixtures-fs/project-plan-shared-modify-ordered"
  assert:
    - type: javascript
      value: '((r) => r.passed === true && r.checks.some(x => x.id === "PF12" && x.status === "pass"))(JSON.parse(output))'

- description: "plan-format: PF13 flags missing Modify path under --root"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/validate-plan-format.js"
    script_args: "--project-root {{project_root}} --file {{project_root}}/plans/test-plan.md --json --root {{project_root}}"
    project_root: "file://fixtures-fs/project-valid-plan"
  assert:
    - type: icontains
      value: "PF13"
    - type: icontains
      value: "src/routes/index.js"
    - type: regex
      value: '"gateId":\s*"G10"'

- description: "plan-format: PF13 not run without --root"
  vars:
