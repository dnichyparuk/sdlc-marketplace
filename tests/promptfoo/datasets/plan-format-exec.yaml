      value: '"passed": false'
    - type: icontains
      value: "PF1"
    - type: icontains
      value: "Verification"
    # from: plan-format: non-contiguous numbering triggers PF2 fail
    - type: icontains
      value: "PF2"
    - type: icontains
      value: "non-contiguous"
    # from: plan-format: invalid Complexity value triggers PF3 fail
    - type: icontains
      value: "PF3"
    - type: icontains
      value: "Easy"
    # from: plan-format: invalid dependency triggers PF4 fail
    - type: icontains
      value: "PF4"
    - type: icontains
      value: "Task 7"
    # from: plan-format: missing checkbox triggers PF5 fail
    - type: icontains
      value: "PF5"
    - type: icontains
      value: "no checkbox"
    # from: plan-format: PF4 details map missing target to G12
    - type: regex
      value: '"gateId":\s*"G12"'

