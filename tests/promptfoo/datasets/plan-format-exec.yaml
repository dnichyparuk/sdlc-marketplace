# Script execution tests for validate-plan-format.js.
# These tests run validate-plan-format.js directly against fixture plan files (no LLM).
# They validate that plan format validation produces correct output for PF1-PF11 checks.
#
# Fixture appropriateness:
#   project-valid-plan                        -- CORRECT: valid 3-task plan should pass all checks (no Notes);
#                                                 also missing Context/Final Shape/etc -> PF10 fail under --final --template
#   project-invalid-plan                      -- CORRECT: plan with multiple deliberate errors (PF1-PF6)
#   project-plan-no-deviations                -- CORRECT: otherwise-valid plan missing Deviations -> PF6 fail
#   project-plan-oversized-notes               -- CORRECT: Notes block over 5 lines -> PF5 cap fail
#   project-plan-with-notes                   -- CORRECT: Deviations + short Notes -> all pass
#   project-plan-with-scorecard               -- CORRECT: full-pipeline plan with every default-template section,
#                                                 including an "## OpenSpec Appendix" heading marked
#                                                 "Not applicable — no OpenSpec change" for its non-openspec Source
#                                                 -> PF10 pass (heading always required per R59; only the body differs)
#   project-plan-openspec-appendix            -- CORRECT: full-pipeline OpenSpec plan with every default-template
#                                                 section including OpenSpec Appendix -> passes PF1-PF10
#   project-plan-appendix-heading-injection   -- CORRECT: fenced (4-backtick) example containing a nested
#                                                 3-backtick fence and a `### Task 1:` heading -> stripFences
#                                                 must remove it whole so PF2 task count/PF10 stay uncorrupted;
#                                                 openspec Source with no real "## OpenSpec Appendix" -> PF10 fail
#   project-plan-custom-template              -- CORRECT: project .sdlc/plan-template.md drops Research Findings
#                                                 and adds Security Impact -> PF10 follows the custom template, not the default

- description: "plan-format: valid plan passes all checks (JSON)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/validate-plan-format.js"
    script_args: "--project-root {{project_root}} --file {{project_root}}/plans/test-plan.md --json"
    project_root: "file://fixtures-fs/project-valid-plan"
  assert:
    - type: icontains
      value: '"passed": true'
    - type: regex
      value: '"failed":\s*0'
    - type: icontains
      value: '"status": "pass"'

- description: "plan-format: valid plan passes all checks (markdown)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/validate-plan-format.js"
    script_args: "--project-root {{project_root}} --file {{project_root}}/plans/test-plan.md --markdown"
    project_root: "file://fixtures-fs/project-valid-plan"
  assert:
    - type: icontains
      value: "Plan Format Validation Report"
    - type: icontains
      value: "PASS"
    - type: icontains
      value: "Format floor"

