# Script execution tests for review.js — covers plugin_version resolution (#363) and
# on-demand forced-active dimension behavior (#362).
# These run the harness scripts directly against fixture directories (no LLM).

- description: "review-prepare (#362): --dimensions forces on-demand dimension active when triggers match zero (issue #362)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-review-on-demand-dimension.js"
    script_args: "--project-root {{project_root}} --scenario forced"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-on-demand-dimension"
  assert:
    # Dimension must be ACTIVE when named in --dimensions even though triggers match zero files
    - type: javascript
      value: JSON.parse(output).status === 'ACTIVE'
    # matched_files must equal changedFiles (force-active uses all changed files)
    - type: javascript
      value: "JSON.parse(output).matched_files_count === JSON.parse(output).changed_files_count && JSON.parse(output).matched_files_count > 0"
    # forced flag must be set (harness-only observability — NOT a manifest contract field;
    # the real review.js manifest does not include `forced`, the test script re-derives it from inputs)
    - type: javascript
      value: JSON.parse(output).forced === true

- description: "review-prepare (#362): on-demand dimension stays SKIPPED when --dimensions filter omitted (issue #362)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-review-on-demand-dimension.js"
    script_args: "--project-root {{project_root}} --scenario default"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-on-demand-dimension"
  assert:
    # Dimension must remain SKIPPED when not named in --dimensions (backward-compat)
    - type: javascript
      value: JSON.parse(output).status === 'SKIPPED'
    # matched_files must be 0 (no trigger match, no force-active)
    - type: javascript
      value: JSON.parse(output).matched_files_count === 0
    # forced must be falsy
    - type: javascript
      value: "!JSON.parse(output).forced"

- description: "review-prepare (#447): manifest-split — thin index excludes heavy fields and stays small while slices carry body/matched_files (issue #447)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-review-manifest-split.js"
    script_args: "--project-root {{project_root}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-manifest-split"
  assert:
    # The thin index must NOT inline body/matched_files, must not carry the dropped commit_log,
    # and must stay far below the synthesized total body size (8 dims x 4096 bytes = 32768 bytes
    # of body alone) — proving the index scales with dimension COUNT, not content.
    - type: javascript
      value: |
        const r = JSON.parse(output);
        return r.index_has_body === false &&
          r.index_has_matched_files === false &&
          r.index_has_commit_log === false &&
          r.slice_has_body === true &&
          r.slice_has_matched_files === true &&
          r.index_bytes < 8000;

- description: "review-prepare (#363): manifest includes plugin_version matching semver or 'unknown'"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-review-plugin-version.js"
    script_args: ""
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-config-current-v3"
  assert:
    # plugin_version must be present in the emitted manifest fragment.
    - type: javascript
      value: |
        const semverOrUnknown = /^"plugin_version":"([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?|unknown)"$/;
        return semverOrUnknown.test(output.replace(/\s/g, '').replace(/^\{/, '').replace(/\}$/, ''));

- description: "review-prepare (#490): linked-worktree (worktree-linked-ahead) — changed_files_count & current_branch reflect wt1, not the main worktree"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/review.js"
    script_args: "--committed --base main"
    script_cwd: "{{project_root}}/worktrees/wt1"
    project_root: "file://fixtures-fs/worktree-linked-ahead"
  assert:
    # current_branch must reflect the ACTIVE worktree's branch (wt1 = feature/cwd-test),
    # not the main worktree's branch — proves getChangedFiles/getCommitCount route to activeRoot
    - type: icontains
      value: '"current_branch": "feature/cwd-test"'
    # changed_files_count must reflect wt1's one committed file vs main (linked-file.txt),
    # not zero (which is what a HEAD-relative bug computed from the main worktree would yield)
    - type: icontains
      value: '"changed_files_count": 1'

- description: "review-prepare (summary_copy_path): manifest emits an absolute review-summary copy path under the state dir, slugged from the branch"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/review.js"
    script_args: "--committed --base main"
    script_cwd: "{{project_root}}/worktrees/wt1"
    project_root: "file://fixtures-fs/worktree-linked-ahead"
  assert:
    # summary_copy_path is absolute and ends with .sdlc/execution/review-summary-<slug>.json (slug of feature/cwd-test)
    - type: regex
      value: '"summary_copy_path": "/[^"]*/\.sdlc/execution/review-summary-feature-cwd-test\.json"'

- description: "review-cap: (a) 10 matching dimensions give 10 dispatched entries with a slice_file and batch 1 or 2, none QUEUED"
  vars:
    script_path: "-e"
    script_args: '(({loadAndMatchDimensions:l,writeDimensionSlices:w,toIndexEntry:t,refinePlan:r},fs,os,p)=>{const[d,o]=[l(process.cwd(),["src/a.js","lib/a.js"],null),fs.mkdtempSync(p.join(os.tmpdir(),"review-cap-"))];w(d.filter(x=>x.status==="ACTIVE"),o,null);const[n,e]=[r(d),d.map(x=>t(x))];const[ok]=[e.filter(x=>x.status==="ACTIVE").every(x=>fs.existsSync(x.slice_file))];fs.rmSync(o,{recursive:true,force:true});console.log(JSON.stringify({n,ok,e}))})(require("{{repo_root}}/plugins/sdlc-utilities/scripts/skill/review.js"),require("fs"),require("os"),require("path"))'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/review-cap-dimensions"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output); const x = r.e.filter(e => e.status === "ACTIVE");
        return r.n === 2 && r.ok === true && x.length === 10 && !r.e.some(e => e.status === "QUEUED") && x.every(e => typeof e.slice_file === "string") && x.filter(e => e.batch === 1).length === 8 && x.filter(e => e.batch === 2).length === 2 && r.e.filter(e => e.status === "SKIPPED").every(e => e.batch === null && e.slice_file === null);

- description: "review-cap: (b) 8 matching dimensions all go to batch 1"
  vars:
    script_path: "-e"
    script_args: '(({loadAndMatchDimensions:l,writeDimensionSlices:w,toIndexEntry:t,refinePlan:r},fs,os,p)=>{const[d,o]=[l(process.cwd(),["src/a.js"],null),fs.mkdtempSync(p.join(os.tmpdir(),"review-cap-"))];w(d.filter(x=>x.status==="ACTIVE"),o,null);const[n,e]=[r(d),d.map(x=>t(x))];const[ok]=[e.filter(x=>x.status==="ACTIVE").every(x=>fs.existsSync(x.slice_file))];fs.rmSync(o,{recursive:true,force:true});console.log(JSON.stringify({n,ok,e}))})(require("{{repo_root}}/plugins/sdlc-utilities/scripts/skill/review.js"),require("fs"),require("os"),require("path"))'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/review-cap-dimensions"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output); const x = r.e.filter(e => e.status === "ACTIVE");
        return r.n === 1 && r.ok === true && x.length === 8 && x.every(e => e.batch === 1) && r.e.filter(e => e.status === "SKIPPED").length === 9;

- description: "review-cap: (b2) 17 matching dimensions give batches of 8, 8 and 1 in priority order"
  vars:
    script_path: "-e"
    script_args: '(({loadAndMatchDimensions:l,writeDimensionSlices:w,toIndexEntry:t,refinePlan:r},fs,os,p)=>{const[d,o]=[l(process.cwd(),["src/a.js","lib/a.js","pkg/a.js"],null),fs.mkdtempSync(p.join(os.tmpdir(),"review-cap-"))];w(d.filter(x=>x.status==="ACTIVE"),o,null);const[n,e]=[r(d),d.map(x=>t(x))];const[ok]=[e.filter(x=>x.status==="ACTIVE").every(x=>fs.existsSync(x.slice_file))];fs.rmSync(o,{recursive:true,force:true});console.log(JSON.stringify({n,ok,e}))})(require("{{repo_root}}/plugins/sdlc-utilities/scripts/skill/review.js"),require("fs"),require("os"),require("path"))'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/review-cap-dimensions"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output); const c = k => r.e.filter(e => e.batch === k).length;
        return r.n === 3 && r.ok === true && r.e.length === 17 && c(1) === 8 && c(2) === 8 && c(3) === 1 && r.e.filter(e => e.severity === "high").every(e => e.batch === 1) && r.e.find(e => e.name === "cap-d17").batch === 3;

- description: "review-cap: (c) the repo's hook-readiness dimension matches plugins/sdlc-utilities/hooks/session-start.js"
  vars:
    script_path: "-e"
    script_args: '(({loadAndMatchDimensions:l})=>{const[h]=[l("{{repo_root}}",["plugins/sdlc-utilities/hooks/session-start.js"],null).find(x=>x.name==="hook-readiness")];console.log(JSON.stringify({status:h&&h.status,matched:h&&h.matched_count}))})(require("{{repo_root}}/plugins/sdlc-utilities/scripts/skill/review.js"))'
  assert:
    - type: javascript
      value: "const r = JSON.parse(output); r.status === 'ACTIVE' && r.matched === 1"
