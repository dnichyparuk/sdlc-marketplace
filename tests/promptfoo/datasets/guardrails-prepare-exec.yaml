# Script execution tests for skill/guardrails.js detection gaps (Issues #137, #138, #139).
# These tests run guardrails.js directly against fixture directories (no LLM).
# They validate expanded framework, database, and API signal detection.
#
# Fixture appropriateness:
#   project-lambda-middy-http         -- #137 Lambda HTTP API + #139 middy/esbuild frameworks
#   project-serverless-dynamodb       -- #137 Serverless API + #138 DynamoDB + #139 serverless-framework
#   project-mongodb-express           -- #138 MongoDB + regression (express/routes still works)
#   project-lambda-worker-no-api      -- #137 negative test (middy core alone != API)
#   project-validation-observability  -- #139 breadth test (zod, sentry, datadog, esbuild)
#   project-cdk-redis                 -- #138 Redis + #139 aws-cdk framework

# --- API detection (#137) ---

- description: "guardrails-prepare: middy-http deps trigger lambda-http API detection"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/guardrails.js"
    script_args: "--project-root {{project_root}}"
    project_root: "file://fixtures-fs/project-lambda-middy-http"
  assert:
    - type: icontains
      value: '"hasApi": true'
    - type: icontains
      value: '"apiFormat": "lambda-http"'
    # from: guardrails-prepare: @middy/ prefix triggers middy framework detection
    - type: icontains
      value: '"middy"'
    - type: icontains
      value: '"esbuild"'
    # from: guardrails-prepare: handler file in src/function/ triggers lambda-http
    # handler.ts exists in src/function/ — but middy-http dep already triggers earlier

- description: "guardrails-prepare: serverless dir triggers serverless API detection"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/guardrails.js"
    script_args: "--project-root {{project_root}}"
    project_root: "file://fixtures-fs/project-serverless-dynamodb"
  assert:
    - type: icontains
      value: '"hasApi": true'
    - type: icontains
      value: '"apiFormat": "serverless"'
    # from: guardrails-prepare: serverless in devDeps triggers serverless-framework detection
    - type: icontains
      value: '"serverless-framework"'
    # from: guardrails-prepare: DynamoDB SDK triggers dynamodb database detection
    - type: icontains
      value: '"hasDatabase": true'
    - type: icontains
      value: '"dbType": "dynamodb"'

- description: "guardrails-prepare: middy core alone does NOT trigger API detection (negative)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/guardrails.js"
    script_args: "--project-root {{project_root}}"
    project_root: "file://fixtures-fs/project-lambda-worker-no-api"
  assert:
    - type: icontains
      value: '"hasApi": false'

# --- Database detection (#138) ---

- description: "guardrails-prepare: mongoose triggers mongodb database detection"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/guardrails.js"
    script_args: "--project-root {{project_root}}"
    project_root: "file://fixtures-fs/project-mongodb-express"
  assert:
    - type: icontains
      value: '"hasDatabase": true'
    - type: icontains
      value: '"dbType": "mongodb"'
    # from: guardrails-prepare #336: every proposal in a baseline project has non-empty category
    - type: javascript
      value: "(() => { const d = JSON.parse(output); return d.proposals.every(p => typeof p.category === 'string' && p.category.length > 0); })()"
    # from: guardrails-prepare #336: non-Prisma project does NOT emit prisma-migration-required
    - type: not-icontains
      value: '"id": "prisma-migration-required"'
    # from: guardrails-prepare #336: non-Svelte/Astro project does NOT emit island-only-interactivity
    - type: not-icontains
      value: '"id": "island-only-interactivity"'
    # from: guardrails-prepare: express + routes still triggers rest API (regression)
    - type: icontains
      value: '"hasApi": true'
    - type: icontains
      value: '"apiFormat": "rest"'
    - type: icontains
      value: '"express"'

- description: "guardrails-prepare: ioredis triggers redis database detection"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/guardrails.js"
    script_args: "--project-root {{project_root}}"
    project_root: "file://fixtures-fs/project-cdk-redis"
  assert:
    - type: icontains
      value: '"hasDatabase": true'
    - type: icontains
      value: '"dbType": "redis"'
    # from: guardrails-prepare: aws-cdk-lib triggers aws-cdk framework detection
    - type: icontains
      value: '"aws-cdk"'

# --- Framework detection (#139) ---

- description: "guardrails-prepare: zod, sentry, datadog, esbuild detected as frameworks"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/guardrails.js"
    script_args: "--project-root {{project_root}}"
    project_root: "file://fixtures-fs/project-validation-observability"
  assert:
    - type: icontains
      value: '"zod"'
    - type: icontains
      value: '"sentry"'
    - type: icontains
      value: '"datadog"'
    - type: icontains
      value: '"esbuild"'

# --- Regression ---

# --- Issue #259: detectReviewDimensions must read .sdlc/review-dimensions/ via resolveDimensionsDir ---

- description: "guardrails-prepare: discovers dimensions at .sdlc/review-dimensions/ (issue #259)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/guardrails.js"
