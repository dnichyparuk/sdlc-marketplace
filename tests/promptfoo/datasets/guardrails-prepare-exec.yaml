- description: "guardrails-prepare: still discovers dimensions at legacy .claude/review-dimensions/ via deprecation fallback (regression)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/guardrails.js"
    script_args: "--project-root {{project_root}}"
    project_root: "file://fixtures-fs/project-with-dimensions"
  assert:
    - type: icontains
      value: '"security-review"'
    - type: not-icontains
      value: '"reviewDimensions": []'

# --- planning-discipline catalog (#270 promotion): five plan-only always-on guardrails ---

- description: "guardrails-prepare planning-discipline: --target plan emits all five new IDs"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/guardrails.js"
    script_args: "--project-root {{project_root}} --target plan"
    project_root: "file://fixtures-fs/project-mongodb-express"
  assert:
    - type: icontains
      value: '"id": "state-premise"'
    - type: icontains
      value: '"id": "smallest-viable-cut"'
    - type: icontains
      value: '"id": "failure-audience"'
    - type: icontains
      value: '"id": "explicit-non-goals"'
    - type: icontains
      value: '"id": "ambiguity-stops-and-asks"'
    # from: guardrails-prepare planning-discipline: all five entries have category planning-discipline
    - type: javascript
      value: "(() => { const d = JSON.parse(output); const m = Object.fromEntries(d.proposals.map(p => [p.id, p])); return ['state-premise','smallest-viable-cut','failure-audience','explicit-non-goals','ambiguity-stops-and-asks'].every(id => m[id]?.category === 'planning-discipline'); })()"
    # from: guardrails-prepare planning-discipline: failure-audience, explicit-non-goals, smallest-viable-cut are severity warning
    - type: javascript
      value: "(() => { const d = JSON.parse(output); const m = Object.fromEntries(d.proposals.map(p => [p.id, p])); return ['failure-audience','explicit-non-goals','smallest-viable-cut'].every(id => m[id]?.severity === 'warning'); })()"
    # from: guardrails-prepare planning-discipline: state-premise and ambiguity-stops-and-asks are severity error
    - type: javascript
      value: "(() => { const d = JSON.parse(output); const m = Object.fromEntries(d.proposals.map(p => [p.id, p])); return m['state-premise']?.severity === 'error' && m['ambiguity-stops-and-asks']?.severity === 'error'; })()"

- description: "guardrails-prepare planning-discipline: --target execute omits all five IDs"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/guardrails.js"
    script_args: "--project-root {{project_root}} --target execute"
    project_root: "file://fixtures-fs/project-mongodb-express"
  assert:
    - type: not-icontains
      value: '"id": "state-premise"'
    - type: not-icontains
      value: '"id": "smallest-viable-cut"'
    - type: not-icontains
      value: '"id": "failure-audience"'
    - type: not-icontains
      value: '"id": "explicit-non-goals"'
    - type: not-icontains
      value: '"id": "ambiguity-stops-and-asks"'

# --- Framework-specific guardrails (#336) ---

- description: "guardrails-prepare #336: Svelte project emits island-only-interactivity proposal"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/guardrails.js"
    script_args: "--project-root {{project_root}}"
    project_root: "file://fixtures-fs/project-svelte-app"
  assert:
    - type: icontains
      value: '"id": "island-only-interactivity"'
    - type: javascript
      value: "(() => { const d = JSON.parse(output); const p = d.proposals.find(x => x.id === 'island-only-interactivity'); return p?.category === 'framework' && p?.severity === 'warning'; })()"
    # from: guardrails-prepare #336: every proposal in a Svelte project has non-empty category
    - type: javascript
      value: "(() => { const d = JSON.parse(output); return d.proposals.every(p => typeof p.category === 'string' && p.category.length > 0); })()"

