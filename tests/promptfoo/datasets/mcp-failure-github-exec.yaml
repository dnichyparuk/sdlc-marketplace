# Script execution tests for `mcp-failure.js --source github` (github-sdlc R26, R32, P14, C13).
# Same runner and C17 conventions as github-sdlc-exec.yaml (stub gh, no network).

- description: "mcp-failure github: validation analyze gives proposal, labels and the duplicate search call"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "--script plugins/sdlc-utilities/scripts/lib/mcp-failure.js -- --analyze --record --source github --class validation --operation create --repo acme/widgets --error 'HTTP 422' --recovered no --step R26"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/stub-bin-gh-issues"
    script_env: '{"SDLC_LINKS_OFFLINE": "1"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const j = o.json;
        const argv = o.calls.length === 1 ? o.calls[0].argv.join(' ') : '';
        const ok = o.exit === 0 && j && j.shouldDispatch === true && j.action === 'create' && j.duplicate === null
          && j.proposalTitle === 'gh-failure[validation]: create on acme/widgets'
          && JSON.stringify(j.labels) === '["tooling-error","github-sdlc"]'
          && j.errorReportArgs === "--error-type gh-validation --skill github-sdlc --step 'R26' --operation 'create'"
          && argv.startsWith('issue list -R rnagrodzki/sdlc-marketplace')
          && argv.includes('--label tooling-error --label github-sdlc');
        return ok ? true : `FAIL ${output}`;

- description: "mcp-failure github: an open issue with the gh-failure title gives duplicate.url and show-duplicate"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "--script plugins/sdlc-utilities/scripts/lib/mcp-failure.js -- --analyze --source github --class validation --operation create --repo acme/widgets --error 'HTTP 422' --recovered no --step R26"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/stub-bin-gh-issues"
    script_env: '{"SDLC_LINKS_OFFLINE": "1", "GH_STUB_DATA": "report-duplicate"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const j = o.json;
        const ok = o.exit === 0 && j && j.action === 'show-duplicate' && j.shouldDispatch === true
          && j.duplicate.number === 77 && j.duplicate.url === 'https://github.com/rnagrodzki/sdlc-marketplace/issues/77';
        return ok ? true : `FAIL ${output}`;

