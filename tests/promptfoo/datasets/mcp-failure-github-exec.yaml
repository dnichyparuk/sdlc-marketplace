- description: "mcp-failure github: --record writes the R32 block and redacts GitHub tokens (C13)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "--script plugins/sdlc-utilities/scripts/lib/mcp-failure.js --dump .sdlc/learnings/log.md -- --analyze --record --source github --class validation --operation create --repo acme/widgets --error github_pat_11ABC,ghp_abc --recovered no --step R26"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/stub-bin-gh-issues"
    script_env: '{"SDLC_LINKS_OFFLINE": "1"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const log = o.dumps['.sdlc/learnings/log.md'] || '';
        const lines = log.split('\n');
        const ok = o.exit === 0
          && /^## \d{4}-\d{2}-\d{2} — github-sdlc gh-failure\[validation\]: create$/.test(lines[0])
          && lines[1] === '- operation: create' && lines[2] === '- repo: acme/widgets'
          && lines[3] === '- class: validation' && lines[4] === '- error: [REDACTED],[REDACTED]'
          && lines[5] === '- recovered: no'
          && !log.includes('github_pat_') && !log.includes('ghp_')
          && o.json.errorText.includes('[REDACTED],[REDACTED]')
          && !o.stdout.includes('github_pat_') && !o.stdout.includes('ghp_');
        return ok ? true : `FAIL ${output}`;

- description: "mcp-failure github: --telemetry --source github writes a github-format block with the github class kept"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-github-case.js"
    script_args: "--script plugins/sdlc-utilities/scripts/lib/mcp-failure.js -- --telemetry --source github --class rate-limit --operation view --repo acme/widgets --error forbidden --recovered no"
    script_stub_bin: "fixtures-fs/stub-bin-gh-issues/bin"
    script_home: "fixtures-fs/stub-bin-gh-issues"
    script_env: '{"SDLC_LINKS_OFFLINE": "1"}'
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const log = o.stdout || '';
        const ok = o.exit === 0 && /github-sdlc gh-failure\[rate-limit\]: view/.test(log)
          && log.includes('- repo: acme/widgets') && !log.includes('jira-sdlc');
        return ok ? true : `FAIL ${output}`;
