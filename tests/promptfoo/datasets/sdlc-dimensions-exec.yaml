    script_args: ""
  assert:
    # All tests must pass
    - type: icontains
      value: "All readCommonPrompt tests passed"
    - type: icontains
      value: "PASS: Test 1"
    - type: icontains
      value: "PASS: Test 2"
    - type: icontains
      value: "PASS: Test 3"
    - type: icontains
      value: "PASS: Test 4"
    - type: icontains
      value: "PASS: Test 5"
