- description: "sdlc-dimensions-model: a claude-* model id passes"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/validate-dimensions.js"
    script_args: "--project-root {{project_root}} --json"
    project_root: "file://fixtures-fs/project-with-dimensions"
  assert:
    # The fixture dimension uses a claude-* id; no D13 finding
    - type: not-icontains
      value: "D13"
    - type: regex
      value: '"total_errors":\s*0'

- description: "sdlc-dimensions: _common.md is excluded from validation results"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/validate-dimensions.js"
    script_args: "--project-root {{project_root}} --json"
    project_root: "file://fixtures-fs/project-with-dimensions"
  assert:
    # With _common.md in the fixture but excluded, total should still be 3
    - type: regex
      value: '"total":\s*3'
    # _common.md file must NOT appear in results
    - type: regex
      value: '(?!_common\.md)'
    # Three dimensions should be present
    - type: icontains
      value: "security-review"
    - type: icontains
      value: "code-quality-review"
    - type: icontains
      value: "model-override-review"

- description: "sdlc-dimensions: _common.md absent has no effect on validation (regression guard)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/ci/validate-dimensions.js"
    script_args: "--project-root {{project_root}} --json"
    project_root: "file://fixtures-fs/project-with-sdlc-dimensions"
  assert:
    # No _common.md in this fixture; behavior is unchanged from pre-feature baseline.
    - type: icontains
      value: '"overall": "PASS"'
    - type: regex
      value: '"total_errors":\s*0'
    - type: regex
      value: '"total":\s*1'
    - type: icontains
      value: "security-review"

- description: "sdlc-dimensions: readCommonPrompt utility function works correctly"
  vars:
