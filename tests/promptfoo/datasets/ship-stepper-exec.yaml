- description: "ship-step: (e) --after learnings_commit emits cleanup with an absolute script path; --after cleanup returns done"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario after-cleanup --seed frozen --result results/cleanup-ok.json"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const [first, second] = o.calls.map(c => c.envelope);
        if (first.status !== 'step' || first.step.id !== 'cleanup') return `FAIL: first ${first.status} ${first.step && first.step.id}`;
        const cmd = first.step.data.commands[0];
        const m = /^node "([^"]+)" cleanup-pipeline$/.exec(cmd);
        if (!m) return `FAIL: cleanup command ${cmd}`;
        if (o.commandScripts[m[1]] !== true) return `FAIL: script path not absolute or missing: ${m[1]}`;
        if (second.status !== 'done') return `FAIL: second ${JSON.stringify(second)}`;
        if (o.calls[1].exitCode !== 0) return `FAIL: exit ${o.calls[1].exitCode}`;
        return true;
    # from: ship-step: (e2) --after cleanup after the ledger is really deleted still returns the Step 6 summary (X1)
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const [first, second] = o.calls.map(c => c.envelope);
        if (o.ledgerExists) return 'FAIL: the ledger was expected to be deleted before --after cleanup';
        if (second.status !== 'done') return `FAIL: second ${JSON.stringify(second)}`;
        const s = second.ext && second.ext.summary;
        if (!s || !Array.isArray(s.steps) || s.steps.length === 0) return `FAIL: ext.summary missing after cleanup: ${JSON.stringify(second.ext)}`;
        if (JSON.stringify(s) !== JSON.stringify(first.step.data.summary)) return 'FAIL: ext.summary differs from the summary built when cleanup was emitted';
        if (!s.usage || !('prUrl' in s)) return `FAIL: summary lacks usage/prUrl: ${JSON.stringify(s)}`;
        if (o.summarySidecars.length !== 0) return `FAIL: summary sidecar not removed: ${o.summarySidecars}`;
        return true;

- description: "ship-step: (z) a failed dispatch step sweeps stale state files in-process and keeps the failed ledger (R38 failure path, M7)"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario after-commit-fail-gc --seed frozen --result results/commit-fail.json"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const env = o.calls[0].envelope;
        if (env.status !== 'error') return `FAIL: status ${env.status}`;
        if (o.calls[0].exitCode !== 1) return `FAIL: exit ${o.calls[0].exitCode}`;
        if (o.ledger.stepStatuses.commit !== 'failed') return `FAIL: commit ${o.ledger.stepStatuses.commit}`;
        if (o.ledgerFiles.includes('ship-gone-branch-20200101T000000Z.json')) return `FAIL: stale orphan not swept: ${o.ledgerFiles}`;
        if (!o.ledgerFiles.some(f => f.startsWith('ship-feat-ship-'))) return `FAIL: failed ledger was deleted: ${o.ledgerFiles}`;
        return true;

