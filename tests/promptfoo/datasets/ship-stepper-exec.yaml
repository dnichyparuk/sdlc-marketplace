- description: "ship-step: (c) --after dispatch_commit records commit completed and emits dispatch_review"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario after-commit-ok --seed frozen --result results/commit-ok.json"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const e = o.calls[0].envelope;
        if (o.calls[0].exitCode !== 0) return `FAIL: exit ${o.calls[0].exitCode}`;
        if (e.status !== 'step' || e.step.id !== 'dispatch_review') return `FAIL: next ${e.step && e.step.id}`;
        if (o.ledger.stepStatuses.commit !== 'completed') return `FAIL: commit ${o.ledger.stepStatuses.commit}`;
        if (o.ledger.history.length !== 1 || o.ledger.history[0].step !== 'dispatch_commit' || o.ledger.history[0].result !== 'success') return `FAIL: history ${JSON.stringify(o.ledger.history)}`;
        if (!e.ext.todos || !Array.isArray(e.ext.todos.todos)) return 'FAIL: ext.todos missing';
        return true;
    # from: ship-step: (x) dispatch step data carries isolation only when computeSteps sets it
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const e = o.calls[0].envelope;
        if (e.status !== 'step' || !e.step.id.startsWith('dispatch_')) return `FAIL: next ${e.status} ${e.step && e.step.id}`;
        // computeSteps sets isolation: null on every fixture step, so the key must be absent (no null leak).
        if ('isolation' in e.step.data) return `FAIL: isolation present: ${JSON.stringify(e.step.data.isolation)}`;
        return true;

