    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario initial-dry-run --plan plan.md"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const e = o.calls[0].envelope;
        if (e.status !== 'step') return `FAIL: status ${e.status}`;
        if (!e.step || e.step.id !== 'confirm_pipeline') return `FAIL: step ${JSON.stringify(e.step)}`;
        if (e.llm_decision !== null) return `FAIL: llm_decision ${JSON.stringify(e.llm_decision)}`;
        if (e.state_file !== null) return `FAIL: state_file ${e.state_file}`;
        if (o.ledgerExists !== false) return 'FAIL: dry-run created a ledger';
        if (!e.context || !('sdlcGitignored' in e.context) || !Array.isArray(e.steps)) return 'FAIL: prepare keys sdlcGitignored/steps missing';
        return true;

- description: "ship-step: (b) --after confirm_pipeline with yes emits branch_prepare or dispatch_execute"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario after-confirm --seed frozen --result results/yes.json --quality balanced"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const e = o.calls[0].envelope;
        if (o.calls[0].exitCode !== 0) return `FAIL: exit ${o.calls[0].exitCode}: ${JSON.stringify(e)}`;
        if (e.status !== 'step' || !['branch_prepare', 'dispatch_execute'].includes(e.step.id)) return `FAIL: ${e.status} ${e.step && e.step.id}`;
        if (o.ledger.history.length !== 1 || o.ledger.history[0].step !== 'confirm_pipeline') return `FAIL: history ${JSON.stringify(o.ledger.history)}`;
        return true;
    # from: ship-step: (m) worktree/continue ledger skips branch_prepare after confirm_pipeline
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const e = o.calls[0].envelope;
        if (e.step.id !== 'dispatch_execute') return `FAIL: next ${e.step.id}`;
        if (o.ledger.history.some(h => h.step === 'branch_prepare')) return 'FAIL: branch_prepare recorded';
        if (!/--plan "/.test(e.step.data.invocation)) return `FAIL: invocation lacks the frozen --plan: ${e.step.data.invocation}`;
        if (e.step.data.skill !== 'execute-plan-sdlc' || e.step.data.model !== 'sonnet') return `FAIL: data ${JSON.stringify(e.step.data)}`;
        if ('dispatchModel' in e.step.data || 'dispatchEffort' in e.step.data) return `FAIL: unexpected dispatch keys ${JSON.stringify(e.step.data)}`;
        return true;
    # from: ship-step: (w) dispatch_execute carries one execute todo per plan task and the execute marker
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const e = o.calls[0].envelope;
        if (e.status !== 'step' || e.step.id !== 'dispatch_execute') return `FAIL: next ${e.status} ${e.step && e.step.id}`;
        const d = e.step.data;
        const taskTodos = (d.todos || []).filter(t => /^Task \d+: /.test(t.content));
        // The fixture plan.md has two "### Task N:" headings (more than the one placeholder todo).
        if (taskTodos.length !== 2) return `FAIL: plan-task todos ${JSON.stringify(d.todos)}`;
        if (!/execute: \d+ plan tasks queued/.test(d.marker)) return `FAIL: marker ${d.marker}`;
        if ('planTasks' in d) return 'FAIL: planTasks leaked into step.data';
        return true;

