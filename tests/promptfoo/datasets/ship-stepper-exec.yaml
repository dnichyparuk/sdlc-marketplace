- description: "ship-step: (w46) --after dispatch_pr whose URL gh confirms records pr completed"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario after-pr --seed frozen --result results/pr-ok.json --gh-pr-url https://example/pr/1"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const e = o.calls[0].envelope;
        if (e.status === 'error') return `FAIL: error ${e.error}`;
        if (o.ledger.stepStatuses.pr !== 'completed') return `FAIL: pr ${o.ledger.stepStatuses.pr}`;
        return true;
    # from: ship-lean: (learnings) b a tracked learnings log still emits learnings_commit after dispatch_pr, pushing with --set-upstream origin HEAD
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const e = o.calls[0].envelope;
        if (e.status !== 'step' || e.step.id !== 'learnings_commit') return `FAIL: ${e.status} ${e.step && e.step.id} ${e.error || ''}`;
        const cmd = e.step.data.commands[0];
        if (!cmd.includes('git push --set-upstream origin HEAD')) return `FAIL: push form ${cmd}`;
        if (/git push \|\|/.test(cmd)) return `FAIL: bare push ${cmd}`;
        return true;

