        if (!String(c.envelope.error).includes('not shell-safe')) return `FAIL: error ${c.envelope.error}`;
        if (c.exitCode !== 1) return `FAIL: exit ${c.exitCode}`;
        return true;

# R105: the pending-question stop prints the same line; a flag whose source is not cli (quality here) is not repeated.
- description: "ship-step: (r105) the pending-question resume line repeats the CLI-given --bump and --draft, not a seeded quality"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario pending --seed frozen-exec --quality balanced --result results/execute-pending-highrisk.json --answer gate-stop --cli-flags bump=minor,draft=true"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const d = o.calls[o.calls.length - 1].envelope;
        if (d.status !== 'done' || !d.ext || d.ext.reason !== 'pending-question') return `FAIL: ${d.status} ${d.ext && d.ext.reason}`;
        const cmds = d.ext.commands || [];
        return cmds.length === 2 && cmds[1] === '/sdlc:ship-sdlc --resume --bump minor --draft' ? true : `FAIL: commands ${JSON.stringify(cmds)}`;

- description: "ship-step-text: (R-subagent-brief) both in-ship agents carry the no-attribution-line sentence once"
