# Exec test cases for dispatch-resilience sentinel guard (Fixes #463).
# Deterministic presence check — no LLM involved.
# Uses the "execute-plan-sdlc/dispatch-resilience/" prefix for --filter-pattern addressability.

- description: "execute-plan-sdlc/dispatch-resilience: nested-dispatch sentinels present in SKILL.md (Step 5) and wave-runner-template.md (§2) (Fixes #463)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/check-dispatch-resilience-sentinel.js"
    project_root: "file://fixtures-fs/execute-overflow"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output); r.ok === true && r.inSkill === true && r.inSkillStep5 === true && r.inWaveRunner === true"

- description: "execute-plan-sdlc/handback: R86/R87/R92/R98/R99 sentinels present in skill, wave-runner, the ship step agents, ship-sdlc and the three workers"
  vars:
    script_path: "repo://tests/promptfoo/scripts/check-handback-sentinels.js"
    project_root: "file://fixtures-fs/execute-overflow"
  assert:
    - type: javascript
      value: "const r = JSON.parse(output); r.ok === true"
