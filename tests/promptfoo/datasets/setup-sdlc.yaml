# Behavioral tests for setup-sdlc selective-section menu (issue #191).
# Covers: full-flow menu, single-section selection, legacy migration row locking,
# empty selection no-op, --only flag bypassing menu, and verbose-header rendering.
#
# Fixture appropriateness:
#   setup-fully-configured  -- all rows state:'set'; user picks one section to tweak
#   setup-clean-project     -- all rows state:'not-set'; pre-checked; full flow
#   setup-legacy-migration  -- legacy rows locked; auto-selected; cannot toggle off
#
# All cases run via the LLM provider against `plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md`.

- description: "setup-sdlc: fully-configured project + user picks one section, only that section runs"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-fully-configured.md"
    user_request: >
      Run /setup-sdlc. The menu appears; I want to reconfigure only the `jira` section.
      Show me what the menu looks like, accept my selection of `jira`, then walk me through
      configuring just that section.
  assert:
    # Menu must surface every section row at least by id
    - type: icontains-all
      value:
        - "version"
        - "ship"
        - "jira"
        - "review"
    # Must render state badges
    - type: regex
      value: "(\\[set\\]|set\\b)"
    # Must show only jira's verbose header in the dispatch (not all sections)
    - type: icontains
      value: "jira"
    # Behavioral
    - type: llm-rubric
      value: >
        The response renders the numbered list menu from prepare.sections[] directly in chat
        (not AskUserQuestion). All rows show up at least by id. The user's reply of `jira`
        (or the corresponding number) is honored, and ONLY the jira section enters the
        dispatch loop in Step 3 — the response does NOT walk through version, ship, review,
        commit, or pr. Before asking any jira-specific question, the response prints a verbose
        header for jira including Purpose, Files modified, and Consumed by lines sourced from
        the manifest.

- description: "setup-sdlc: clean project + user accepts pre-checked menu, full flow runs"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-clean-project.md"
    user_request: >
      Run /setup-sdlc. Nothing is configured; the menu should pre-check every not-set row.
      Confirm the default selection and show me the first verbose header you'd render
      (for the `version` section).
  assert:
    - type: icontains
      value: "version"
    # Numbered list expectation: every row appears with a number prefix
    - type: regex
      value: "(1\\.|2\\.|not-set|not set|default|all)"
    # Verbose header for version
    - type: icontains-all
      value:
        - "Purpose"
        - "Files modified"
        - "Consumed by"
    - type: llm-rubric
      value: >
        The response renders a numbered list of prepare.sections[] rows directly in chat
        (not via AskUserQuestion). On a clean project the default token is `all`. It then
        asks a free-text question (not AskUserQuestion) for which sections to configure,
        and proceeds to render Step 3 for the first selected section (`version`). The verbose
        header for version contains four labelled lines: Purpose, Files modified, Consumed by,
        and Config file (or equivalent). The header text comes from the manifest, not freeform copy.

- description: "setup-sdlc: legacy fixture + migration row locked and cannot be toggled off"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-legacy-migration.md"
    user_request: >
      Run /setup-sdlc. The version row is `legacy` (locked: true) and so are ship and review.
      I want to UNCHECK the `version` row to skip migration. Tell me what happens.
  assert:
    - type: icontains-any
      value:
        - "locked"
        - "cannot toggle"
        - "auto-selected"
        - "migration"
    # Must NOT silently allow uncheck
    - type: llm-rubric
      value: >
        The response refuses to allow the user to uncheck the `version` row because it is
        locked (locked: true in prepare.sections). It explains that locked rows are
        auto-selected and proceed into Step 3 regardless of user input — migration must
        complete first. The response does NOT proceed with version skipped; instead it
        either re-displays the menu with a note, or confirms migration will run.

- description: "setup-sdlc: reply 'none' at numbered-list menu exits cleanly with no changes"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-fully-configured.md"
    user_request: >
      Run /setup-sdlc. The numbered list menu appears. I reply "none". Tell me what happens.
  assert:
    - type: icontains-any
      value:
        - "no changes"
        - "no sections selected"
        - "nothing to configure"
    # Must NOT walk through any section
    - type: llm-rubric
      value: >
        The response detects the "none" reply and exits cleanly with a "no changes" /
        "no sections selected" summary. It does NOT enter the Step 3 dispatch loop, does
        NOT run any AskUserQuestion for individual fields, and does NOT write any config
        files. The summary at Step 4 reflects "nothing was configured."

- description: "setup-sdlc --only jira,review: menu skipped, both sections run"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-fully-configured.md"
    user_request: >
      Run /setup-sdlc --only jira,review. Skip the menu entirely; configure only those
      two sections in dispatch order.
  assert:
    - type: icontains-all
      value:
        - "jira"
        - "review"
    # Must not enumerate sections that were not selected
    - type: llm-rubric
      value: >
        The response treats --only jira,review as bypassing the Step 1 menu and proceeds
        straight to Step 3 with only those two ids selected. It prints a verbose header
        for jira and another for review (in that order), runs the per-field prompts (or
        delegates) for each, and does NOT touch version, ship, commit, pr, or any content
        sub-flow. The final summary lists only jira and review as configured.

- description: "setup-sdlc: verbose header sourced from manifest precedes any prompt"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-clean-project.md"
    user_request: >
      Run /setup-sdlc --only jira. Before asking me anything, print the verbose header
      that the manifest drives — purpose, files modified, consuming skills, and per-option
      description block.
  assert:
    # The four verbose-header labels must appear before any AskUserQuestion
    - type: icontains-all
      value:
        - "Purpose"
        - "Files modified"
        - "Consumed by"
        - "/jira-sdlc"
    # Field description sentence (substring from manifest)
    - type: icontains-any
      value:
        - "default Jira project"
        - "ticket"
        - "PROJ"
    - type: llm-rubric
      value: >
        Before asking any AskUserQuestion, the response prints a verbose header for the
        jira section. The header contains at minimum: a Purpose line explaining what the
        jira section does at runtime, a Files modified line listing .claude/sdlc.json,
        a Consumed by line listing /jira-sdlc, /commit-sdlc, /pr-sdlc, and an Options
        block describing the defaultProject field with at least one full sentence covering
        what runtime behavior changes when set. The header copy comes from the manifest
        (scripts/lib/setup-sections.js), not freeform LLM-generated text.

# ---------------------------------------------------------------------------
# Issue #197 — pr-labels sub-flow (setup-pr-labels.md)
# ---------------------------------------------------------------------------

- description: "setup-sdlc --only pr-labels: mode=off writes { mode: 'off' } and preserves sibling pr keys"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: >
      Project at tests/promptfoo/fixtures-fs/setup-pr-labels-clean/ with an existing
      .claude/sdlc.json that already has `pr.titlePattern` and `pr.allowedTypes`. The user
      runs `/setup-sdlc --only pr-labels` and at the mode prompt picks "off". `gh label list`
      returned a non-empty list (e.g. ["bug","feature","docs"]).
    user_request: >
      Walk through setup-pr-labels.md Steps 1-6 for this project and pick "off" at the
      mode prompt. Show the exact JSON written into .claude/sdlc.json `pr` section,
      including how titlePattern and allowedTypes are preserved.
  assert:
    - type: icontains
      value: '"mode": "off"'
    - type: icontains
      value: "titlePattern"
    - type: icontains
      value: "allowedTypes"
    - type: not-icontains
      value: '"rules":'
    - type: llm-rubric
      value: >
        The response demonstrates the off-mode write path: it reads the existing pr section,
        spreads it, and only sets/replaces the labels key with `{ mode: "off" }`. The
        existing pr.titlePattern and pr.allowedTypes survive unchanged (sub-flow gotcha #1).
        No `rules` array is written. The user is shown a one-line summary like
        "Wrote pr.labels: mode=off to .claude/sdlc.json".

- description: "setup-sdlc --only pr-labels: mode=llm writes { mode: 'llm' } with no rules array"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: >
      Project at tests/promptfoo/fixtures-fs/setup-pr-labels-clean/ with no existing
      pr.labels block. `gh label list` returned ["bug","feature","docs","tests"]. The user
      runs `/setup-sdlc --only pr-labels` and at the mode prompt explicitly picks "llm".
    user_request: >
      Walk through setup-pr-labels.md and pick "llm" at the mode prompt. Show the JSON
      block written to .claude/sdlc.json `pr.labels` and explain why this is opt-in.
  assert:
    - type: icontains
      value: '"mode": "llm"'
    - type: not-icontains
      value: '"rules":'
    - type: llm-rubric
      value: >
        The response writes exactly `{ mode: "llm" }` under `pr.labels` with no `rules`
        field. The rationale call-out makes clear that picking "llm" is the user's explicit
        opt-in to the legacy fuzzy-match heuristic — addressing issue #197 by ensuring the
        LLM never picks labels silently for projects that didn't choose this mode.

- description: "setup-sdlc --only pr-labels: mode=rules with one branchPrefix rule writes valid block"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: >
      Project at tests/promptfoo/fixtures-fs/setup-pr-labels-clean/ with no existing
      pr.labels block. `gh label list` returned ["bug","feature","docs"]. The user runs
      `/setup-sdlc --only pr-labels`, picks "rules", picks the "bug" label, picks the
      "branchPrefix" signal, and enters "fix/, bugfix/" as values, then picks "done".
    user_request: >
      Walk through setup-pr-labels.md Step 4 with the inputs above. Show the final JSON
      block written to .claude/sdlc.json `pr.labels` and identify which schema keys it
      uses (mode, rules[*].label, rules[*].when.branchPrefix).
  assert:
    - type: icontains
      value: '"mode": "rules"'
    - type: icontains
      value: '"label": "bug"'
    - type: icontains
      value: "branchPrefix"
    - type: icontains
      value: "fix/"
    - type: icontains
      value: "bugfix/"
    - type: llm-rubric
      value: >
        The response builds a single rule
        `{ label: "bug", when: { branchPrefix: ["fix/", "bugfix/"] } }`,
        appends it to an empty rules array, and writes `{ mode: "rules", rules: [...] }`
        under `pr.labels` via `writeSection(root, "pr", ...)`. The branchPrefix value is
        parsed from comma-separated input, trimmed, deduped, and stored as an array. The
        chosen label "bug" comes from the gh label list (not free text). No partial write
        occurs — the writeSection call happens once after "done".

# ---------------------------------------------------------------------------
# Issue #205 — pr-labels section-menu summary
# ---------------------------------------------------------------------------

- description: "setup-sdlc Step 1 menu: pr.labels mode=off renders [set] and 'off — no automatic labels'"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: >
      Project at tests/promptfoo/fixtures-fs/setup-pr-labels-menu-off/ with an existing
      .claude/sdlc.json containing `pr.labels: { mode: "off" }`. The user runs
      `/setup-sdlc` (no flags) and reaches the Step 1 selective-section menu.
    user_request: >
      Render the Step 1 selective-section menu for this project. Show how the pr-labels
      row is presented, including its state marker and the per-section summary string
      produced by summarizePrLabels.
  assert:
    - type: icontains
      value: "pr-labels"
    - type: icontains
      value: "[set]"
    - type: icontains
      value: "off — no automatic labels"
    - type: not-icontains
      value: "not configured"
    - type: llm-rubric
      value: >
        The pr-labels row in the Step 1 menu shows the configured state: marker `[set]`
        (not `[not set]`) and the summary `off — no automatic labels`. The summarizer
        receives the `pr.labels` leaf object directly (currentCfgFor walks the
        configPath dot-path), reads `cfg.mode === "off"`, and returns the off-mode
        message. The legacy bug behavior — reading `cfg.labels.mode` from the parent
        `pr` slice and returning `not configured` — must NOT appear (issue #205).

- description: "setup-sdlc Step 1 menu: pr.labels mode=rules with 1 rule renders [set] and 'rules: 1 rule'"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: >
      Project at tests/promptfoo/fixtures-fs/setup-pr-labels-menu-rules/ with an existing
      .claude/sdlc.json containing
      `pr.labels: { mode: "rules", rules: [{ label: "bug", when: { branchPrefix: ["fix/"] } }] }`.
      The user runs `/setup-sdlc` (no flags) and reaches the Step 1 selective-section menu.
    user_request: >
      Render the Step 1 selective-section menu for this project. Show how the pr-labels
      row is presented, including its state marker and the per-section summary string
      produced by summarizePrLabels.
  assert:
    - type: icontains
      value: "pr-labels"
    - type: icontains
      value: "[set]"
    - type: icontains
      value: "rules: 1 rule"
    - type: not-icontains
      value: "not configured"
    - type: llm-rubric
      value: >
        The pr-labels row shows marker `[set]` and summary `rules: 1 rule` (singular,
        because the rules array has length 1). The summarizer reads `cfg.rules.length`
        from the leaf, not `cfg.labels.rules.length` from the parent. The pluralization
        is correct (`rule` not `rules`).

- description: "setup-sdlc Step 1 menu: no pr.labels key renders [not set] without 'not configured' string"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: >
      Project at tests/promptfoo/fixtures-fs/setup-pr-labels-menu-unset/ with an existing
      .claude/sdlc.json that has a `pr` block (titlePattern, allowedTypes) but NO
      `pr.labels` key at all. The user runs `/setup-sdlc` (no flags) and reaches the
      Step 1 selective-section menu.
    user_request: >
      Render the Step 1 selective-section menu for this project. Show how the pr-labels
      row is presented, including its state marker and any per-section summary string.
  assert:
    - type: icontains
      value: "pr-labels"
    - type: icontains
      value: "[not set]"
    - type: not-icontains
      value: "not configured"
    - type: llm-rubric
      value: >
        The pr-labels row shows marker `[not set]` because `pr.labels` is undefined.
        The per-section summary is empty (the helper returns `''` for missing config,
        matching sibling summarizers). The literal string `not configured` does NOT
        appear — the legacy regression must not be reintroduced (issue #205).

# ---------------------------------------------------------------------------
# Issue #231: setup-sdlc detects legacy .claude/sdlc.json and triggers migration
# ---------------------------------------------------------------------------

- description: "setup-sdlc: legacy .claude/sdlc.json triggers migration suggestion"
  vars:
    skill_content: "file://fixtures/project-needs-migration.md"
  assert:
    - type: llm-rubric
      value: >
        When a legacy `.claude/sdlc.json` is detected, the skill mentions that
        a migration is needed and that running `/setup-sdlc --migrate` will
        relocate the file to `.sdlc/config.json` and stamp the current `schemaVersion`.
        The skill MUST NOT silently overwrite either file.

# ---------------------------------------------------------------------------
# Issue #292 — when-gate: skip:true entries are excluded from prompting
# ---------------------------------------------------------------------------

- description: "setup-sdlc (issue #292): skip:true fields from prepare are not prompted — verify-pipeline deselected"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-clean-project.md"
    user_request: >
      Run /setup-sdlc. I am configuring the ship section. The prepare script has returned
      shipFields where verifyPipelineTimeout, verifyPipelineInterval, and
      verifyPipelineMaxIterations each have skip: true (because verify-pipeline is not in my
      selected steps[]). The remaining 10 shipFields have skip: false. Walk me through the
      ship field loop and show me which questions you ask.
  assert:
    - type: not-icontains-any
      value:
        - "verifyPipelineTimeout"
        - "verifyPipelineInterval"
        - "verifyPipelineMaxIterations"
    - type: llm-rubric
      value: >
        The skill is configuring the ship section. The three verifyPipeline* fields
        (verifyPipelineTimeout, verifyPipelineInterval, verifyPipelineMaxIterations) have
        skip: true in the prepare output. The skill MUST NOT ask the user any question about
        those three fields. The skill MUST ask about all remaining fields whose skip is false.
        This demonstrates that the skip gate from the prepare script is honored per R15 and P7.

- description: "setup-sdlc (issue #292): skip:false fields ARE prompted when their step is selected"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-clean-project.md"
    user_request: >
      Run /setup-sdlc. I am configuring the ship section. The prepare script has returned
      shipFields where ALL entries have skip: false because both verify-pipeline and
      await-remote-review are in my selected steps[]. Walk me through the ship field loop
      and confirm you ask about verifyPipelineTimeout and awaitRemoteReviewers.
  assert:
    - type: icontains-any
      value:
        - "verifyPipelineTimeout"
        - "verify-pipeline poll timeout"
    - type: icontains-any
      value:
        - "awaitRemoteReviewers"
        - "await-remote-review"
        - "Reviewer logins"
    - type: llm-rubric
      value: >
        The skill is configuring the ship section. All shipFields have skip: false.
        The skill MUST ask the user about verifyPipelineTimeout (or its label) and
        awaitRemoteReviewers (or its label). This demonstrates that when skip is false,
        gated fields surface correctly in the prompt loop per R15 and P7.

- description: "setup-sdlc (#9361): --skip ids from prepare flags.skip are removed from the selection"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-clean-project.md"
    user_request: >
      Run /setup-sdlc --only jira,review,commit --skip jira. The prepare script has returned
      flags.skip = ["jira"] and no section is locked. List the section ids you will configure,
      in order, before asking any field question.
  assert:
    - type: llm-rubric
      value: >
        The skill resolves selectedIds from --only (jira, review, commit), then removes the ids
        in prepare.flags.skip, so it configures review and commit only. It MUST NOT ask any
        jira question. It does not parse --skip from the arguments itself (A2, P-skip).

# ---------------------------------------------------------------------------
# Issues #337 + #338 — numbered-list menu redesign + preRelease compat check
# ---------------------------------------------------------------------------

- description: "setup-sdlc (#337): menu-numbered-list-rendered — Step 1 prints numbered list, no AskUserQuestion tool call"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-fully-configured.md"
    user_request: >
      Run /setup-sdlc. Show me exactly what Step 1 looks like — how sections are presented.
  assert:
    - type: regex
      value: "1\\."
    - type: regex
      value: "\\[set\\]|\\[not.set\\]|\\[not-set\\]"
    - type: llm-rubric
      value: >
        Step 1 renders a numbered list of prepare.sections[] rows in chat — one line per row,
        with a 1-indexed number prefix, a [state] badge, the section label, and the first
        sentence of section.purpose. The skill does NOT invoke AskUserQuestion for section
        selection — it emits the list as plain chat text and asks a free-text question for
        the user's reply. The list includes at least version, ship, jira, review, commit, pr.

- description: "setup-sdlc (#337): menu-reply-none-exits — reply 'none' exits with no-changes summary"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-fully-configured.md"
    user_request: >
      Run /setup-sdlc. The menu appears. I reply "none". Show what happens.
  assert:
    - type: icontains-any
      value:
        - "no changes"
        - "no sections selected"
        - "nothing to configure"
    - type: llm-rubric
      value: >
        The user replied "none" to the numbered-list prompt. The skill prints a "no changes"
        message and exits without entering Step 3 or writing any config files. No AskUserQuestion
        for individual fields fires. The R-menu-4 contract is satisfied: a none/cancel reply
        exits cleanly.

- description: "setup-sdlc (#337): menu-reply-numbers-subset — comma-separated numbers select only those sections"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-fully-configured.md"
    user_request: >
      Run /setup-sdlc. The numbered list appears. I reply "1,3" (sections 1 and 3). Show which
      sections enter Step 3.
  assert:
    - type: llm-rubric
      value: >
        The skill parses the reply "1,3" and resolves sections 1 and 3 by their 1-indexed
        position in prepare.sections[]. Only those two sections (plus any locked rows) enter
        Step 3. The skill does NOT configure any other sections.

- description: "setup-sdlc (#337): menu-reply-range — range 2-4 selects sections 2, 3, 4"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-fully-configured.md"
    user_request: >
      Run /setup-sdlc. The menu appears. I reply "2-4". Which sections enter Step 3?
  assert:
    - type: llm-rubric
      value: >
        The skill parses the range "2-4" and resolves sections 2, 3, and 4 by 1-indexed
        position (inclusive range). Only sections 2, 3, 4 (plus any locked rows) enter Step 3.
        No other sections are configured.

- description: "setup-sdlc (#337): menu-reply-mixed — mixed input '1-2,5' selects union of range and number"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-fully-configured.md"
    user_request: >
      Run /setup-sdlc. The numbered list appears. I reply "1-2,5". Which sections enter Step 3?
  assert:
    - type: llm-rubric
      value: >
        The skill parses the mixed input "1-2,5" as the union of range 1-2 and number 5,
        resolving to sections 1, 2, and 5 by 1-indexed position. Only those sections (plus
        any locked rows) enter Step 3.

- description: "setup-sdlc (#337): menu-reply-all — reply 'all' configures every section"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-fully-configured.md"
    user_request: >
      Run /setup-sdlc. I reply "all". Describe which sections will be configured.
  assert:
    - type: llm-rubric
      value: >
        The skill parses the reply "all" and selects every section id from prepare.sections[].
        All sections enter Step 3 for configuration.

- description: "setup-sdlc (#337): menu-reply-not-set — reply 'not-set' selects only unset sections"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-clean-project.md"
    user_request: >
      Run /setup-sdlc. I reply "not-set". Which sections enter Step 3?
  assert:
    - type: llm-rubric
      value: >
        The skill parses the reply "not-set" and resolves to only the sections where
        section.state === 'not-set'. On a clean project, all sections qualify. Locked rows
        are always included regardless of reply.

- description: "setup-sdlc (#337): menu-reply-empty-uses-default — empty reply resolves to defaultToken"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-fully-configured.md"
    user_request: >
      Run /setup-sdlc. The menu shows defaultToken 'all'. I reply with nothing (empty message).
      What does the skill configure?
  assert:
    - type: llm-rubric
      value: >
        The skill interprets an empty reply as using the defaultToken from
        prepare.menuInputContract.defaultToken. When defaultToken is 'all', an empty reply
        selects every section. The skill does NOT re-prompt for input; it proceeds with the
        default resolution.

- description: "setup-sdlc (#337): menu-reply-invalid-reprompts — out-of-range number re-prompts with error"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/setup-sdlc/SKILL.md"
    project_context: "file://fixtures/setup-fully-configured.md"
    user_request: >
      Run /setup-sdlc. I reply "99" (a number out of range). What happens next?
  assert:
    - type: icontains-any
      value:
