      Does the compat check fire again?
  assert:
    - type: llm-rubric
      value: >
        The version section has confirmDetected: true. When the user picks 'yes' at the
        confirmDetected meta-prompt, the skill builds the section from prepare.detected.*
        values only (mode, versionFile, fileType, tagPrefix). The yes path does NOT include
        preRelease (per the SKILL.md note). Therefore no preRelease is collected and the
        compat check is skipped entirely — it only fires when preRelease is non-empty after
        field collection. The idempotency contract is satisfied: a second invocation via the
        yes path never triggers the compat prompt.
