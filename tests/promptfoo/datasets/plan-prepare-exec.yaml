# --- contentRoot routing: linked-worktree OpenSpec detection (#457) ---
# Fixture: main worktree has NO openspec; linked worktree worktrees/wt1 (feat/my-feature)
# carries an active openspec change "my-feature". Running plan.js from the linked-worktree
# cwd must detect the linked tree's change, not main's empty state. Proves the scan routes
# through contentRoot (active worktree), not projectRoot (main worktree).
- description: "plan-prepare (#457): linked-worktree — detects active worktree's openspec change, not main's"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/plan.js"
    script_args: "--output-file"
    script_cwd: "{{project_root}}/worktrees/wt1"
    project_root: "file://fixtures-fs/worktree-linked-openspec-plan"
  assert:
    - type: icontains
      value: '"present": true'
    - type: icontains
      value: '"branchMatch": "my-feature"'
    - type: not-icontains
      value: '"present": false'

# tasks.md ref-injection write must land in the LINKED worktree, not main. tasksUpdated == 1
# is only reachable when validateChange + the tasks.md path both resolve through contentRoot
# (= worktrees/wt1); if routing fell back to main, the change dir would not exist and
# tasksUpdated would stay 0.
# --- G20/G21 in content-coverage lane gateIds (Task 5, #470) ---

- description: "plan-prepare T4c: content-coverage lane gateIds includes G20 and G21; no other lane claims them"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/plan.js"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/plan-prepare-github-remote"
  assert:
    - type: javascript
      value: |
        const data = JSON.parse(output);
        if (!data.lanes || !Array.isArray(data.lanes)) return 'lanes field missing or not array';
        const contentLane = data.lanes.find(l => l.name === 'content-coverage');
        if (!contentLane) return 'content-coverage lane not found';
        if (!contentLane.gateIds.includes('G20')) return 'G20 missing from content-coverage gateIds';
        if (!contentLane.gateIds.includes('G21')) return 'G21 missing from content-coverage gateIds';
        // Assert no other lane claims G20 or G21
        for (const lane of data.lanes) {
          if (lane.name === 'content-coverage') continue;
          if (lane.gateIds.includes('G20')) return `G20 also claimed by lane: ${lane.name}`;
          if (lane.gateIds.includes('G21')) return `G21 also claimed by lane: ${lane.name}`;
        }
        return true;

- description: "plan-prepare T4d: critiqueDir is an absolute sdlc-plan-critique- temp directory (P22)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/plan.js"
    script_cwd: "{{project_root}}"
