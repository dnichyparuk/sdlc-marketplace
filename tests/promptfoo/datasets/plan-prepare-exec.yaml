# --- merge-lanes (W7.3 change 3) ---

- description: "plan-merge: PF4 failures become blocking G3 and G12 issues"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/plan.js"
    project_root: "file://fixtures-fs/plan-merge-lanes"
    script_args: "merge-lanes --dir {{project_root}} --lanes static-structural"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        const has = (g, t) => r.issues.some(i => i.gateId === g && i.taskRef === t && i.lane === 'validate-plan-format' && i.blocking === true);
        return has('G12', 'Task 3') && has('G3', 'Task 1') && r.passes.includes('G4') && r.passes.includes('G10')

- description: "plan-merge: missing content-coverage file gives lane-failure and 12 missing gates"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/plan.js"
    project_root: "file://fixtures-fs/plan-merge-lanes"
    script_args: "merge-lanes --dir {{project_root}} --lanes static-structural,content-coverage --no-guardrails"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        const failure = r.issues.some(i => i.gateId === 'lane-failure' && i.lane === 'content-coverage' && i.message.startsWith('Lane content-coverage failed: no result file'));
        const want = ['G5', 'G6', 'G8', 'G9', 'G11', 'G13', 'G15', 'G16', 'G18', 'G19', 'G20', 'G21'].sort();
        return failure && JSON.stringify(r.coverage.missing.slice().sort()) === JSON.stringify(want)

- description: "plan-merge: missing dimension-coverage file is advisory"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/plan.js"
    project_root: "file://fixtures-fs/plan-merge-lanes"
    script_args: "merge-lanes --dir {{project_root}}/no-g17 --lanes static-structural,dimension-coverage --no-guardrails"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
