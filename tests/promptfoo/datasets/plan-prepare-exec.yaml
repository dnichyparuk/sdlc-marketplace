- description: "plan-prepare: invalid --quality exits 1 with an errors entry"
  vars:
    script_path: "-e"
    script_args: '((cp,fs,js)=>((r)=>console.log(JSON.stringify({exitCode:r.status,out:JSON.parse(fs.readFileSync(r.stdout.trim(),"utf8"))})))(cp.spawnSync("node",[js,"--quality","bogus"],{encoding:"utf8"})))(require("child_process"),require("fs"),"{{repo_root}}/plugins/sdlc-utilities/scripts/skill/plan.js")'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/plan-prepare-github-remote"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        if (o.exitCode !== 1) return `exitCode: ${o.exitCode}`;
        if (JSON.stringify(o.out.errors) !== JSON.stringify(['Invalid --quality value "bogus"; expected one of speed|balanced|quality (deprecated: full|minimal).'])) return `errors: ${JSON.stringify(o.out.errors)}`;
        if (Object.keys(o.out).sort().join(',') !== 'errors,flags') return `keys: ${Object.keys(o.out).sort().join(',')}`;
        return true;

