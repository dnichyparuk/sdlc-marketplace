        if (l.model !== 'haiku') return `lanes[0].model: ${l.model}`;
        if (l.effort !== 'low') return `lanes[0].effort: ${l.effort}`;
        if (typeof l.agentPath !== 'string' || !l.agentPath.endsWith('/agents/plan-lane-static.md')) return `lanes[0].agentPath: ${l.agentPath}`;
        if (data.intakeAuditDispatch.model !== 'sonnet') return `intakeAuditDispatch.model: ${data.intakeAuditDispatch.model}`;
        if (data.intakeAuditDispatch.effort !== 'medium') return `intakeAuditDispatch.effort: ${data.intakeAuditDispatch.effort}`;
