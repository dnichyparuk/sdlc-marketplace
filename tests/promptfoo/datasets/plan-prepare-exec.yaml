# --- P16/P17 signals: lanes[] and lensReviewers[] (R35, R36 — Fixes #418) ---

- description: "plan-prepare T4a: lanes[] has exactly 4 entries with disjoint gateIds covering G1-G21 minus the validator gates (R35)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/plan.js"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/plan-prepare-github-remote"
  assert:
    - type: icontains
      value: '"lanes"'
    - type: javascript
      value: |
        const data = JSON.parse(output);
        if (!data.lanes || !Array.isArray(data.lanes)) return 'lanes field missing or not array';
        if (data.lanes.length !== 4) return `expected 4 lanes, got ${data.lanes.length}`;
        const names = data.lanes.map(l => l.name).join(',');
        if (names !== 'static-structural,content-coverage,guardrail-compliance,dimension-coverage') return `unexpected lane names: ${names}`;
        // Check all required fields present on each entry (including null agentPath entries)
        const expectedAgents = { 'static-structural': 'sdlc:plan-lane-static', 'content-coverage': 'sdlc:plan-lane-content', 'guardrail-compliance': 'sdlc:plan-lane-guardrail', 'dimension-coverage': 'sdlc:plan-lane-g17' };
        for (const lane of data.lanes) {
          if (!lane.name) return `lane missing name: ${JSON.stringify(lane)}`;
          if (lane.agent !== expectedAgents[lane.name]) return `lane agent mismatch: ${lane.name} -> ${lane.agent}`;
          if (!lane.model) return `lane missing model: ${lane.name}`;
          if (!('agentPath' in lane) || !('effort' in lane)) return `lane missing agentPath or effort key: ${lane.name}`;
          if (!Array.isArray(lane.inputNames)) return `lane inputNames not an array: ${lane.name}`;
          if (typeof lane.presetInputs !== 'object') return `lane presetInputs not an object: ${lane.name}`;
          if (('subagentType' in lane) || ('promptTemplatePath' in lane)) return `lane carries a legacy key: ${lane.name}`;
          if (!lane.gateIds || !Array.isArray(lane.gateIds) || lane.gateIds.length === 0) return `lane missing gateIds: ${lane.name}`;
        }
        // Check disjoint gateIds
        const allGateIds = data.lanes.flatMap(l => l.gateIds);
        const uniqueGateIds = new Set(allGateIds);
        if (allGateIds.length !== uniqueGateIds.size) return `duplicate gateIds across lanes: ${allGateIds}`;
        // Check G1-G21 coverage minus the validator gates G3, G4, G10, G12
        const expectedGates = new Set(['G1','G2','G5','G6','G7','G8','G9','G11','G13','G14','G15','G16','G17','G18','G19','G20','G21']);
        for (const g of expectedGates) {
          if (!uniqueGateIds.has(g)) return `missing gate in lanes[].gateIds: ${g}`;
        }
        if (uniqueGateIds.size !== expectedGates.size) return `unexpected extra gates: ${[...uniqueGateIds].filter(g => !expectedGates.has(g))}`;
        return true;

- description: "plan-prepare T4b: lensReviewers[] has exactly 3 entries with non-empty focusCategories (R36, Fixes #418)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/plan.js"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/plan-prepare-github-remote"
  assert:
    - type: icontains
      value: '"lensReviewers"'
    - type: javascript
      value: |
        const data = JSON.parse(output);
        if (!data.lensReviewers || !Array.isArray(data.lensReviewers)) return 'lensReviewers field missing or not array';
        if (data.lensReviewers.length !== 3) return `expected 3 lensReviewers, got ${data.lensReviewers.length}`;
        const expectedLenses = ['architecture', 'requirements', 'risk'];
        for (let i = 0; i < data.lensReviewers.length; i++) {
          const lr = data.lensReviewers[i];
          if (lr.lens !== expectedLenses[i]) return `expected lens ${expectedLenses[i]} at index ${i}, got ${lr.lens}`;
          if (lr.agent !== 'sdlc:plan-lens-' + lr.lens) return `lensReviewer[${i}] agent mismatch: ${lr.agent}`;
          if (!lr.model) return `lensReviewer[${i}] missing model`;
          if (!('agentPath' in lr)) return `lensReviewer[${i}] missing agentPath key`;
          if (!lr.presetInputs || lr.presetInputs.LENS !== lr.lens) return `lensReviewer[${i}] presetInputs.LENS mismatch`;
          if (('subagentType' in lr) || ('promptTemplatePath' in lr)) return `lensReviewer[${i}] carries a legacy key`;
          if (!lr.focusCategories || !Array.isArray(lr.focusCategories) || lr.focusCategories.length === 0) return `lensReviewer[${i}] missing or empty focusCategories`;
        }
        return true;

- description: "plan-prepare: lane model is read from agent frontmatter"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/plan.js"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/plan-prepare-github-remote"
  assert:
    - type: javascript
      value: |
        const data = JSON.parse(output);
        const l = data.lanes[0];
        if (l.agent !== 'sdlc:plan-lane-static') return `lanes[0].agent: ${l.agent}`;
        if (l.model !== 'haiku') return `lanes[0].model: ${l.model}`;
        if (l.effort !== 'low') return `lanes[0].effort: ${l.effort}`;
        if (typeof l.agentPath !== 'string' || !l.agentPath.endsWith('/agents/plan-lane-static.md')) return `lanes[0].agentPath: ${l.agentPath}`;
        if (data.intakeAuditDispatch.model !== 'sonnet') return `intakeAuditDispatch.model: ${data.intakeAuditDispatch.model}`;
        if (data.intakeAuditDispatch.effort !== 'medium') return `intakeAuditDispatch.effort: ${data.intakeAuditDispatch.effort}`;
        return true;

- description: "plan-prepare: (critique-dispatch) entry in the agent-dispatch shape (P26, R75)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/plan.js"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/plan-prepare-github-remote"
  assert:
    - type: javascript
      value: |
        const data = JSON.parse(output);
        const c = data.critiqueDispatch;
        if (!c) return 'critiqueDispatch missing';
        if (c.agent !== 'sdlc:plan-critique-orchestrator') return `agent: ${c.agent}`;
        if (typeof c.agentPath !== 'string' || !c.agentPath.endsWith('/agents/plan-critique-orchestrator.md')) return `agentPath: ${c.agentPath}`;
        if (c.model !== 'sonnet') return `model: ${c.model}`;
        if (c.effort !== 'medium') return `effort: ${c.effort}`;
        const want = ['ROUND', 'ITER', 'CRITIQUE_DIR', 'PLAN_FILE_PATH', 'PREPARE_OUTPUT', 'DISPATCH', 'CARRY', 'BEFORE_PLAN', 'G17_NOT_RUN', 'AUTHOR_MODEL', 'REQUIREMENTS_SUMMARY', 'SOURCE_REQUIREMENTS', 'BRIEF_FILE', 'BRIEF_FINDING_IDS', 'PLAN_TEMPLATE_PATH'];
        if (JSON.stringify(c.inputNames) !== JSON.stringify(want)) return `inputNames: ${JSON.stringify(c.inputNames)}`;
        if (JSON.stringify(c.presetInputs) !== '{}') return `presetInputs: ${JSON.stringify(c.presetInputs)}`;
        return true;

- description: "plan-prepare: --quality defaults to balanced with null dispatch overrides (P24)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/plan.js"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/plan-prepare-github-remote"
  assert:
    - type: javascript
      value: |
        const data = JSON.parse(output);
        if (JSON.stringify(data.flags) !== JSON.stringify({ quality: 'balanced', lightweight: false, sources: { quality: 'default', lightweight: 'default' } })) return `flags: ${JSON.stringify(data.flags)}`;
        for (const e of [...data.lensReviewers, data.reviewerDispatch]) {
          if (e.dispatchModel !== null || e.dispatchEffort !== null) return `${e.agent}: dispatchModel ${e.dispatchModel}, dispatchEffort ${e.dispatchEffort}`;
        }
        if (data.reviewerDispatch.agent !== 'sdlc:plan-reviewer') return `reviewerDispatch.agent: ${data.reviewerDispatch.agent}`;
        if (data.reviewerDispatch.lens !== 'all') return `reviewerDispatch.lens: ${data.reviewerDispatch.lens}`;
        return true;

- description: "plan-prepare: --quality minimal sets lens dispatchModel opus and dispatchEffort high"
