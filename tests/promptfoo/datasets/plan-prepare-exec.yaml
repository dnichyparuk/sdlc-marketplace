# Script execution tests for plan-prepare.js (plan.js).
# These tests run plan.js directly against fixture directories (no LLM).
# Covers: OpenSpec authoritative output (issue #164).
#
# Fixture appropriateness (W7.3 subcommand cases; the fixtures are JSON and markdown only, no git repo):
#   fixtures-fs/plan-merge-lanes     - validator report, static-structural, g17-prepare, dimension-coverage, lens and
#                                      inventory JSON for the `plan-merge:` cases; `no-g17/` repeats the static and
#                                      validator files without the G17 files (the content-coverage file is left out on purpose)
#   fixtures-fs/plan-diff-material   - one before plan and two after plans (wording-only, scope change) for the `plan-diff:` cases
#   fixtures-fs/plan-g17-prepare     - a plan, one review dimension, its Copilot instruction file and a learnings log
#                                      for the `plan-g17:` cases

- description: "plan-prepare: openspec present emits authoritative field with path and specsCount"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/plan.js"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-openspec-baseline"
  assert:
    - type: icontains
      value: '"authoritative"'
    - type: icontains
      value: '"path": "openspec/config.yaml"'
    - type: icontains
      value: '"specsCount": 2'

- description: "plan-prepare: no openspec omits authoritative field"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/plan.js"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-commit-config"
  assert:
    - type: icontains
      value: '"present": false'
    - type: not-icontains
      value: '"authoritative"'

