- description: "plan-prepare T4f: commit carries the project commit config (P23)"
  vars:
    script_path: "-e"
    script_args: '((cp,fs,os,js)=>((d)=>(cp.spawnSync("git",["init","-q"],{cwd:d}),fs.mkdirSync(d+"/.sdlc"),fs.writeFileSync(d+"/.sdlc/config.json",JSON.stringify({commit:{subjectPattern:"^fix:\x20.+$",allowedTypes:["fix"]}})),((r)=>((o)=>(fs.rmSync(d,{recursive:true,force:true}),console.log(JSON.stringify(o))))(JSON.parse(fs.readFileSync(r.stdout.trim(),"utf8"))))(cp.spawnSync("node",[js,"--output-file"],{cwd:d,encoding:"utf8"}))))(fs.mkdtempSync(os.tmpdir()+"/plan-commit-")))(require("child_process"),require("fs"),require("os"),"{{repo_root}}/plugins/sdlc-utilities/scripts/skill/plan.js")'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/plan-prepare-github-remote"
  assert:
    - type: javascript
      value: |
        const data = JSON.parse(output);
        const c = data.commit;
        if (!c) return 'commit missing';
        if (c.subjectPattern !== '^fix: .+$') return `subjectPattern: ${c.subjectPattern}`;
        if (JSON.stringify(c.allowedTypes) !== '["fix"]') return `allowedTypes: ${JSON.stringify(c.allowedTypes)}`;
        if (c.subjectPatternError !== null) return `subjectPatternError: ${c.subjectPatternError}`;
        return true;

