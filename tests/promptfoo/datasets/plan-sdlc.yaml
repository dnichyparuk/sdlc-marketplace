      Run /plan-sdlc. openspec/config.yaml exists but no --spec flag was passed. The request is a
      functional change. At the Step 0 gate check the user selected Option 2 ("Generate OpenSpec
      artifacts as plan appendix"). Walk through how Option 2 is handled in Step 0, then show how
      Step 4 populates the ## OpenSpec Appendix section for this plan.
  assert:
    - type: icontains
      value: "openspecInlineGenerate"
    - type: icontains
      value: "openspec-target"
    - type: not-icontains
      value: "- change:"
    - type: llm-rubric
