# --- Gate-check Option 2 inline generation, material-change re-dispatch, Step 1 ambiguity (C1/C2/C3) ---

- description: "plan-sdlc: gate-check Option 2 authors OpenSpec appendix with openspec-target annotations, skips Gate A and openspec-task blocks (R63, C1)"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/plan-sdlc/SKILL.md"
