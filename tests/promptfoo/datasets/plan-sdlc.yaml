#   plan-sdlc-c1-inline-openspec       -- CORRECT: gate-check Option 2 inline OpenSpec artifact generation; exercises R63 openspec-target annotations, Gate A/openspec-task suppression (Fixes #523)
#   plan-sdlc-c2-material-change       -- CORRECT: Step 6 task-count delta sets materialChangeDetected; exercises R64 merged Step 3 lane + Step 5 lens re-dispatch (Fixes #523)
