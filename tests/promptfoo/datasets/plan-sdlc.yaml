      value: "Notes"
    - type: llm-rubric
      value: >
        The response shows the per-task template with a Notes field (not a Description
        field). Notes is described as OPTIONAL and rationale-only (≤5 lines) — the
        executable "what" lives in Files, Contract, and Acceptance criteria, not in Notes.
        The response does NOT present a mandatory Description field that carries the full
        implementation detail.

- description: "plan-sdlc: plan carries a top-of-plan Deviations & assumptions section (R47, #472)"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/plan-sdlc/SKILL.md"
    project_context: "file://fixtures/plan-deviations-notes.md"
    user_request: >
      Run /plan-sdlc. The plan dispatches notifications via a background queue although the
