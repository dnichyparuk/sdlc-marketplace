        on every plan, not optional.

# --- plan-format-reference.md convention tests (Task 3, Fixes #472) ---

- description: "plan-format-reference: render cap is one example per distinct contract shape — distinct events each get their own record (R49, catalog #2/#3, #472)"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/plan-sdlc/plan-format-reference.md"
    project_context: "file://fixtures/plan-per-event-contracts.md"
    user_request: >
      Read the plan-format-reference conventions, then review Task 1 in the plan context above.
      Task 1 emits three DISTINCT events (order.created, order.refunded, order.cancelled), each with
      a different payload shape. State the render cap rule and how many records Task 1 must render
      for these three distinct events, citing the catalog #2/#3 convention.
  assert:
    - type: icontains
      value: "distinct contract shape"
    - type: llm-rubric
      value: >
        The response states the render cap as ONE elided (…) example per DISTINCT contract shape
        (not per surface category, not an exhaustive dump). It explains that because the three
        events (order.created, order.refunded, order.cancelled) are DISTINCT shapes, each renders
        its own record — three records, one per distinct event — per the catalog #2/#3 rule that
        every distinct event/endpoint/operation renders its own record. The response does NOT claim
        a single shared example suffices for all three distinct shapes.

- description: "plan-format-reference: bare file:line forbidden as a CHANGE ref; Contract.mirror line-anchor remains a valid precedent pointer (R51 anchoring, #472)"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/plan-sdlc/plan-format-reference.md"
    project_context: "file://fixtures/plan-bare-ref.md"
    user_request: >
      Read the plan-format-reference "Code reference anchoring" convention, then review Task 1 in
      the plan context above. Task 1 references the change site as a bare pointer
      `src/pricing/discount.ts:42` and carries a `Contract.mirror` line-anchor
      `src/pricing/tax.ts:1-30`. Which of these two references violates the convention and which is
      allowed, and how should the violating one be re-rendered?
  assert:
    - type: icontains
      value: "Contract.mirror"
    - type: llm-rubric
      value: >
        The response identifies the bare `src/pricing/discount.ts:42` pointer as a FORBIDDEN change
        reference and says it must be re-anchored self-contained — embedding the surrounding lines
        (or full function body) plus an inline -/+ diff so the change is reviewable from the plan
        alone. The response identifies the `Contract.mirror` line-anchor `src/pricing/tax.ts:1-30`
        as ALLOWED (the carve-out): it is a precedent pointer to existing structure being copied,
        not a change reference. The response does NOT claim all line-anchors are forbidden and does
        NOT flag the mirror anchor as a violation.

- description: "plan-format-reference: Deviations & assumptions is required with Item|asked|does|why columns (R47, #472)"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/plan-sdlc/plan-format-reference.md"
    user_request: >
      Per the plan-format-reference, is a `## Deviations & assumptions` section required on every
      plan? Where is it placed and what are its table columns? Show the exact heading and column row.
  assert:
    - type: icontains
      value: "## Deviations & assumptions"
    - type: llm-rubric
      value: >
        The response states that `## Deviations & assumptions` is REQUIRED on every plan, placed at
        the top of the plan (immediately after the document header, before Key Decisions). It gives
        the table columns exactly as Item | asked | does | why. The response does NOT describe the
        section as optional and does NOT use a different column set.

