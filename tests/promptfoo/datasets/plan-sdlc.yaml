        blocks are an ALLOWED render form for flow / call-order / state surfaces. The
        response does NOT claim diagrams are forbidden / plain-text only, and does NOT use
        or permit MDX. The surface is rendered, not narrated in prose.

- description: "plan-sdlc: render cap is one elided example per distinct contract shape, not per surface (R49, #472)"
  vars:
