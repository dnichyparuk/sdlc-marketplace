    - type: llm-rubric
      value: >
        The response explains that G18 judges the mixed-artifact Task 3 against its DOMINANT
        artifact's column — the .ts source file (errors.ts) is the primary deliverable, so it
        is judged against the CODE column (not the docs column for the .md prompt). The
        response finds Task 3 SATISFIED / NOT flagged because its Contract pins concrete code
        shape (the two exported message constants with values). The derivation of plan type
        from Files: paths and the dominant-column tie-break are applied, not assumed.

# --- G19 render-don't-narrate gate (R46, G19 — Fixes #470) ---

- description: "plan-sdlc: Step 2 renders HTTP payload for an API task (R46, G19, #470)"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/plan-sdlc/SKILL.md"
    user_request: >
      Run /plan-sdlc Step 2. Author a task block for an endpoint that adds a
      PUT /orgs/{id} route accepting {name, status} and returning 204 / 400.
  assert:
    - type: icontains
      value: "```"
    - type: llm-rubric
      value: >
        The task output RENDERS an HTTP payload (request + response shapes) as a fenced
        block, not prose describing them. The rendered block shows at minimum a request
        body and at least one response shape (success or error).

- description: "plan-sdlc: Step 2 renders nothing for a docs-typo task (R46, G19, #470)"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/plan-sdlc/SKILL.md"
    user_request: >
      Run /plan-sdlc Step 2. Author a task block for fixing a typo in README.md.
  assert:
    - type: llm-rubric
      value: >
        The task body does not contain a rendered payload, field-diff table, or
        state-transition table. The task is trivial (docs-typo) and renders no concrete
        artifact per R46. It is acceptable for the task to have a short description and
        acceptance criteria only.

- description: "plan-sdlc: G19 PASSES Task 1 that renders all three required artifact conventions (R46, G19, #470)"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/plan-sdlc/SKILL.md"
    project_context: "file://fixtures/plan-render-artifacts.md"
    user_request: >
      Run /plan-sdlc. Evaluate the Step 3 G19 render-don't-narrate gate for Task 1
      ("PUT /orgs/{id} — update name and status") in the plan. Task 1 renders a
      success+error payload pair, a +/-/null field-diff table with elision, and a
      state-transition table. Is Task 1 flagged by G19?
  assert:
    - type: icontains
      value: "G19"
    - type: llm-rubric
      value: >
        The response evaluates the G19 render-don't-narrate gate and finds Task 1
        SATISFIED / NOT flagged: its Rendered artifacts section contains a fenced JSON
        block with success and error responses (artifact #1, AIP-193), a markdown table
        showing +/-/null field changes with … elision (artifact #2, RFC 7386/6902), and
        a from→event→to state-transition table (artifact #5, Nygard). G19 does not block
        on Task 1.

- description: "plan-sdlc: G19 FLAGS Task 2 (renderable surface narrated only) as error-severity, blocking (R46, G19, #472)"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/plan-sdlc/SKILL.md"
    project_context: "file://fixtures/plan-render-artifacts.md"
    user_request: >
      Run /plan-sdlc. Evaluate the Step 3 G19 render-don't-narrate gate for Task 2
      ("POST /orgs — create organisation") in the plan. Task 2 touches an HTTP endpoint
      surface but only describes the payload in prose, renders no fenced block or table.
      Is Task 2 flagged by G19? Does G19 block the plan?
  assert:
    - type: icontains
      value: "G19"
    - type: llm-rubric
      value: >
        The response evaluates the G19 gate and FLAGS Task 2: it touches a
        renderable HTTP-endpoint surface but narrates the payload/shape in prose instead of
        rendering a concrete artifact. The response confirms G19 is error-severity and
        blocking — the plan is BLOCKED until Task 2 renders the surface and cannot be
        finalized while the prose-only description stands.

- description: "plan-sdlc: G19 does NOT flag Task 3 (docs-typo, no renderable surface) — anti-bloat (R46, G19, #470)"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/plan-sdlc/SKILL.md"
    project_context: "file://fixtures/plan-render-artifacts.md"
    user_request: >
      Run /plan-sdlc. Evaluate the Step 3 G19 render-don't-narrate gate for Task 3
      ("Fix typo in README.md") in the plan. Task 3 touches only README.md with a
      trivial typo fix. Does G19 demand a rendered artifact for Task 3?
  assert:
    - type: icontains
      value: "G19"
    - type: llm-rubric
      value: >
        The response evaluates the G19 gate and finds NO finding for Task 3: it is a
        trivial docs-typo task with no renderable surface (no HTTP endpoint, no data
        structure, no state machine). G19 does not demand a rendered artifact for trivial
        tasks. The response must NOT flag Task 3 — flagging a typo fix is a false positive
        that G19 explicitly avoids per the anti-bloat rule.

- description: "plan-sdlc: G19 per-surface prose-flood — an incidental unrelated render does NOT excuse a prose-narrated surface in the same task (R46, G19, #488)"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/plan-sdlc/SKILL.md"
    project_context: "file://fixtures/plan-g19-prose-flood.md"
    user_request: >
      Run /plan-sdlc. Evaluate the Step 3 G19 render-don't-narrate gate for Task 1
      ("PATCH /jobs/{id}/priority — update priority + add MAX_PRIORITY_QUEUE_DEPTH env
      var") in the plan. Task 1 touches two render-trigger surfaces: the endpoint's
      request/response payload (described only in the Description prose — no fenced
      block, no table for it) and the MAX_PRIORITY_QUEUE_DEPTH config delta (rendered as
      a typed-op table under Rendered artifacts). Is Task 1 flagged by G19? Does the
      rendered config-delta table excuse the un-rendered payload surface?
  assert:
    - type: icontains
      value: "G19"
    - type: llm-rubric
      value: >
        The response evaluates the G19 gate PER-SURFACE and FLAGS Task 1 specifically for
        the HTTP request/response PAYLOAD surface (catalog #1): that surface's shape
        (the priority field, the success response fields, the 422 error body) is narrated
        entirely in prose in the Description field with no fenced block, table, or
        before→after diff rendering it. The response explicitly rejects the idea that the
        task's rendered MAX_PRIORITY_QUEUE_DEPTH config-delta table (catalog #7) excuses
        or satisfies G19 for the payload surface — it states that a render for one surface
        (the config delta) does NOT excuse prose for another surface (the payload) in the
        same task. The response confirms G19 is error-severity and blocking, and does NOT
        conclude that Task 1 passes G19 merely because the task contains some rendered
        artifact.

# --- Render-don't-narrate hardening: Mermaid, per-distinct-shape, blocking, Notes, Deviations (R47–R52, Fixes #472) ---

- description: "plan-sdlc: render block allows Mermaid for flow/call-order/state surfaces, no MDX (R50, #472)"
  vars:
