- description: "plan-sdlc: G19 is error-severity and blocks plan approval for a narrated render surface (R46/R49, G19, #472)"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/plan-sdlc/SKILL.md"
    user_request: >
      Run /plan-sdlc. List the Step 3 quality gate for render-don't-narrate. State G19's
      severity and whether it blocks plan approval when an artifact-touching task narrates
      a render-trigger surface (e.g. an HTTP payload, status enum, or state machine) in
      prose instead of rendering it.
  assert:
    - type: icontains
      value: "G19"
    - type: llm-rubric
      value: >
        The response describes G19 (Render-don't-narrate) as ERROR-severity and BLOCKING:
        when an artifact-touching task narrates a render-trigger surface in prose instead of
        rendering a fenced block, table, or before→after diff, the plan is blocked until the
        surface is rendered. The response does NOT describe G19 as advisory, warning-severity,
        or non-blocking. It must not say G19 "does not block".

- description: "plan-sdlc: G20 flags a Notes block that restates the task's Contract/acceptance (R48, G20, #472)"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/plan-sdlc/SKILL.md"
    project_context: "file://fixtures/plan-deviations-notes.md"
    user_request: >
