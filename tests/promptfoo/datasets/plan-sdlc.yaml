      the Step 6 material change detector, then describe exactly how the NEXT Step 5 iteration
      dispatches its agents.
  assert:
    - type: icontains
      value: "materialChangeDetected"
    - type: icontains
      value: "single message"
    - type: llm-rubric
      value: >
        The response identifies that the task-count-delta trigger fires (4 -> 5) so
        `materialChangeDetected` is set to true. It then describes the next Step 5 iteration as
        dispatching ALL FIVE Step 3 `lanes[]` entries AND ALL THREE `lensReviewers[]` entries
        together in a SINGLE message as parallel Agent tool calls (not two separate dispatches,
        not sequential). It states the await barrier requires all 8 results (5 lanes + 3 lenses)
        before consolidating. It states this merged dispatch counts as exactly ONE iteration of
        the review loop (the counter increments by 1, not 2), and that `materialChangeDetected`
        is cleared back to false once the merged issue set is assembled.

- description: "plan-sdlc: conflicting codebase caching patterns trigger AskUserQuestion at Step 1 structured discovery, trigger c (interactive, C3)"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/plan-sdlc/SKILL.md"
    project_context: "file://fixtures/plan-sdlc-c3-ambiguity.md"
    user_request: >
      Run /plan-sdlc (no --auto flag). Step 1 decomposition for the catalog caching task found two
      existing, equally viable caching patterns in the codebase — see context for both patterns and
      their call sites. Walk through the Step 1 "Structured discovery" trigger (c) and show what
      happens next.
  assert:
    - type: icontains
      value: "AskUserQuestion"
    - type: llm-rubric
      value: >
        The response identifies this as the Step 1 "Structured discovery" trigger (c) ambiguity — the
        codebase sends conflicting signals (two existing, equally viable caching patterns with no
        dominant convention for this kind of lookup) — and fires AskUserQuestion presenting the
        trade-offs of the in-memory LRU pattern vs. the Redis-backed pattern before proceeding to
        task decomposition. The response does not silently pick one pattern without asking, and
        does not proceed to decomposition before the user responds.

- description: "plan-sdlc: --auto suppresses the Step 1 structured discovery AskUserQuestion; decision recorded in Key Decisions with a Deviations asked=no row (C3)"
  vars:
    skill_path: "plugins/sdlc-utilities/skills/plan-sdlc/SKILL.md"
    project_context: "file://fixtures/plan-sdlc-c3-ambiguity.md"
    user_request: >
      Run /plan-sdlc --auto. Step 1 decomposition for the catalog caching task found the same two
      existing, equally viable caching patterns described in the context. Walk through the Step 1
      "Structured discovery" trigger (c) under --auto and show what happens next.
  assert:
    - type: icontains
      value: "Key Decisions"
    - type: llm-rubric
      value: >
        The response explains that `--auto` suppresses the Step 1 "Structured discovery"
        AskUserQuestion entirely — no question is presented to the user. Instead, per R65,
        plan-sdlc autonomously picks the most conservative approach (the in-memory LRU cache —
        no new infrastructure, no network hop), using the existing codebase pattern as a
        tiebreaker between equally-conservative choices (the LRU cache is also the dominant
        pattern, used by 3 of the 4 existing call sites). The response records the choice with
        rationale in `## Key Decisions`. The response also states that a `## Deviations &
        assumptions` row is added with `asked=no`, per the asked-column semantics for
        autonomous/`--auto`-suppressed decisions. The response does not describe any
        AskUserQuestion call being made.
