        The response describes Option 2 setting `openspecInlineGenerate = true` in Step 0 with no
        further prompting at that gate (R22 single-touchpoint) and `openspecContext` staying empty
        for the rest of the run. It describes Step 4 authoring fresh OpenSpec artifacts under an
        "OpenSpec Artifacts (Draft)" label, with each of the three fragments (Proposal Summary,
        Delta Specs, Tasks List) wrapped in its own `<!-- openspec-target: <path> -->` annotation
