      and Task 2 ("Notification queue worker") in the plan. Task 1's Notes carries only
      rationale; Task 2's Notes restates the function signature and the acceptance bullets.
      Which task does G20 flag, and is G20 blocking?
  assert:
    - type: icontains
      value: "G20"
    - type: llm-rubric
      value: >
        The response evaluates G20 (Notes rationale-only). It does NOT flag Task 1 (its
        Notes block carries only rationale — why a queue was chosen). It FLAGS Task 2,
        whose Notes block restates the Contract/acceptance (re-lists the drainQueue
        signature and the acceptance bullets) instead of carrying rationale. The response
        states G20 is error-severity and blocking — the plan is blocked until Task 2's
        Notes is reduced to rationale only.

- description: "plan-sdlc: per-task template uses optional rationale-only Notes field, not Description (R48, #472)"
  vars:
