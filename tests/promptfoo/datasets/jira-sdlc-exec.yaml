# ── mcp-failure.js telemetry test (R27) ────────────────────────────────────

- description: "mcp-failure: telemetry appends 5-line block with cloudId redaction (R27)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/lib/mcp-failure.js"
    # script_args uses whitespace-split only — no shell quoting; use single-token values
    script_args: "--telemetry --class auth --tool mcp__atlassian__createJiraIssue --site acme_atlassian_net --project PROJ --error cloudId=12345678-abcd-1234-5678-abcdef012345 --recovered no"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-commit-no-config"
  assert:
    - type: icontains
      value: "mcp-failure[auth]"
    - type: icontains
      value: "tool: mcp__atlassian__createJiraIssue"
    - type: icontains
      value: "recovered: no"
    - type: not-icontains
      value: "12345678-abcd"

# ── mcp-failure.js analyze test (R28) ──────────────────────────────────────

- description: "mcp-failure: analyze outputs stable JSON shape (R28)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/lib/mcp-failure.js"
    script_args: "--analyze --class auth --tool mcp__atlassian__createJiraIssue --site acme_atlassian_net --project PROJ --error 401-unauthorized --recovered no --r-path R23"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-commit-no-config"
  assert:
    - type: javascript
      value: |
        try {
          const o = JSON.parse(output.trim());
          return typeof o.shouldDispatch === 'boolean' &&
                 ('duplicate' in o) &&
                 typeof o.proposal === 'object' &&
                 typeof o.proposal.title === 'string' &&
                 typeof o.proposal.body === 'string' &&
                 (o.action === 'create' || o.action === 'comment');
        } catch (e) { return false; }

# ── mcp-failure.js record-occurrence test (KD7) ────────────────────────────

- description: "mcp-failure: record-occurrence returns 1 on first call"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/lib/mcp-failure.js"
    script_args: "--record-occurrence --class hook-block --key test-key-wave4"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-commit-no-config"
  assert:
    - type: javascript
      value: |
        const n = parseInt(output.trim(), 10);
        return n >= 1;

