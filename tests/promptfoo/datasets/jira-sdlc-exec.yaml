# Link verification gate (issue #198) — jira.js --validate-body
# Reads description / comment body from --file (or stdin) and validates URLs
# via lib/links.js. jiraSite is resolved deterministically from the cached
# ~/.sdlc-cache/jira/<site>/<KEY>.json or from --site fallback.

- description: "jira.js --validate-body: clean atlassian URL with cache-resolved site passes"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/jira.js"
    script_args: "--validate-body --project PROJ --file {{project_root}}/body-clean.txt --json"
    script_cwd: "{{project_root}}"
    script_home: "{{project_root}}"
    project_root: "file://fixtures-fs/jira-validate-body"
    script_env: '{"SDLC_LINKS_OFFLINE":"1"}'
  assert:
    - type: contains
      value: '"ok":true'

- description: "jira.js --validate-body: wrong-host atlassian URL aborts with atlassian-site-mismatch"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/jira.js"
    script_args: "--validate-body --project PROJ --file {{project_root}}/body-atlassian-mismatch.txt --json"
    script_cwd: "{{project_root}}"
    script_home: "{{project_root}}"
    project_root: "file://fixtures-fs/jira-validate-body"
    script_env: '{"SDLC_LINKS_OFFLINE":"1"}'
  assert:
    - type: contains
      value: '"ok":false'
    - type: contains
      value: 'atlassian-site-mismatch'
    - type: contains
      value: '"observed":"wrong-tenant.atlassian.net"'
    - type: contains
      value: '"expected":"acme.atlassian.net"'

- description: "jira.js --validate-body: wrong-owner github URL embedded in jira description aborts"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/jira.js"
    script_args: "--validate-body --project PROJ --file {{project_root}}/body-github-mismatch.txt --json"
    script_cwd: "{{project_root}}"
    script_home: "{{project_root}}"
    project_root: "file://fixtures-fs/jira-validate-body"
    script_env: '{"SDLC_LINKS_OFFLINE":"1"}'
  assert:
    - type: contains
      value: '"ok":false'
    - type: contains
      value: 'github-context-mismatch'
    - type: contains
      value: '"observed":"rafalnagr/sdlc-marketplace"'

- description: "jira.js --validate-body: generic 404 URL aborts with url-not-found"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/jira.js"
    script_args: "--validate-body --project PROJ --file {{project_root}}/body-generic-404.txt --json"
    script_cwd: "{{project_root}}"
    script_home: "{{project_root}}"
    project_root: "file://fixtures-fs/jira-validate-body"
  assert:
    - type: contains
      value: '"ok":false'
    - type: contains
      value: 'url-not-found'

# ---------- Template fallback (issue #241) ----------

- description: "jira-prepare: --templates surfaces fallbacks (Sub-bug -> Bug, Subtask -> Task) and noneTypes (Whim)"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/jira.js"
    script_cwd: "{{project_root}}"
    script_home: "{{project_root}}"
    project_root: "file://fixtures-fs/jira-template-fallback"
    script_args: "--project FALL --templates --templates-dir {{repo_root}}/plugins/sdlc-utilities/skills/jira-sdlc/templates"
  assert:
    - type: icontains
      value: '"fallbackTo": "Bug"'
    - type: icontains
      value: '"type": "Sub-bug"'
    - type: icontains
      value: '"fallbackTo": "Task"'
    - type: icontains
      value: '"type": "Subtask"'
    - type: icontains
      value: '"Whim"'
    - type: icontains
      value: '"Sub-task": "default"'
    - type: icontains
      value: '"Test Case": "default"'
    - type: icontains
      value: '"Test Plan": "default"'

- description: "jira-prepare: --check surfaces templates.fallbacks for unmapped subtask variants"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/jira.js"
    script_cwd: "{{project_root}}"
    script_home: "{{project_root}}"
    project_root: "file://fixtures-fs/jira-template-fallback"
    script_args: "--project FALL --check --templates-dir {{repo_root}}/plugins/sdlc-utilities/skills/jira-sdlc/templates"
  assert:
    - type: icontains
      value: '"fallbacks":'
    - type: icontains
      value: '"Sub-bug"'
    - type: icontains
      value: '"uncoveredTypes":'
    - type: icontains
      value: '"Whim"'

- description: "stdin-fd0: jira --save reads the cache JSON from stdin"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/jira.js"
    script_cwd: "{{project_root}}"
    script_home: "{{project_root}}"
    project_root: "file://fixtures-fs/jira-save-roundtrip"
    script_args: "--project STDIN --save"
    script_stdin: '{"version":1,"cloudId":"c1","project":{"key":"STDIN"},"siteUrl":"https://mycompany.atlassian.net"}'
  assert:
    - type: icontains
      value: '"saved": true'
    - type: not-icontains
      value: "Failed to read stdin"
