# Script execution tests for skill/jira.js.
# Runs the prepare script directly against fixture filesystems (no LLM).
# Covers:
#   (a) fresh install      — cache not initialized, flags echoed
#   (b) legacy .sdlc migration — .sdlc/jira-cache/<KEY>.json → ~/.sdlc-cache/jira/<site>/
#   (c) legacy .claude migration — .claude/jira-cache/<KEY>.json → ~/.sdlc-cache/jira/<site>/
#   (d) multi-candidate    — two home-cache entries for same key under different sites
#   (e) --skip-workflow-discovery echoed in flags
#   (f) --project validation against jira.projects (membership rejected + accepted)
#
# mcp-failure.js helper-unit tests (R26/R27/R28 — implements #422)
#   (g) classify — 7 classifier branches (one per class)
#   (h) telemetry — structured 5-line block written to log; redaction asserted
#   (i) analyze — JSON shape + action field
#   (j) record-occurrence — cross-process counter persistence

# ── mcp-failure.js classifier tests (R26) ──────────────────────────────────

- description: "mcp-failure: classify transport — http-status 503"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/lib/mcp-failure.js"
    script_args: "--classify --http-status 503"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-commit-no-config"
  assert:
    - type: icontains
      value: "transport"

- description: "mcp-failure: classify auth — http-status 401"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/lib/mcp-failure.js"
    script_args: "--classify --http-status 401"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-commit-no-config"
  assert:
    - type: icontains
      value: "auth"

- description: "mcp-failure: classify schema — http-status 400 no workflow keywords"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/lib/mcp-failure.js"
