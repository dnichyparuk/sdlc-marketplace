    script_args: "--manifest {{project_root}}/manifest.json --findings {{project_root}}/findings-missing --output-dir {{project_root}}/out --summary-path {{project_root}}/summary.json"
  assert:
    - type: contains
      value: "Dimensions failed: 1"

- description: "review-consolidate: comment carries attribution, dedupe and OWASP"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/review-consolidate.js"
    project_root: "file://fixtures-fs/review-consolidate"
    script_args: "--manifest {{project_root}}/manifest.json --findings {{project_root}}/findings-mixed --output-dir {{project_root}}/out --summary-path {{project_root}}/summary.json"
  assert:
    - type: javascript
      value: |
        const m = output.match(/Comment file:\s+(\S+)/);
        if (!m) return false;
        const c = process.getBuiltinModule('fs').readFileSync(m[1], 'utf8');
        return /^> Automated review by `review-sdlc` v0\.20\.7 · \d{4}-\d{2}-\d{2}$/m.test(c)
          && (c.match(/^### Verdict:/gm) || []).length === 1
          && c.includes('Also flagged by:')
          && c.includes('· OWASP A01')
          && c.includes('_2 additional finding(s) omitted by the reviewer._');

- description: "review-consolidate: summary JSON matches block and schema fields"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/review-consolidate.js"
    project_root: "file://fixtures-fs/review-consolidate"
    script_args: "--manifest {{project_root}}/manifest.json --findings {{project_root}}/findings-mixed --output-dir {{project_root}}/out --summary-path {{project_root}}/summary.json"
  assert:
    - type: javascript
      value: |
        const m = output.match(/Comment file:\s+(\S+)/);
        if (!m) return false;
        const s = JSON.parse(process.getBuiltinModule('fs').readFileSync(context.vars.project_root + '/summary.json', 'utf8'));
        const keys = Object.keys(s.counts).sort().join(',');
        const dispatched = s.dimensions.filter(d => d.status !== 'SKIPPED');
        return s.commentPath === m[1]
          && keys === 'critical,high,info,low,medium'
          && dispatched.length === 2
          && dispatched.every(d => typeof d.model === 'string' && d.model);

- description: "review-consolidate: block relays post decision lines"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/review-consolidate.js"
    project_root: "file://fixtures-fs/review-consolidate"
    script_args: "--manifest {{project_root}}/manifest.json --findings {{project_root}}/findings-1high --output-dir {{project_root}}/out --summary-path {{project_root}}/summary.json"
  assert:
    - type: contains
      value: "Post decision:   save"
    - type: contains
      value: "Auto:            true"
    - type: contains
      value: "Save path:"

- description: "review-consolidate: comment copy beside the summary"
  vars:
    script_path: "-e"
    script_args: '((fs,os,path,cp,d,r,s,c)=>{d=fs.mkdtempSync(path.join(os.tmpdir(),"rc-copy-"));try{r=cp.spawnSync("node",["{{repo_root}}/plugins/sdlc-utilities/scripts/skill/review-consolidate.js","--manifest","{{project_root}}/manifest.json","--findings","{{project_root}}/findings-1high","--output-dir",d+"/out","--summary-path",d+"/summary.json"],{encoding:"utf8"});s=JSON.parse(fs.readFileSync(d+"/summary.json","utf8"));c=fs.readFileSync(d+"/summary.comment.md","utf8");console.log(JSON.stringify({exit:r.status,copy:s.commentCopyPath===d+"/summary.comment.md",same:c===fs.readFileSync(d+"/out/review-comment.md","utf8")}))}finally{fs.rmSync(d,{recursive:true,force:true})}})(require("fs"),require("os"),require("path"),require("child_process"))'
    project_root: "file://fixtures-fs/review-consolidate"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        return o.exit === 0 && o.copy === true && o.same === true;

- description: "review-consolidate: --render-plan prints the review plan"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/review-consolidate.js"
    project_root: "file://fixtures-fs/review-consolidate"
    script_args: "--render-plan --manifest {{project_root}}/manifest.json"
  assert:
    - type: contains
      value: "Review Plan"
    - type: contains
      value: "All changes (committed + staged)"
    - type: contains
      value: "Changed files:"
    - type: contains
      value: "2 active, 1 skipped"
    - type: regex
      value: "\\| docs-review\\s+\\| 0\\s+\\| low\\s+\\| SKIPPED"

- description: "review-consolidate: same input gives byte-identical output"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-review-consolidate-twice.js"
    project_root: "file://fixtures-fs/review-consolidate"
    script_args: "--manifest {{project_root}}/manifest.json --findings {{project_root}}/findings-mixed"
  assert:
    - type: equals
      value: "true"
