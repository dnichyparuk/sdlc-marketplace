# Script execution tests for review-consolidate.js (review-sdlc R-consolidate, P11) — verdict
# rules, failed dimensions, input errors, comment content, summary JSON, plan rendering and
# determinism. Each case copies its own fixture and writes summary.json inside the copy, so
# cases never share a path under exec concurrency. No LLM.

- description: "review-consolidate: 1 critical gives CHANGES REQUESTED"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/review-consolidate.js"
    project_root: "file://fixtures-fs/review-consolidate"
    script_args: "--manifest {{project_root}}/manifest.json --findings {{project_root}}/findings-1critical --output-dir {{project_root}}/out --summary-path {{project_root}}/summary.json"
  assert:
    - type: contains
      value: "Verdict:         CHANGES REQUESTED"

