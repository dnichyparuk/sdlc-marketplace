# ---------------------------------------------------------------------------
# Project scan (R10, R14, P-scan; W6a.9): --scan emits `scan` from lib/project-scan.js.
# ---------------------------------------------------------------------------

- description: "setup-prepare: --scan emits scan.signals for a project with package.json"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/setup.js"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-mongodb-express"
    script_args: "--scan"
  assert:
    - type: javascript
      value: |
        const s = JSON.parse(output).scan;
        if (!s || !s.signals) return 'FAIL: scan.signals missing';
        const checks = {
          typescript: s.signals.languages.includes('typescript'),
          express: s.signals.frameworks.includes('express'),
          hasDatabase: s.signals.hasDatabase === true,
          mongodb: s.signals.dbType === 'mongodb',
          structure52: Object.keys(s.signals.structure).length === 52,
          packageJson: !!(s.files['package.json'] && s.files['package.json'].content),
          hosting: typeof s.hosting.github === 'boolean',
          ciFiles: Array.isArray(s.ciFiles),
          recentPrs: Array.isArray(s.recentPrs) && s.recentPrs.length === 0,
        };
        const failed = Object.keys(checks).filter(k => !checks[k]);
        return failed.length === 0 ? true : 'FAIL: ' + failed.join(', ');

- description: "setup-prepare (#9362): project-scan symlink and device files are not read (R26)"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-project-scan-symlink.js"
    script_args: ""
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-setup-empty"
  assert:
    - type: javascript
      value: |
        const r = JSON.parse(output);
        const checks = {
          noHang: r.timedOut === false && r.exit === 0,
          noRules: Array.isArray(r.claudeMdRules) && r.claudeMdRules.length === 0,
          noExpress: !r.frameworks.includes('express'),
          control: r.frameworks.includes('flask'),
          noJenkins: !r.ciFiles.includes('Jenkinsfile'),
          noFiles: !r.files.includes('CLAUDE.md') && !r.files.includes('package.json'),
        };
        const failed = Object.keys(checks).filter(k => !checks[k]);
        return failed.length === 0 ? true : 'FAIL: ' + failed.join(', ');

