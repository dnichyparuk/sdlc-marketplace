    script_path: "repo://plugins/sdlc-utilities/scripts/skill/execute.js"
    script_args: "--plan plan.md --project-root {{project_root}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-execute-prepare"
  assert:
    - type: javascript
      value: "const o = JSON.parse(output); o.waves.length===2 && o.waves[0].taskIds.join()==='1,4' && o.waves[1].taskIds.join()==='2,3' && o.waves[0].cap===4 && o.classificationFloor.find(f=>f.id===1).fileCount===2 && o.openspec.specsDir===null"

- description: "execute-prepare: (b) wave expectedFiles is the union of Create, Modify and Test paths"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/execute.js"
    script_args: "--plan plan.md --project-root {{project_root}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-execute-prepare"
  assert:
    - type: javascript
      value: "const o = JSON.parse(output); o.waves[0].expectedFiles.join()==='src/a.js,tests/a.test.js,src/d.js' && o.waves[0].verificationHint==='tests' && o.waves[1].expectedFiles.join()==='src/a.js,src/c.js' && o.waves[1].verificationHint===null && o.workspace.decision==='branch'"

- description: "execute-prepare: (q) a 6-task plan splits a wave over the weighted cap and spreads High-risk tasks"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/execute.js"
    script_args: "--plan plan-waves.md --project-root {{project_root}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-execute-prepare-branch-type"
  assert:
    - type: javascript
      value: "const o = JSON.parse(output); o.waves.map(w=>w.taskIds.join()).join(';')==='1,2;3,4;5;6' && o.waves.every(w=>w.cap===4)"

- description: "execute-prepare: (n) a task without Complexity reports planParseError PF3"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/execute.js"
