      value: "const o = JSON.parse(output); o.errors.some(e=>e.id==='invalidFlag' && e.flag==='--wave-timeout')"

# ---------------------------------------------------------------------------
# Config-version check
# ---------------------------------------------------------------------------

- description: "execute-prepare: (k1) a standalone run performs the config-version check"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/execute.js"
    script_args: "--plan plan.md --project-root {{project_root}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-execute-prepare"
    script_env:
      SDLC_SKIP_CONFIG_CHECK: "0"
  assert:
    - type: javascript
      value: "const o = JSON.parse(output); o.flags.skipConfigCheck===false && o.migration!==null && 'project' in o.migration && 'local' in o.migration"

- description: "execute-prepare: (k2) --skip-config-check skips the config-version check"
