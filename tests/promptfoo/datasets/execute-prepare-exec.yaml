      value: "const o = JSON.parse(output); o.migration.project.migrated===false && o.migration.local.migrated===false && o.errors.length===0"

- description: "execute-prepare: (k3) SDLC_SKIP_CONFIG_CHECK=1 skips the config-version check"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/execute.js"
    script_args: "--plan plan.md --project-root {{project_root}}"
