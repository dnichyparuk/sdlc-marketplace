      value: "const o = JSON.parse(output); o.flags.skipConfigCheck===true && o.migration===null"

- description: "execute-prepare: (k4) an already-current config is not migrated again"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/execute.js"
    script_args: "--plan {{repo_root}}/tests/promptfoo/fixtures-fs/project-execute-prepare/plan.md --project-root {{project_root}}"
    script_cwd: "{{project_root}}"
