- description: "execute-prepare: (p1) wave-start --manifest-json emits the manifest with fact-sheet paths, stateScript and runId"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/state/execute.js"
    script_args: 'wave-start --wave 2 --tasks-json [{"id":"2","title":"Beta"}] --manifest-json {"n":2,"taskIds":[2],"expectedFiles":["src/a.js"],"verificationHint":"tests","qualityTier":"minimal","totalWaves":2,"waveTimeout":1800,"waveInterval":60,"guardrails":[],"tasks":[{"id":"2","complexity":"Standard","risk":"Low","assignedModel":"opus","verifyToken":"x"}]}'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-execute-prepare-resume-planpath"
  assert:
    - type: javascript
      value: "const o=JSON.parse(output), m=o.manifest; m.waveNumber===2 && m.escalationBudget===2 && m.runId===o.runId && m.stateScript.endsWith('state/execute.js') && m.tasks[0].factSheetPath.endsWith('task-2.md') && m.tasks[0].effort===null && m.expectedFiles.join()==='src/a.js'"

