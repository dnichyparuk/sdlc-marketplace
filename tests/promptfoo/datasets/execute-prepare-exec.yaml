  assert:
    - type: javascript
      value: "const o = JSON.parse(output); o.flags.commitWaves===true && o.flags.sources.commitWaves==='legacy-ship' && o.flags.waveTimeout===1800 && o.flags.sources.waveTimeout==='default'"

- description: "execute-prepare: (j4) an out-of-range --wave-timeout reports invalidFlag"
  vars:
