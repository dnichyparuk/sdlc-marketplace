      value: "const o = JSON.parse(output); o.flags.skipConfigCheck===true && o.migration===null"

# ---------------------------------------------------------------------------
# Classification floor and waves
# ---------------------------------------------------------------------------

- description: "execute-prepare: (a) a 4-task plan builds 2 waves and splits the two tasks that share a file"
