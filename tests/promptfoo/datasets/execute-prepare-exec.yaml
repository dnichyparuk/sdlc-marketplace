# ---------------------------------------------------------------------------
# Flag provenance: CLI → execute config → legacy ship → default
# ---------------------------------------------------------------------------

- description: "execute-prepare: (j1) execute config keys resolve with source config and legacy ship keys with source legacy-ship"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/execute.js"
    script_args: "--plan {{repo_root}}/tests/promptfoo/fixtures-fs/project-execute-prepare/plan.md --project-root {{project_root}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-execute-prepare-config"
  assert:
    - type: javascript
      value: "const o = JSON.parse(output); const f = o.flags, s = f.sources; f.waveTimeout===900 && s.waveTimeout==='config' && f.waveInterval===30 && s.waveInterval==='legacy-ship' && f.commitWaves===true && s.commitWaves==='config' && f.rebase==='auto' && s.rebase==='config' && f.waveRunnerMinPlanTasks===5 && s.waveRunnerMinPlanTasks==='config' && f.specReviewer==='per-wave' && s.specReviewer==='config' && o.guardrails[0].id==='g1'"

- description: "execute-prepare: (j2) CLI flags override config with source cli"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/execute.js"
    script_args: "--plan {{repo_root}}/tests/promptfoo/fixtures-fs/project-execute-prepare/plan.md --wave-timeout 120 --wave-interval 15 --rebase skip --project-root {{project_root}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-execute-prepare-config"
  assert:
    - type: javascript
      value: "const o = JSON.parse(output); const f = o.flags, s = f.sources; f.waveTimeout===120 && f.waveInterval===15 && f.rebase==='skip' && s.waveTimeout==='cli' && s.waveInterval==='cli' && s.rebase==='cli'"

- description: "execute-prepare: (j3) legacy ship.execute.commitWaves is read with source legacy-ship"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/execute.js"
    script_args: "--plan {{repo_root}}/tests/promptfoo/fixtures-fs/project-execute-prepare/plan.md --project-root {{project_root}}"
