# Exec test cases for the execute-plan-sdlc prepare script (skill/execute.js).
# Tests run the real script against fixture directories — no LLM involved.
# All descriptions start with "execute-prepare" so
# `--filter-pattern "execute-prepare"` matches.
#
# Covered: flag resolution and provenance (CLI → execute config → legacy ship
#   → default), quality resolution (A6), resume lookup and the R41 resume
#   exemption, plan-file errors, the config-version check, the classification
#   floor and wave build, workspace derivation and the OpenSpec mapping.

# ---------------------------------------------------------------------------
# Resume, plan argument and quality
# ---------------------------------------------------------------------------

- description: "execute-prepare: (c) a state file for the current branch reports resume.found with its completed waves"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/execute.js"
    script_args: "--plan plan.md --project-root {{project_root}}"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-execute-prepare-resume-planpath"
  assert:
    - type: javascript
      value: "const o = JSON.parse(output); o.resume.found && o.resume.completedWaves.join()==='1' && o.resume.planPath==='plan.md' && o.errors.length===0"

- description: "execute-prepare: (d) no plan argument exits 1 with missingPlanFile"
