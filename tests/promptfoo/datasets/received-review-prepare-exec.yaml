    script_args: '((cp,js)=>((run)=>((a,b)=>console.log(JSON.stringify({a:{status:a.status,stdout:a.stdout,stderr:a.stderr},b:{status:b.status,stdout:b.stdout,stderr:b.stderr}})))(run(["--min-severity","severe"]),run(["--plan","missing-plan.md"])))((x)=>cp.spawnSync("node",[js,"--output-file","--project-root",process.cwd(),"--comment-file","review-comment.md",...x],{cwd:process.cwd(),encoding:"utf8"})))(require("child_process"),"{{repo_root}}/plugins/sdlc-utilities/scripts/skill/received-review.js")'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-received-review-scope"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        if (o.a.status !== 1 || o.a.stdout !== '' || !o.a.stderr.includes('--min-severity must be one of')) return `FAIL: min-severity ${JSON.stringify(o.a)}`;
        if (o.b.status !== 1 || o.b.stdout !== '' || !o.b.stderr.includes('is not a readable file.') || !o.b.stderr.includes('--plan')) return `FAIL: plan ${JSON.stringify(o.b)}`;
