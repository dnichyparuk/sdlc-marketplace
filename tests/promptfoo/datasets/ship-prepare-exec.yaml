  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const e = o.calls[0].envelope;
        if (e.status !== 'step' || e.step.id !== 'dispatch_execute') return `FAIL: next ${e.status} ${e.step && e.step.id}`;
        const d = e.step.data;
        const taskTodos = (d.todos || []).filter(t => /^Task \d+: /.test(t.content));
        // The fixture plan.md has two "### Task N:" headings (more than the one placeholder todo).
        if (taskTodos.length !== 2) return `FAIL: plan-task todos ${JSON.stringify(d.todos)}`;
