# A15-A17 / R79: ship forwards --no-tag, --no-push and --release-subject to the version step only,
# in that order before --expected-branch; the subject is checked in prepare (spaces are \x20, $ is \x24).
- description: "ship-fwd: (a) release flags reach the version args in order"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "-e"
    script_args: '((cp,fs,js)=>((r)=>console.log(JSON.stringify({status:r.status,out:JSON.parse(fs.readFileSync(r.stdout.trim().split("\n").pop(),"utf8"))})))(cp.spawnSync("node",[js,"--steps","version","--no-tag","--no-push","--release-subject","chore(#1):\x20release\x20-\x20v1.2.3"],{cwd:process.cwd(),encoding:"utf8"})))(require("child_process"),require("fs"),"{{repo_root}}/plugins/sdlc-utilities/scripts/skill/ship.js")'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-sdlc-gitignore-inner"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const errs = (o.out.errors || []).filter(e => e && e.id === 'releaseSubjectInvalid');
        if (errs.length > 0) return `FAIL: valid subject rejected: ${JSON.stringify(errs)}`;
        const v = o.out.steps.find(s => s.name === 'version');
        const want = '--bump patch --auto --no-tag --no-push --subject "chore(#1): release - v1.2.3"';
        if (!v || !v.args.startsWith(want)) return `FAIL: version args ${v && v.args}`;
        const rest = v.args.slice(want.length);
        if (rest !== '' && !rest.startsWith(' --expected-branch ')) return `FAIL: tail ${rest}`;
        const leak = o.out.steps.filter(s => s.name !== 'version' && typeof s.args === 'string' && /--no-tag|--no-push/.test(s.args));
        if (leak.length > 0) return `FAIL: leaked into ${leak.map(s => s.name).join()}`;
        // P12: the flags block carries the three values with cli sources.
        const f = o.out.flags;
        const ok = f.noTag === true && f.noPush === true && f.releaseSubject === 'chore(#1): release - v1.2.3'
          && f.sources.noTag === 'cli' && f.sources.noPush === 'cli' && f.sources.releaseSubject === 'cli';
        return ok ? true : `FAIL: flags ${JSON.stringify({ noTag: f.noTag, noPush: f.noPush, releaseSubject: f.releaseSubject, sources: f.sources })}`;

