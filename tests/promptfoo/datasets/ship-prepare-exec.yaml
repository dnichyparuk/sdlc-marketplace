# ---------------------------------------------------------------------------
# ship.js step emitter (P-STEP-1..4, P-TRANS-1). Driven through
# tests/promptfoo/scripts/run-ship-stepper.js, which chains the initial call and
# `--after <id> --result-file <p> --state <ledger>` calls against the
# project-ship-stepper fixture and prints {scenario, calls, ledger, ledgerExists,
# ledgerFiles}. Seeds: seed/ledger-<name>.json, copied to
# .sdlc/execution/ship-<slug>-20261019T120000Z.json.
# ---------------------------------------------------------------------------

- description: "ship-step: (a) initial call emits a confirm_pipeline step beside the prepare keys"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario initial --plan plan.md"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const c = o.calls[0];
        const e = c.envelope;
        if (c.exitCode !== 0) return `FAIL: exit ${c.exitCode}: ${JSON.stringify(e).slice(0, 400)}`;
        if (e.status !== 'step') return `FAIL: status ${e.status}`;
        if (!e.step || e.step.id !== 'confirm_pipeline') return `FAIL: step ${JSON.stringify(e.step)}`;
        if (!e.context || !('sdlcGitignored' in e.context)) return 'FAIL: prepare key context.sdlcGitignored missing';
        for (const k of ['errors', 'warnings', 'flags', 'steps', 'validation', 'resume', 'llm_decision', 'state_file', 'progress', 'ext']) {
          if (!(k in e)) return `FAIL: key ${k} missing`;
        }
        if (!e.llm_decision || e.llm_decision.type !== 'confirm') return `FAIL: llm_decision ${JSON.stringify(e.llm_decision)}`;
        if (!e.progress || e.progress.completed !== 0 || !(e.progress.total > 0)) return `FAIL: progress ${JSON.stringify(e.progress)}`;
        return true;

- description: "ship-step: (f) fresh initial call creates the ledger with frozen planFile/openspecContext/sources and empty history"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario initial --plan plan.md"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const e = o.calls[0].envelope;
        if (!o.ledgerExists) return 'FAIL: no ledger created';
        if (!e.state_file || !/ship-feat-ship-\d{8}T\d{6}Z\.json$/.test(e.state_file)) return `FAIL: state_file ${e.state_file}`;
        for (const k of ['planFile', 'openspecContext', 'sources']) {
          if (!o.ledger.flagsKeys.includes(k)) return `FAIL: ledger.flags lacks ${k}`;
        }
        if (!/plan\.md$/.test(o.ledger.flags.planFile)) return `FAIL: planFile ${o.ledger.flags.planFile}`;
        if (o.ledger.history.length !== 0) return `FAIL: history ${JSON.stringify(o.ledger.history)}`;
        if (o.ledger.currentStep !== 'confirm_pipeline') return `FAIL: currentStep ${o.ledger.currentStep}`;
        // L2: reconcile inserts every computeSteps name (cleanup excluded)
        for (const n of ['learnings-commit', 'verify-openspec', 'archive-openspec']) {
          if (!(n in o.ledger.stepStatuses)) return `FAIL: steps[] lacks ${n}`;
        }
        if ('cleanup' in o.ledger.stepStatuses) return 'FAIL: cleanup must live in history only';
        return true;

- description: "ship-step: (g) resumed legacy ledger gets the frozen keys filled once; a second call leaves them unchanged"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario legacy-twice --plan plan.md --seed legacy"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        if (o.calls.length !== 2) return `FAIL: calls ${o.calls.length}`;
        const [a, b] = o.calls.map(c => c.stateFlags);
        if (!a || !b) return `FAIL: no ledger flags after a call: ${JSON.stringify(o.calls.map(c => c.envelope.state_file))}`;
        for (const k of ['planFile', 'openspecContext', 'sources']) {
          if (!(k in a)) return `FAIL: ${k} not filled by the resume call`;
          if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) return `FAIL: ${k} changed on the second call`;
        }
        // The resumed legacy ledger is reused, not re-inited.
        if (o.ledgerFiles.length !== 1 || o.ledgerFiles[0] !== 'ship-feat-ship-20261019T120000Z.json') return `FAIL: ledger files ${o.ledgerFiles}`;
        if (o.calls.some(c => c.envelope.state_file !== o.calls[0].envelope.state_file)) return 'FAIL: state_file differs between calls';
        return true;

