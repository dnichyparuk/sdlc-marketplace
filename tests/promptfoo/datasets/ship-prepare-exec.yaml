        if (d.invocation !== `skill: "execute-plan-sdlc", args: "${d.args}"`) return `FAIL: invocation ${d.invocation}`;
        if ((d.args.match(/--resume/g) || []).length !== 1) return `FAIL: --resume count in ${d.args}`;
        return true;

