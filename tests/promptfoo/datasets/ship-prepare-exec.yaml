# R78 / W8.41: the Step 6 summary carries commits[] and reviewSummaryPath.
- description: "ship-summary-commits: (a) a walked run lists the commit step with its subject"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
