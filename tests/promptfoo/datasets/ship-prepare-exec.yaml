        const idOf = { commit: 'dispatch_commit', review: 'dispatch_review', execute: 'dispatch_execute', version: 'dispatch_version', pr: 'dispatch_pr', cleanup: 'cleanup' };
        const expected = init.steps.filter(s => s.status === 'will_run').map(s => idOf[s.name] || s.name);
        const emitted = o.calls.slice(1).map(c => c.envelope).filter(e => e.status === 'step').map(e => e.step.id);
        if (JSON.stringify(emitted) !== JSON.stringify(expected)) return `FAIL: emitted ${emitted} vs initial ${expected}`;
        const last = o.calls[o.calls.length - 1].envelope;
        if (last.status !== 'done') return `FAIL: walk did not reach done: ${JSON.stringify(last).slice(0, 300)}`;
        const totals = o.calls.map(c => c.envelope.progress && c.envelope.progress.total);
        if (totals.some(t => t !== totals[0])) return `FAIL: totals ${totals}`;
        // No --ttl-days on the initial call → the cleanup command forwards none.
        const cleanup = o.calls.map(c => c.envelope).find(e => e.step && e.step.id === 'cleanup');
        if (/--ttl-days/.test(cleanup.step.data.commands[0])) return `FAIL: unexpected --ttl-days: ${cleanup.step.data.commands[0]}`;
        return true;

