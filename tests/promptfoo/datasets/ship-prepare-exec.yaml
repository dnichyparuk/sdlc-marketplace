        const dryW = pick(dry);
        if (!dryW || !/Use --resume to resume explicitly\./.test(dryW)) return `FAIL: dry-run warning ${dryW}`;
        const realW = pick(real);
        if (!realW) return `FAIL: no different-worktree warning: ${JSON.stringify(real.warnings)}`;
