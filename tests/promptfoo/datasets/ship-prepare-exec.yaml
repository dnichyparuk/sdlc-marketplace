# Script execution tests for the skill/ship.js prepare output (no LLM): ship.js runs against fixture
# directories, or through run-ship-prepare-ledger.js, run-ship-prepare-plan-fields.js, state/ship.js and
# test-ship-gc-explore-tempdirs.js. Covers the pipeline plan, flag merging and forwarding, config
# migration, review thresholds, step models, bump, resume flags, the ledger and workspace detection.
- description: "ship-prepare: .sdlc/.gitignore inner pattern sets sdlcGitignored true"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/ship.js"
    script_args: "--has-plan"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-sdlc-gitignore-inner"
  assert:
    - type: icontains
      value: '"sdlcGitignored": true'
    # from: ship-prepare: computeSteps includes model field per step
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const e = o.steps.find(s => s.name === 'execute');
        return e && e.model === 'sonnet' && e.effort === 'high' ? true : `FAIL: ${JSON.stringify(e)}`;
    - type: icontains
      value: '"model": "haiku"'
    - type: icontains
      value: '"model": "sonnet"'
    - type: icontains
      value: '"agent": "sdlc:ship-step-commit"'
    - type: icontains
      value: '"effort": "low"'
    # from: ship-prepare: BUILT_IN_DEFAULTS resolve to balanced steps (no version) when no config exists
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const expected = ['execute','commit','review','archive-openspec','pr','learnings-commit'];
        return JSON.stringify(o.flags.steps) === JSON.stringify(expected)
    - type: icontains
      value: '"bump": "patch"'
    - type: icontains
      value: '"draft": false'
    - type: icontains
      value: '"auto": false'
    - type: icontains
      value: '"reviewThreshold": "high"'
    - type: icontains
      value: '"rebase": "skip"'
    # from: ship-prepare: no openspec emits null openspecAuthoritative
    - type: icontains
      value: '"openspecDetected": false'
    - type: icontains
      value: '"openspecAuthoritative": null'
    # from: ship-prepare: archive-openspec step appears between version and pr
    - type: javascript
      value: |
        const steps = JSON.parse(output).steps.map(s => s.name);
        const vIdx = steps.indexOf('version');
        const aoIdx = steps.indexOf('archive-openspec');
        const prIdx = steps.indexOf('pr');
        return vIdx < aoIdx && aoIdx < prIdx
    # from: ship-prepare: BUILT_IN_DEFAULTS do not include verify-openspec (opt-in only)
    - type: javascript
      value: |
        const steps = JSON.parse(output).flags.steps;
        return !steps.includes('verify-openspec')
    # from: ship-prepare: no --quality means no quality forwarded to execute
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const exec = o.steps.find(s => s.name === 'execute');
        return o.flags.quality === undefined
          && !exec.args.includes('--quality')
          && !exec.args.includes('--preset')
    # from: ship-prepare: without --auto received-review and version pause
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const rr = o.steps.find(s => s.name === 'received-review');
        const v = o.steps.find(s => s.name === 'version');
        return rr.pause === true && v.pause === true
    # from: ship-prepare: v4 BUILT_IN_DEFAULTS (verify-pipeline excluded) -> skipped with not in steps[]
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const vp = o.steps.find(s => s.name === 'verify-pipeline');
        if (!vp) return false;
        return vp.status === 'skipped' && /not in steps/.test(vp.reason);
    # from: ship-prepare (issue #292): empty cfg.ship resolves verifyPipelineTimeout=1200 from BUILT_IN_DEFAULTS
    - type: javascript
      value: |
        const o = JSON.parse(output);
        return o.flags.verifyPipelineTimeout === 1200
          && o.flags.verifyPipelineInterval === 60
          && o.flags.verifyPipelineMaxIterations === 3
          && o.flags.awaitRemoteReviewTimeout === 600
          && o.flags.awaitRemoteReviewInterval === 60
          && Array.isArray(o.flags.awaitRemoteReviewers)
          && o.flags.awaitRemoteReviewers.length === 1
          && o.flags.awaitRemoteReviewers[0] === 'copilot'
    # from: ship-prepare: flags output carries no execute tunables (W5.2)
    - type: javascript
      value: |
        const o = JSON.parse(output);
        return ['executeWaveTimeout','executeWaveInterval','executeCommitWaves'].every(k => !(k in o.flags)) && !('executeWaveTimeout' in o.flags.sources)
    # from: ship-prepare: computeSteps includes isolation field null on all steps
    - type: icontains
      value: '"isolation": null'
    - type: icontains
      value: '"reserved": true'
    - type: icontains
      value: '"name": "execute"'
    # from: ship-prepare: cleanup step has isolation null
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const cleanup = (o.steps || []).find(s => s.name === 'cleanup');
        return cleanup !== undefined && Object.prototype.hasOwnProperty.call(cleanup, 'isolation') && cleanup.isolation === null;
    # from: ship-prepare (issue #366): execute step has dispatchMode=agent
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const execute = (o.steps || []).find(s => s.name === 'execute');
        return execute !== undefined && execute.dispatchMode === 'agent';
    # from: ship-prepare (issue #366): all sub-skill steps (execute, commit, review, received-review, commit-fixes, version, pr) have dispatchMode=agent
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const agentSteps = ['execute', 'commit', 'review', 'received-review', 'commit-fixes', 'version', 'pr'];
        return agentSteps.every(name => {
          const step = (o.steps || []).find(s => s.name === name);
          return step !== undefined && step.dispatchMode === 'agent';
        });
    # from: ship-prepare (issue #353): inline-Bash steps (archive-openspec, learnings-commit, cleanup) all have dispatchMode=null
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const inlineSteps = ['archive-openspec', 'learnings-commit', 'cleanup'];
        return inlineSteps.every(name => {
          const step = (o.steps || []).find(s => s.name === name);
          return step !== undefined && Object.prototype.hasOwnProperty.call(step, 'dispatchMode') && step.dispatchMode === null;
        });
    # from: ship-prepare (issue #353): no --quality passed → execute step args is empty (no default quality synthesized)
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const execute = (o.steps || []).find(s => s.name === 'execute');
        return execute !== undefined && (!execute.args || !execute.args.includes('--quality'));
    # from: ship-prepare-review-auto: no --auto keeps review args --committed
    - type: javascript
      value: |
        const o = JSON.parse(output);
        return o.steps.find(s => s.name === 'review').args === '--committed';
    # from: ship-prepare (issue #353): all steps include dispatchMode field (isolation invariant extended)
    - type: javascript
      value: |
        const o = JSON.parse(output);
        return (o.steps || []).every(s => Object.prototype.hasOwnProperty.call(s, 'dispatchMode'));
    # from: ship-prepare: active-account-access — no origin remote skips probe (env unset)
    - type: icontains
      value: '"repoAccessProbed": false'
    # from: ship-prepare (R72): no --plan with execute in resolved steps hard-errors with structured missingPlanFile {id,message} before any state write
    - type: javascript
      value: |
        const o = JSON.parse(output);
        // context.planFile === null is legitimate on its own — the error comes
        // from execute being in the resolved (default) steps[] with no --plan.
        if (o.context.planFile !== null) return 'FAIL: expected context.planFile === null';
        const err = (o.errors || []).find(e => e && e.id === 'missingPlanFile');
        if (!err) return 'FAIL: no missingPlanFile error found';
        const m = err.message;
        // what failed
        if (!m.includes('cannot run the "execute" step without a plan document')) return `FAIL: missing "what": ${m}`;
        // how to fix
        if (!m.includes('--plan <path-to-plan.md>')) return `FAIL: missing "fix": ${m}`;
        // why the rule exists
        if (!m.includes('#505') || !m.includes('shared across repositories')) return `FAIL: missing "why": ${m}`;
        return true;

