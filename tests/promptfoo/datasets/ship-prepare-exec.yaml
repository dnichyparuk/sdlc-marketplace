- description: "ship-prepare (R75): the default rebase skip is written into the ledger the step emitter reads"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "-e"
    script_args: '((cp,fs,js)=>(fs.writeFileSync("plan-a.md","#\x20A\n\n###\x20Task\x201:\x20A\n"),((r)=>((out)=>console.log(JSON.stringify({status:r.status,out:out,ledger:JSON.parse(fs.readFileSync(out.state_file,"utf8"))})))(JSON.parse(fs.readFileSync(r.stdout.trim(),"utf8"))))(cp.spawnSync("node",[js,"--has-plan","--plan","plan-a.md"],{cwd:process.cwd(),encoding:"utf8"}))))(require("child_process"),require("fs"),"{{repo_root}}/plugins/sdlc-utilities/scripts/skill/ship.js")'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-sdlc-gitignore-inner"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        if (o.status !== 0) return `FAIL: exit ${o.status}`;
        if (o.out.flags.sources.rebase !== 'default') return `FAIL: source ${o.out.flags.sources.rebase}`;
        return o.ledger.flags.rebase === 'skip' ? true : `FAIL: ledger rebase ${o.ledger.flags.rebase}`;

