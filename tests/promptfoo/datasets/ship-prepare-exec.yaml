# R80: the re-run guard for the version step. The stepper seeds HEAD through its fixture repo.
- description: "ship-rerun: (version) moved HEAD stops with rerunGuard"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario rerun-version-moved --seed frozen"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-ship-stepper"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const e = o.calls[1].envelope;
        if (e.status !== 'done' || e.ext.reason !== 'pending-question') return `FAIL: ${e.status} ${e.ext && e.ext.reason} ${e.error}`;
        const q = e.ext.pendingQuestion;
        if (!q || q.id !== 'rerunGuard' || q.step !== 'version') return `FAIL: pendingQuestion ${JSON.stringify(q)}`;
        if (q.dispatchHead !== o.snapshots[0].version.dispatchHead || q.head !== o.headAfter || q.dispatchHead === q.head) return `FAIL: shas ${JSON.stringify(q)}`;
        if (JSON.stringify(q.options) !== '["record","skip"]' || 'question' in q || 'commands' in q) return `FAIL: shape ${JSON.stringify(q)}`;
        if (!o.snapshots[1].paused) return 'FAIL: ledger not paused';
        if (e.step) return 'FAIL: a step was dispatched';
        const c = e.ext.commands;
        if (c.length !== 3 || !/ complete --step version --result "release commit [0-9a-f]+ recorded by hand"$/.test(c[0]) || !/ skip --step version --reason "re-run guard: release already made"$/.test(c[1]) || c[2] !== '/sdlc:ship-sdlc --resume --auto') return `FAIL: commands ${JSON.stringify(c)}`;
        return true;

