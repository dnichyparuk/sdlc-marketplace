        const m = err.message;
        if (!m.includes('must point at a .md plan document')) return `FAIL: missing "what": ${m}`;
        if (!m.includes('Got:') || !m.includes('index.js')) return `FAIL: missing offending path: ${m}`;
        if (!m.includes('Fix: pass the plan markdown itself')) return `FAIL: missing "fix": ${m}`;
        return true;

