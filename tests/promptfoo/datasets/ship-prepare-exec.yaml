# R72/C19/R-PLANFILE (#505): explicit-only plan resolution. --plan CLI flag
# forwarded through context.planFile and into execute step args; no plan-path
# autodiscovery (no directory scan, no mtime heuristic, no settings lookup).
# Uses {{repo_root}} to reference the plan fixture file (absolute, no temp copy needed).
# ---------------------------------------------------------------------------

- description: "ship-prepare (R-PLANFILE): --plan sets context.planFile to absolute path"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/ship.js"
    script_args: "--has-plan --plan {{repo_root}}/tests/promptfoo/fixtures-fs/ship-todos/plan-3-tasks.md"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-sdlc-gitignore-inner"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        // context.planFile must be an absolute path ending in plan-3-tasks.md
        return typeof o.context.planFile === 'string' &&
               o.context.planFile.endsWith('plan-3-tasks.md') &&
               o.context.planFile.startsWith('/');

- description: "ship-prepare (R-PLANFILE): --plan injected into execute step args"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/ship.js"
    script_args: "--has-plan --plan {{repo_root}}/tests/promptfoo/fixtures-fs/ship-todos/plan-3-tasks.md"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-sdlc-gitignore-inner"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const exec = (o.steps || []).find(s => s.name === 'execute');
        return exec !== undefined &&
               typeof exec.args === 'string' &&
               exec.args.includes('--plan "') &&
               exec.args.includes('plan-3-tasks.md');

- description: "ship-prepare (R72): no --plan with execute in resolved steps hard-errors with structured missingPlanFile {id,message} before any state write"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/ship.js"
    script_args: "--has-plan"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-sdlc-gitignore-inner"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        // context.planFile === null is legitimate on its own — the error comes
        // from execute being in the resolved (default) steps[] with no --plan.
        if (o.context.planFile !== null) return 'FAIL: expected context.planFile === null';
        const err = (o.errors || []).find(e => e && e.id === 'missingPlanFile');
        if (!err) return 'FAIL: no missingPlanFile error found';
        const m = err.message;
        // what failed
        if (!m.includes('cannot run the "execute" step without a plan document')) return `FAIL: missing "what": ${m}`;
        // how to fix
        if (!m.includes('--plan <path-to-plan.md>')) return `FAIL: missing "fix": ${m}`;
        // why the rule exists
        if (!m.includes('#505') || !m.includes('shared across repositories')) return `FAIL: missing "why": ${m}`;
        return true;

- description: "ship-prepare (R72): --plan path that does not exist on disk hard-errors with planFileNotFound"
  vars:
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/ship.js"
    script_args: "--has-plan --steps commit --plan {{project_root}}/does-not-exist.md"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-sdlc-gitignore-inner"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const err = (o.errors || []).find(e => e && e.id === 'planFileNotFound');
        if (!err) return 'FAIL: no planFileNotFound error found';
        const m = err.message;
        if (!m.includes('does not exist')) return `FAIL: missing "what": ${m}`;
        if (!m.includes('Resolved to:')) return `FAIL: missing resolved path: ${m}`;
        if (!m.includes('Fix: check the path')) return `FAIL: missing "fix": ${m}`;
        return true;

- description: "ship-prepare (R72): --plan path with non-.md extension hard-errors with planFileNotMarkdown"
