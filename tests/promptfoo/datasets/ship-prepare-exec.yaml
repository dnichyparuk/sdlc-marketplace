# #9225 / R75: ship.rebase true in config maps to auto, source config.
- description: "ship-prepare (R75): config ship.rebase true resolves auto with source config"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "-e"
    script_args: '((cp,fs,path,js)=>(fs.mkdirSync(path.join(process.cwd(),".sdlc"),{recursive:true}),fs.writeFileSync(path.join(process.cwd(),".sdlc","local.json"),JSON.stringify({ship:{rebase:true}})),fs.writeFileSync(path.join(process.cwd(),"plan-a.md"),"#\x20A\n\n###\x20Task\x201:\x20A\n"),((r)=>console.log(JSON.stringify({status:r.status,out:JSON.parse(fs.readFileSync(r.stdout.trim(),"utf8"))})))(cp.spawnSync("node",[js,"--has-plan","--plan","plan-a.md"],{cwd:process.cwd(),encoding:"utf8"}))))(require("child_process"),require("fs"),require("path"),"{{repo_root}}/plugins/sdlc-utilities/scripts/skill/ship.js")'
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-sdlc-gitignore-inner"
  assert:
    - type: javascript
      value: |
        const o = JSON.parse(output);
        if (o.status !== 0) return `FAIL: exit ${o.status}`;
        const f = o.out.flags;
        return f.rebase === 'auto' && f.sources.rebase === 'config' ? true : `FAIL: rebase ${f.rebase} source ${f.sources.rebase}`;

- description: "ship-prepare (R75): --rebase auto resolves auto with source cli"
