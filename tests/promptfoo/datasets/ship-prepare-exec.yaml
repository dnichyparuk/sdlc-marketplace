      value: |
        const o = JSON.parse(output);
        const last = o.calls[o.calls.length - 1].envelope;
        if (last.status !== 'done') return `FAIL: last ${JSON.stringify(last).slice(0, 300)}`;
        const s = last.ext && last.ext.summary;
        if (!s || !Array.isArray(s.commits)) return `FAIL: no commits in summary: ${JSON.stringify(s)}`;
        const c = s.commits.filter(x => x.step === 'commit');
        if (c.length !== 1) return `FAIL: commits ${JSON.stringify(s.commits)}`;
        if (typeof c[0].sha !== 'string' || typeof c[0].subject !== 'string' || !c[0].subject) return `FAIL: entry ${JSON.stringify(c[0])}`;
        return 'reviewSummaryPath' in s ? true : 'FAIL: reviewSummaryPath missing from summary';

