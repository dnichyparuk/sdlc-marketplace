- description: "ship-step: (w) dispatch_execute carries one execute todo per plan task and the execute marker"
  vars:
    script_path: "repo://tests/promptfoo/scripts/run-ship-stepper.js"
    script_args: "--project-root {{project_root}} --scenario after-confirm --seed frozen --result results/yes.json"
    script_cwd: "{{project_root}}"
