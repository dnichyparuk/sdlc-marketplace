- description: "ship-threshold: (c) no flag keeps the default high"
  vars:
    script_stub_bin: "{{repo_root}}/tests/promptfoo/fixtures-fs/stub-bin-gh/bin"
    script_path: "repo://plugins/sdlc-utilities/scripts/skill/ship.js"
    script_args: "--has-plan --plan {{repo_root}}/tests/promptfoo/fixtures-fs/ship-todos/plan-3-tasks.md"
    script_cwd: "{{project_root}}"
    project_root: "file://fixtures-fs/project-sdlc-gitignore-inner"
  assert:
    - type: javascript
      value: |
        const f = JSON.parse(output).flags;
        return f.reviewThreshold === 'high' && f.sources.reviewThreshold === 'default' ? true : `FAIL: ${f.reviewThreshold} source ${f.sources.reviewThreshold}`;
    # from: ship-prepare (R-PLANFILE): --plan sets context.planFile to absolute path
    - type: javascript
      value: |
        const o = JSON.parse(output);
        // context.planFile must be an absolute path ending in plan-3-tasks.md
        return typeof o.context.planFile === 'string' &&
               o.context.planFile.endsWith('plan-3-tasks.md') &&
               o.context.planFile.startsWith('/');
    # from: ship-prepare (R-PLANFILE): --plan injected into execute step args
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const exec = (o.steps || []).find(s => s.name === 'execute');
        return exec !== undefined &&
               typeof exec.args === 'string' &&
               exec.args.includes('--plan "') &&
               exec.args.includes('plan-3-tasks.md');
    # from: ship-nostash: commit and commit-fixes args carry --no-stash after --auto
    - type: javascript
      value: |
        const o = JSON.parse(output);
        for (const n of ['commit', 'commit-fixes']) {
          const s = (o.steps || []).find(x => x.name === n);
          if (!s || !s.args.startsWith('--auto --no-stash')) return `FAIL: ${n} args ${s && s.args}`;
          if (s.args.includes('--expected-branch') && s.args.indexOf('--no-stash') > s.args.indexOf('--expected-branch')) return `FAIL: ${n} order ${s.args}`;
        }
        return true;
    # from: ship-prepare (R-plan-commit-subject): plan without the field forwards no --subject
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const c = (o.steps || []).find(s => s.name === 'commit');
        return c !== undefined && typeof c.args === 'string' && !c.args.includes('--subject');
    # from: ship-lean: (review args) a --plan is forwarded to review
    - type: javascript
      value: |
        const o = JSON.parse(output);
        const got = o.steps.find(s => s.name === 'review').args;
        return /^--committed --plan "[^"]*plan-3-tasks\.md"$/.test(got) ? true : `FAIL: ${got}`;

