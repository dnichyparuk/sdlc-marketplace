version: "3"

tasks:
  hooks:install:
    desc: Install the local git pre-push hook (runs exec-only promptfoo suites)
    silent: true
    cmds:
      - lefthook install

  test:behavioral:
    desc: Run all promptfoo behavioral skill tests (LLM)
    silent: true
    dir: tests/promptfoo
    cmds:
      - npx --yes promptfoo@0.123.1 eval --env-file .env

  test:view:
    desc: Open promptfoo web UI to inspect test results
    silent: true
    dir: tests/promptfoo
    cmds:
      - npx --yes promptfoo@0.123.1 view --env-file .env

  test:exec:
    desc: Run script execution tests (no LLM, real scripts against fixtures)
    silent: true
    dir: tests/promptfoo
    cmds:
      - npx --yes promptfoo@0.123.1 eval --config promptfooconfig-exec.yaml --env-file .env
      - npx --yes promptfoo@0.123.1 eval --config promptfooconfig-exec-hooks.yaml --env-file .env

  test:skill:
    desc: "Run tests for specific skills (args: skill name, e.g. task test:skill -- pr-sdlc)"
    silent: true
    dir: tests/promptfoo
    cmds:
      - |
        SKILLS_DIR="../../plugins/sdlc-utilities/skills"
        if [ -n "{{.CLI_ARGS}}" ]; then
          SELECTED="{{.CLI_ARGS}}"
        else
          if ! command -v gum > /dev/null 2>&1; then
            echo "gum is required for interactive selection."
            echo "Install: brew install gum  or  https://github.com/charmbracelet/gum"
            exit 1
          fi
          SELECTED=$(ls "$SKILLS_DIR" | gum choose --no-limit --header "Select skills to test (space to toggle, enter to confirm)")
        fi
        if [ -z "$SELECTED" ]; then
          echo "No skills selected."
          exit 1
        fi
        PATTERN=$(echo "$SELECTED" | tr ' \n' '|' | sed 's/|$//')
        npx --yes promptfoo@0.123.1 eval --env-file .env --filter-pattern "^($PATTERN):"

  test:unit:
    desc: Run Node.js unit tests (no LLM)
    silent: true
    cmds:
      - node --test tests/unit/

  test:all:
    desc: Run both behavioral and exec tests
    silent: true
    cmds:
      - task: test:unit
      - task: test:behavioral
      - task: test:exec

  dbranches:
    desc: Delete all local git branches except main
    silent: true
    cmds:
      - |
        branches=$(git branch | grep -v '^\* main$' || true)
        [ -z "$branches" ] && { echo "no branches to delete"; exit 0; }
        echo "Deleting:"
        echo "$branches"
        echo "$branches" | xargs git branch -D
