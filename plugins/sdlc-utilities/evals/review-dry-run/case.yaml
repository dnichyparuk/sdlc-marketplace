schema_version: "1.1"
name: review-dry-run
context:
  scaffold_script: scaffold.sh
graders:
  - name: manifest-written
    type: file_exists
    path: .sdlc/execution/out/review-manifest-*.json
  - name: no-review-summary
    type: file_exists
    path: .sdlc/execution/review-summary-*.json
    exists: false
  - name: no-saved-review
    type: file_exists
    path: ".sdlc/reviews/*"
    exists: false
  - name: nothing-under-docs
    type: file_exists
    path: "docs/**"
    exists: false
